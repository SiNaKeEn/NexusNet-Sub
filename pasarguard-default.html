<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>{{ user.username }} - Subscription</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --font: "Inter", system-ui, sans-serif;
      --bg-base: #0a0e17;
      --bg-mid: #111827;
      --surface: rgba(30, 41, 59, 0.55);
      --surface-hover: rgba(51, 65, 85, 0.6);
      --border: rgba(255,255,255,0.08);
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --primary: #3b82f6;
      --primary-glow: rgba(59,130,246,0.25);
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --radius: 1rem;
    }
    html[data-theme="light"] {
      --bg-base: #f8fafc;
      --bg-mid: #e2e8f0;
      --surface: rgba(255,255,255,0.7);
      --surface-hover: rgba(255,255,255,0.9);
      --border: rgba(15,23,42,0.08);
      --text-primary: #0f172a;
      --text-secondary: #64748b;
      --primary: #2563eb;
    }
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body {
      font-family: var(--font);
      background: linear-gradient(145deg, var(--bg-base), var(--bg-mid));
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }
    .app {
      width: 100%;
      max-width: 460px;
      min-height: 100vh;
      padding: 1.25rem;
      padding-bottom: 6rem;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
    }
    .header h1 {
      font-size: 1.25rem;
      font-weight: 800;
    }
    .header .sub {
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-top: 0.15rem;
    }
    .icon-btn {
      width: 2.4rem; height: 2.4rem;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-primary);
      display: grid; place-items: center;
      cursor: pointer;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.1rem;
      margin-bottom: 1rem;
      backdrop-filter: blur(12px);
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.25rem 0.65rem;
      border-radius: 999px;
    }
    .status-active { background: rgba(16,185,129,0.15); color: var(--success); }
    .status-expired { background: rgba(239,68,68,0.15); color: var(--danger); }
    .status-limited { background: rgba(245,158,11,0.15); color: var(--warning); }
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      margin-top: 1rem;
    }
    .stat {
      background: rgba(0,0,0,0.15);
      border-radius: 0.75rem;
      padding: 0.85rem;
      text-align: center;
    }
    .stat .label { font-size: 0.7rem; color: var(--text-secondary); margin-bottom: 0.25rem; }
    .stat .value { font-size: 1rem; font-weight: 700; }
    .progress-wrap {
      margin-top: 1rem;
    }
    .progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      margin-bottom: 0.4rem;
    }
    .progress-bar {
      height: 8px;
      background: rgba(255,255,255,0.08);
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--primary);
      border-radius: 999px;
      transition: width 0.4s ease;
    }
    .btn-row {
      display: flex;
      gap: 0.6rem;
      margin-top: 1rem;
      flex-wrap: wrap;
    }
    .btn {
      flex: 1;
      min-width: 120px;
      padding: 0.7rem 1rem;
      border-radius: 0.75rem;
      border: none;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      transition: 0.2s;
    }
    .btn-primary {
      background: var(--primary);
      color: #fff;
    }
    .btn-secondary {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-primary);
    }
    .btn:active { transform: scale(0.97); }
    .section-title {
      font-size: 0.9rem;
      font-weight: 700;
      margin: 1.5rem 0 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .link-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem;
      background: rgba(0,0,0,0.12);
      border-radius: 0.7rem;
      margin-bottom: 0.5rem;
      gap: 0.5rem;
    }
    .link-item .name {
      font-size: 0.85rem;
      font-weight: 600;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .link-actions {
      display: flex;
      gap: 0.4rem;
    }
    .mini-btn {
      width: 2rem; height: 2rem;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-primary);
      display: grid; place-items: center;
      cursor: pointer;
      font-size: 0.8rem;
    }
    .mini-btn:hover { background: var(--primary); color: #fff; }
    .bottom-nav {
      position: fixed;
      bottom: 1rem;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 2rem);
      max-width: 430px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 1.25rem;
      display: flex;
      justify-content: space-around;
      padding: 0.6rem;
      backdrop-filter: blur(16px);
      z-index: 50;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.2rem;
      font-size: 0.7rem;
      color: var(--text-secondary);
      cursor: pointer;
      padding: 0.3rem 0.8rem;
      border-radius: 0.75rem;
    }
    .nav-item.active {
      color: var(--primary);
      background: rgba(59,130,246,0.12);
    }
    .nav-item i { font-size: 1.15rem; }
    .tab { display: none; }
    .tab.active { display: block; }
    .toast {
      position: fixed;
      top: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 0.7rem 1.2rem;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      z-index: 100;
      opacity: 0;
      transition: 0.3s;
      pointer-events: none;
    }
    .toast.show { opacity: 1; }
    #qrModal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 90;
      align-items: center;
      justify-content: center;
    }
    #qrModal.open { display: flex; }
    .qr-box {
      background: var(--bg-mid);
      border-radius: 1rem;
      padding: 1.5rem;
      text-align: center;
    }
    #qrcode { display: flex; justify-content: center; margin: 1rem 0; }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div>
        <h1 id="username">Loading...</h1>
        <div class="sub" id="statusLine"></div>
      </div>
      <button class="icon-btn" id="themeBtn" title="Toggle theme"><i class="fa-solid fa-moon"></i></button>
    </div>

    <div id="tab-home" class="tab active">
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <span class="status-badge" id="statusBadge">—</span>
          <span style="font-size:0.8rem;color:var(--text-secondary);" id="expireText"></span>
        </div>
        <div class="progress-wrap">
          <div class="progress-label">
            <span>Traffic</span>
            <span id="usageText">—</span>
          </div>
          <div class="progress-bar"><div class="progress-fill" id="usageBar" style="width:0%"></div></div>
        </div>
        <div class="stats">
          <div class="stat">
            <div class="label">Used</div>
            <div class="value" id="usedVal">—</div>
          </div>
          <div class="stat">
            <div class="label">Limit</div>
            <div class="value" id="limitVal">—</div>
          </div>
        </div>
        <div class="btn-row">
          <button class="btn btn-primary" id="copySubBtn"><i class="fa-solid fa-copy"></i> Copy Sub</button>
          <button class="btn btn-secondary" id="qrSubBtn"><i class="fa-solid fa-qrcode"></i> QR</button>
        </div>
      </div>
    </div>

    <div id="tab-configs" class="tab">
      <div class="section-title"><i class="fa-solid fa-link"></i> Configs</div>
      <div id="linksList"></div>
    </div>

    <div id="tab-apps" class="tab">
      <div class="section-title"><i class="fa-solid fa-mobile-screen"></i> Recommended Apps</div>
      <div class="card">
        <p style="font-size:0.85rem;color:var(--text-secondary);margin-bottom:0.75rem;">Install one of these clients and import your subscription.</p>
        <div class="btn-row" style="flex-direction:column;">
          <a class="btn btn-secondary" href="https://github.com/2dust/v2rayNG/releases" target="_blank"><i class="fa-brands fa-android"></i> v2rayNG (Android)</a>
          <a class="btn btn-secondary" href="https://apps.apple.com/app/id6450534064" target="_blank"><i class="fa-brands fa-apple"></i> Streisand (iOS)</a>
          <a class="btn btn-secondary" href="https://github.com/hiddify/hiddify-app/releases" target="_blank"><i class="fa-solid fa-desktop"></i> Hiddify (Desktop)</a>
          <a class="btn btn-secondary" href="https://github.com/2dust/v2rayN/releases" target="_blank"><i class="fa-brands fa-windows"></i> v2rayN (Windows)</a>
        </div>
      </div>
    </div>
  </div>

  <div class="bottom-nav">
    <div class="nav-item active" data-tab="home"><i class="fa-solid fa-house"></i><span>Home</span></div>
    <div class="nav-item" data-tab="configs"><i class="fa-solid fa-list"></i><span>Configs</span></div>
    <div class="nav-item" data-tab="apps"><i class="fa-solid fa-download"></i><span>Apps</span></div>
  </div>

  <div class="toast" id="toast"></div>
  <div id="qrModal">
    <div class="qr-box">
      <div id="qrcode"></div>
      <button class="btn btn-primary" onclick="document.getElementById('qrModal').classList.remove('open')">Close</button>
    </div>
  </div>

  <script>
    // Data injected by PasarGuard
    const USER_DATA = {{ user_data | tojson | safe }};
    const LINKS = {{ links | tojson | safe }};
    const APPS = {{ apps_data | tojson | safe }};

    const username = (USER_DATA && USER_DATA.username) || "{{ user.username }}" || "User";
    document.getElementById("username").textContent = username;

    function formatBytes(b) {
      if (!b || b <= 0) return "0 B";
      const u = ["B","KB","MB","GB","TB"];
      let i = 0;
      let v = Number(b);
      while (v >= 1024 && i < u.length-1) { v /= 1024; i++; }
      return v.toFixed(i > 1 ? 2 : 0) + " " + u[i];
    }

    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 1800);
    }

    function copyText(txt) {
      navigator.clipboard.writeText(txt).then(() => showToast("Copied!")).catch(() => showToast("Copy failed"));
    }

    // Status & usage
    if (USER_DATA) {
      const status = (USER_DATA.status || "active").toLowerCase();
      const badge = document.getElementById("statusBadge");
      badge.textContent = status.charAt(0).toUpperCase() + status.slice(1);
      if (status === "active") badge.className = "status-badge status-active";
      else if (status.includes("expir") || status === "disabled") badge.className = "status-badge status-expired";
      else badge.className = "status-badge status-limited";

      const used = USER_DATA.used_traffic || 0;
      const limit = USER_DATA.data_limit || 0;
      document.getElementById("usedVal").textContent = formatBytes(used);
      document.getElementById("limitVal").textContent = limit ? formatBytes(limit) : "Unlimited";
      document.getElementById("usageText").textContent = limit ? Math.min(100, Math.round(used/limit*100)) + "%" : "∞";
      document.getElementById("usageBar").style.width = limit ? Math.min(100, used/limit*100) + "%" : "0%";

      if (USER_DATA.expire) {
        const exp = new Date(USER_DATA.expire * 1000);
        const days = Math.ceil((exp - Date.now()) / 86400000);
        document.getElementById("expireText").textContent = days > 0 ? days + " days left" : "Expired";
      } else {
        document.getElementById("expireText").textContent = "No expiry";
      }
    }

    // Subscription URL (first link or construct)
    let subUrl = window.location.href.split("?")[0];
    if (LINKS && LINKS.length) {
      // Prefer a subscription-style link if present, else first
      subUrl = LINKS[0];
    }

    document.getElementById("copySubBtn").onclick = () => copyText(subUrl);
    document.getElementById("qrSubBtn").onclick = () => {
      const box = document.getElementById("qrcode");
      box.innerHTML = "";
      new QRCode(box, { text: subUrl, width: 180, height: 180 });
      document.getElementById("qrModal").classList.add("open");
    };

    // Links list
    const list = document.getElementById("linksList");
    if (LINKS && LINKS.length) {
      LINKS.forEach((link, i) => {
        const name = (link.split("#")[1] || ("Config " + (i+1))).substring(0, 40);
        const el = document.createElement("div");
        el.className = "link-item";
        el.innerHTML = `
          <span class="name">${name}</span>
          <div class="link-actions">
            <button class="mini-btn" title="Copy"><i class="fa-solid fa-copy"></i></button>
            <button class="mini-btn" title="QR"><i class="fa-solid fa-qrcode"></i></button>
          </div>`;
        el.querySelectorAll(".mini-btn")[0].onclick = () => copyText(link);
        el.querySelectorAll(".mini-btn")[1].onclick = () => {
          const box = document.getElementById("qrcode");
          box.innerHTML = "";
          new QRCode(box, { text: link, width: 180, height: 180 });
          document.getElementById("qrModal").classList.add("open");
        };
        list.appendChild(el);
      });
    } else {
      list.innerHTML = '<div class="card" style="text-align:center;color:var(--text-secondary);">No configs available</div>';
    }

    // Tabs
    document.querySelectorAll(".nav-item").forEach(item => {
      item.onclick = () => {
        document.querySelectorAll(".nav-item").forEach(n => n.classList.remove("active"));
        document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
        item.classList.add("active");
        document.getElementById("tab-" + item.dataset.tab).classList.add("active");
      };
    });

    // Theme toggle
    document.getElementById("themeBtn").onclick = () => {
      const html = document.documentElement;
      const next = html.getAttribute("data-theme") === "dark" ? "light" : "dark";
      html.setAttribute("data-theme", next);
      document.getElementById("themeBtn").innerHTML = next === "dark" ? '<i class="fa-solid fa-moon"></i>' : '<i class="fa-solid fa-sun"></i>';
    };
  </script>
</body>
</html>
