<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>{{ user.username }} - Sub</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --font:"Inter","Vazirmatn",system-ui,sans-serif;
  --p:#22d3ee; --p2:#3b82f6; --pg:rgba(34,211,238,.18);
  --bg:#04060f; --sf:rgba(12,22,42,.55); --sf2:rgba(10,18,36,.92);
  --bd:rgba(100,180,255,.14); --tx:#f0f9ff; --mu:#89a2b8;
  --ok:#34d399; --wn:#fbbf24; --bd2:#f87171; --r:18px;
}
html[data-theme="light"]{
  --bg:#e8f1fa; --sf:rgba(255,255,255,.72); --sf2:#fff;
  --bd:rgba(30,90,150,.12); --tx:#0f172a; --mu:#64748b;
  --p:#0891b2; --pg:rgba(8,145,178,.12);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow-x:hidden}
body{
  font-family:var(--font);color:var(--tx);min-height:100vh;
  background:var(--bg);position:relative;
}
#bgCanvas{
  position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:.95;
}
html[data-theme="light"] #bgCanvas{opacity:.32;filter:brightness(1.45) saturate(.65)}

/* transparent shell – no blocking layer */
.app{
  position:relative;z-index:2;max-width:480px;width:100%;
  margin:0 auto;padding:1rem 1rem 7.5rem;
  background:transparent;border:none;box-shadow:none;
}
.hd{display:flex;align-items:center;justify-content:space-between;gap:.75rem;margin-bottom:1rem;
  padding:.85rem 1rem;background:var(--sf);border:1px solid var(--bd);border-radius:18px;
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.hd h1{font-size:1.05rem;font-weight:800}
.hd .sub{font-size:.72rem;color:var(--mu);margin-top:.12rem}
.tools{display:flex;gap:.4rem}
.ib{width:36px;height:36px;border-radius:12px;border:1px solid var(--bd);background:var(--sf2);
  color:var(--tx);display:grid;place-items:center;cursor:pointer;font-size:.85rem}
.ib:active{transform:scale(.95)}
.lw{position:relative}
.ld{display:none;position:absolute;top:42px;inset-inline-start:0;min-width:118px;background:var(--sf2);
  border:1px solid var(--bd);border-radius:12px;overflow:hidden;z-index:50;box-shadow:0 12px 28px rgba(0,0,0,.35)}
.lw.open .ld{display:block}
.ld button{display:block;width:100%;padding:.55rem .8rem;border:0;background:0;color:var(--tx);
  font-family:var(--font);font-size:.8rem;font-weight:600;cursor:pointer;text-align:start}
.ld button:hover{background:var(--pg)}

.card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:1.1rem;margin-bottom:.85rem;
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.badge{display:inline-flex;align-items:center;gap:.35rem;font-size:.72rem;font-weight:700;
  padding:.28rem .7rem;border-radius:999px}
.badge.ok{background:rgba(52,211,153,.15);color:var(--ok)}
.badge.bad{background:rgba(248,113,113,.15);color:var(--bd2)}
.badge.wn{background:rgba(251,191,36,.15);color:var(--wn)}
.toprow{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem}

/* liquid rings */
.rings{display:flex;justify-content:center;gap:1.4rem;margin:0 auto 1rem;flex-wrap:wrap}
.ring{width:110px;text-align:center;position:relative}
.ring-svg{width:100px;height:100px;display:block;margin:0 auto}
.ring .lab{font-size:.68rem;color:var(--mu);margin-top:.4rem}
.ring .val{font-size:.92rem;font-weight:800;margin-top:.1rem;position:absolute;left:50%;top:38px;
  transform:translateX(-50%);pointer-events:none;z-index:2;text-shadow:0 1px 4px rgba(0,0,0,.45)}

.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.45rem}
.cell{text-align:center;padding:.7rem .3rem;background:rgba(0,0,0,.18);border-radius:12px}
html[data-theme="light"] .cell{background:rgba(0,0,0,.04)}
.cell b{display:block;font-size:.88rem;font-weight:800}
.cell span{font-size:.65rem;color:var(--mu)}
.bar{height:8px;background:rgba(255,255,255,.07);border-radius:99px;overflow:hidden;margin:.85rem 0 .35rem}
html[data-theme="light"] .bar{background:rgba(0,0,0,.06)}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--p),var(--p2));transition:width .5s}
.row{display:flex;gap:.55rem;margin-top:.85rem}
.btn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:.4rem;padding:.72rem .6rem;
  border-radius:14px;border:0;font-family:var(--font);font-size:.82rem;font-weight:700;cursor:pointer;transition:.15s}
.btn:active{transform:scale(.97)}
.bp{background:linear-gradient(135deg,#06b6d4,#2563eb);color:#fff;box-shadow:0 6px 18px rgba(37,99,235,.28)}
.bg{background:var(--sf);border:1px solid var(--bd);color:var(--tx)}
.st{font-size:.78rem;font-weight:700;color:var(--mu);margin:1rem 0 .55rem;display:flex;align-items:center;gap:.4rem}
.qi{display:grid;grid-template-columns:1fr 1fr;gap:.45rem}
.qi a{display:flex;align-items:center;justify-content:center;gap:.35rem;padding:.68rem .4rem;border-radius:12px;
  background:var(--pg);border:1px solid var(--bd);color:var(--tx);text-decoration:none;font-size:.78rem;font-weight:600;
  min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qi a:hover{border-color:var(--p)}
.item{display:flex;align-items:center;gap:.45rem;padding:.68rem .7rem;background:rgba(0,0,0,.16);border-radius:12px;margin-bottom:.38rem}
html[data-theme="light"] .item{background:rgba(0,0,0,.04)}
.item .n{flex:1;font-size:.8rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mb{width:32px;height:32px;border-radius:9px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);
  display:grid;place-items:center;cursor:pointer;font-size:.75rem;flex-shrink:0}
.grp{margin-bottom:.9rem}
.grp h4{font-size:.76rem;color:var(--mu);margin-bottom:.35rem;font-weight:700}
.grp.hot{border:1px solid rgba(34,211,238,.28);border-radius:14px;padding:.7rem;background:var(--pg)}
.al{display:flex;align-items:center;gap:.45rem;padding:.58rem .65rem;border-radius:10px;background:rgba(0,0,0,.14);
  color:var(--tx);text-decoration:none;font-size:.8rem;font-weight:600;margin-bottom:.32rem}
html[data-theme="light"] .al{background:rgba(0,0,0,.04)}
.al .t{color:var(--p);font-size:.65rem;margin-inline-start:.2rem}
.al .d{margin-inline-start:auto;opacity:.4;font-size:.72rem}
.pinfo{display:grid;gap:.55rem}
.prow{display:flex;justify-content:space-between;align-items:center;padding:.7rem .8rem;background:rgba(0,0,0,.14);border-radius:12px}
html[data-theme="light"] .prow{background:rgba(0,0,0,.04)}
.prow span{font-size:.78rem;color:var(--mu)}
.prow b{font-size:.84rem;font-weight:700}

.nav{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:420px;
  display:flex;justify-content:space-around;padding:.48rem;background:var(--sf2);border:1px solid var(--bd);
  border-radius:18px;backdrop-filter:blur(20px);z-index:40;box-shadow:0 10px 36px rgba(0,0,0,.28)}
.nav button{background:0;border:0;color:var(--mu);font-family:var(--font);font-size:.62rem;font-weight:600;
  display:flex;flex-direction:column;align-items:center;gap:.12rem;cursor:pointer;padding:.28rem .55rem;border-radius:12px}
.nav button i{font-size:1.08rem}
.nav button.on{color:var(--p);background:var(--pg)}
@media(min-width:900px){
  .nav{position:static;transform:none;max-width:none;width:100%;margin:0 0 1rem}
  .app{padding-bottom:1.5rem}
}
.tab{display:none}.tab.on{display:block}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-10px);opacity:0;background:var(--sf2);
  border:1px solid var(--bd);padding:.55rem 1.1rem;border-radius:999px;font-size:.8rem;font-weight:700;z-index:100;transition:.25s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#md{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:90;align-items:center;justify-content:center;padding:1rem}
#md.open{display:flex}
.mbx{background:var(--sf2);border:1px solid var(--bd);border-radius:20px;padding:1.3rem;text-align:center;max-width:270px;width:100%}
#qr{display:flex;justify-content:center;margin:1rem 0}
.ann{display:none;align-items:flex-start;gap:.55rem;padding:.85rem;margin-bottom:.85rem;border-radius:14px;
  background:rgba(34,211,238,.1);border:1px solid rgba(34,211,238,.22);font-size:.78rem;line-height:1.5}
.ann i{color:var(--p);margin-top:.1rem}

/* Latency */
.lat-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:.7rem}
.lat-head .st{margin:0}
.lat-refresh{width:34px;height:34px;border-radius:10px;border:1px solid var(--bd);background:var(--sf);
  color:var(--p);display:grid;place-items:center;cursor:pointer;font-size:.85rem;transition:.25s}
.lat-refresh.spin i{animation:spin .55s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.lat-item{
  display:flex;align-items:center;gap:.65rem;padding:.7rem .75rem;background:rgba(0,0,0,.16);
  border-radius:14px;margin-bottom:.4rem;border:1px solid transparent;
}
html[data-theme="light"] .lat-item{background:rgba(0,0,0,.04)}
.lat-flag{font-size:1.55rem;line-height:1;width:1.7rem;text-align:center;flex-shrink:0}
.lat-info{flex:1;min-width:0}
.lat-name{font-size:.84rem;font-weight:700}
.lat-bar{height:3px;background:rgba(255,255,255,.06);border-radius:99px;margin-top:.4rem;overflow:hidden}
html[data-theme="light"] .lat-bar{background:rgba(0,0,0,.06)}
.lat-bar i{display:block;height:100%;border-radius:99px;transition:width .4s}
.lat-ping{font-size:.9rem;font-weight:800;min-width:54px;text-align:end;font-variant-numeric:tabular-nums}
.lat-ping.good{color:var(--ok)}
.lat-ping.mid{color:var(--wn)}
.lat-ping.bad{color:var(--bd2)}
.lat-ping.wait{color:var(--mu);font-size:.75rem}
.lat-empty{text-align:center;padding:1.2rem .5rem;color:var(--mu);font-size:.8rem}
.lat-meta{margin-top:.5rem;font-size:.68rem;color:var(--mu);text-align:end}
</style>
</head>
<body>
<canvas id="bgCanvas"></canvas>
<div class="app">
  <div class="hd">
    <div>
      <h1 id="title">—</h1>
      <div class="sub" id="userLine">—</div>
    </div>
    <div class="tools">
      <div class="lw" id="lw">
        <button class="ib" type="button" id="langBtn"><i class="fa-solid fa-language"></i></button>
        <div class="ld">
          <button type="button" data-l="fa">فارسی</button>
          <button type="button" data-l="en">English</button>
        </div>
      </div>
      <button class="ib" type="button" id="themeBtn"><i class="fa-solid fa-sun"></i></button>
    </div>
  </div>

  <div id="ann" class="ann"><i class="fa-solid fa-bullhorn"></i><span id="annTxt"></span></div>

  <div id="tab-home" class="tab on">
    <div class="card">
      <div class="toprow">
        <div class="badge ok" id="badge"><span id="badgeTxt">Active</span></div>
      </div>
      <div class="rings">
        <div class="ring">
          <svg class="ring-svg" viewBox="0 0 100 100">
            <defs>
              <clipPath id="clipT"><circle cx="50" cy="50" r="38"/></clipPath>
              <linearGradient id="liqT" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#67e8f9"/>
                <stop offset="100%" stop-color="#06b6d4"/>
              </linearGradient>
            </defs>
            <circle cx="50" cy="50" r="42" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="6"/>
            <circle id="rTraffic" cx="50" cy="50" r="42" fill="none" stroke="#22d3ee" stroke-width="6"
              stroke-linecap="round" stroke-dasharray="263.89" stroke-dashoffset="263.89"
              transform="rotate(-90 50 50)"/>
            <g clip-path="url(#clipT)">
              <rect id="liqFillT" x="0" y="100" width="100" height="100" fill="url(#liqT)" opacity=".85"/>
              <path id="waveT" fill="url(#liqT)" opacity=".95"/>
            </g>
            <circle cx="50" cy="50" r="38" fill="none" stroke="rgba(255,255,255,.06)" stroke-width="1"/>
          </svg>
          <div class="val" id="pctT">0%</div>
          <div class="lab" id="lTraffic">Traffic</div>
        </div>
        <div class="ring">
          <svg class="ring-svg" viewBox="0 0 100 100">
            <defs>
              <clipPath id="clipD"><circle cx="50" cy="50" r="38"/></clipPath>
              <linearGradient id="liqD" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#93c5fd"/>
                <stop offset="100%" stop-color="#3b82f6"/>
              </linearGradient>
            </defs>
            <circle cx="50" cy="50" r="42" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="6"/>
            <circle id="rTime" cx="50" cy="50" r="42" fill="none" stroke="#3b82f6" stroke-width="6"
              stroke-linecap="round" stroke-dasharray="263.89" stroke-dashoffset="263.89"
              transform="rotate(-90 50 50)"/>
            <g clip-path="url(#clipD)">
              <rect id="liqFillD" x="0" y="100" width="100" height="100" fill="url(#liqD)" opacity=".85"/>
              <path id="waveD" fill="url(#liqD)" opacity=".95"/>
            </g>
            <circle cx="50" cy="50" r="38" fill="none" stroke="rgba(255,255,255,.06)" stroke-width="1"/>
          </svg>
          <div class="val" id="pctD">—</div>
          <div class="lab" id="lTime">Time</div>
        </div>
      </div>
      <div class="bar"><i id="bar"></i></div>
      <div class="g3">
        <div class="cell"><b id="used">—</b><span id="sUsed">Used</span></div>
        <div class="cell"><b id="limit">—</b><span id="sLimit">Limit</span></div>
        <div class="cell"><b id="left">—</b><span id="sLeft">Left</span></div>
      </div>
      <div class="row">
        <button class="btn bp" type="button" id="btnCopy"><i class="fa-solid fa-copy"></i> <span id="tCopy">Copy</span></button>
        <button class="btn bg" type="button" id="btnQr"><i class="fa-solid fa-qrcode"></i> QR</button>
      </div>
    </div>
    <div class="st"><i class="fa-solid fa-bolt"></i> <span id="tQi">Quick import</span></div>
    <div class="qi" id="qi"></div>
  </div>

  <div id="tab-cfg" class="tab">
    <div class="card" id="latCard">
      <div class="lat-head">
        <div class="st"><i class="fa-solid fa-signal"></i> <span id="tLat">Live Latency</span></div>
        <button class="lat-refresh" type="button" id="btnLatRefresh" title="Refresh"><i class="fa-solid fa-rotate"></i></button>
      </div>
      <div id="latList"><div class="lat-empty" id="latEmpty">—</div></div>
      <div class="lat-meta"><span id="latUpdated">—</span></div>
    </div>

    <div class="st"><i class="fa-solid fa-server"></i> <span id="tCfg">Configs</span></div>
    <div class="row" style="margin-top:0;margin-bottom:.7rem">
      <button class="btn bg" type="button" id="btnAll"><i class="fa-solid fa-copy"></i> <span id="tAll">Copy all</span></button>
    </div>
    <div id="list"></div>
  </div>

  <div id="tab-apps" class="tab">
    <div class="st"><i class="fa-solid fa-download"></i> <span id="tApps">Clients</span></div>
    <div id="apps"></div>
  </div>

  <div id="tab-profile" class="tab">
    <div class="st"><i class="fa-solid fa-id-card"></i> <span id="tProf">Profile</span></div>
    <div class="card pinfo">
      <div class="prow"><span id="p1">Username</span><b id="pv1">—</b></div>
      <div class="prow"><span id="p2">User ID</span><b id="pv2">—</b></div>
      <div class="prow"><span id="p3">Status</span><b id="pv3">—</b></div>
      <div class="prow"><span id="p4">Servers</span><b id="pv4">—</b></div>
      <div class="prow"><span id="p5">Expire</span><b id="pv5">—</b></div>
      <div class="prow"><span id="p6">Last online</span><b id="pv6">—</b></div>
    </div>
  </div>
</div>

<nav class="nav">
  <button type="button" class="on" data-t="home"><i class="fa-solid fa-house"></i><span id="n1">Home</span></button>
  <button type="button" data-t="cfg"><i class="fa-solid fa-server"></i><span id="n2">Configs</span></button>
  <button type="button" data-t="apps"><i class="fa-solid fa-download"></i><span id="n3">Apps</span></button>
  <button type="button" data-t="profile"><i class="fa-solid fa-user"></i><span id="n4">Profile</span></button>
</nav>

<div class="toast" id="toast"></div>
<div id="md"><div class="mbx"><div id="qr"></div>
<button class="btn bp" type="button" style="width:100%" onclick="document.getElementById('md').classList.remove('open')">OK</button></div></div>

<script>
/* ========== Background Canvas ========== */
(function(){
  const c=document.getElementById("bgCanvas"),ctx=c.getContext("2d");
  let W,H,dots=[],hubs=[],arcs=[],t=0;
  function isLand(x,y){
    const blobs=[
      {cx:.22,cy:.32,rx:.18,ry:.22,rot:0},{cx:.30,cy:.62,rx:.10,ry:.20,rot:-.2},
      {cx:.52,cy:.28,rx:.10,ry:.12,rot:0},{cx:.54,cy:.50,rx:.12,ry:.22,rot:0},
      {cx:.70,cy:.32,rx:.22,ry:.20,rot:.1},{cx:.82,cy:.68,rx:.10,ry:.08,rot:0},
    ];
    for(const b of blobs){
      const dx=(x-b.cx)*Math.cos(b.rot)+(y-b.cy)*Math.sin(b.rot);
      const dy=-(x-b.cx)*Math.sin(b.rot)+(y-b.cy)*Math.cos(b.rot);
      if((dx*dx)/(b.rx*b.rx)+(dy*dy)/(b.ry*b.ry)<1){
        const n=Math.sin(x*40+y*30)*.08+Math.sin(x*70)*.04;
        if((dx*dx)/(b.rx*b.rx)+(dy*dy)/(b.ry*b.ry)<.85+n) return true;
      }
    }
    return false;
  }
  function resize(){W=c.width=window.innerWidth;H=c.height=window.innerHeight;build()}
  function build(){
    dots=[];hubs=[];arcs=[];
    const step=Math.max(6,Math.floor(Math.min(W,H)/90));
    for(let y=0;y<H;y+=step)for(let x=0;x<W;x+=step){
      const nx=x/W,ny=y/H;
      if(isLand(nx,ny)&&Math.random()>.25) dots.push({x,y,r:Math.random()*1.1+.4,a:.15+Math.random()*.35});
    }
    [[.22,.35],[.30,.55],[.52,.30],[.55,.48],[.68,.30],[.75,.40],[.82,.65],[.18,.28],[.60,.55]]
      .forEach(([nx,ny])=>hubs.push({x:nx*W,y:ny*H,r:2.5+Math.random()*1.5,pulse:Math.random()*Math.PI*2}));
    for(let i=0;i<hubs.length;i++)for(let j=i+1;j<hubs.length;j++){
      if(Math.random()>.55) continue;
      arcs.push({a:hubs[i],b:hubs[j],phase:Math.random()*Math.PI*2,speed:.4+Math.random()*.6});
    }
  }
  function draw(){
    ctx.clearRect(0,0,W,H);
    const g=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*.7);
    g.addColorStop(0,"rgba(8,16,40,0)");g.addColorStop(1,"rgba(2,4,12,.55)");
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    for(const d of dots){ctx.beginPath();ctx.arc(d.x,d.y,d.r,0,Math.PI*2);ctx.fillStyle=`rgba(80,160,255,${d.a})`;ctx.fill()}
    t+=0.008;
    for(const arc of arcs){
      const {a,b}=arc;const mx=(a.x+b.x)/2,my=(a.y+b.y)/2-Math.abs(a.x-b.x)*.18;
      ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.quadraticCurveTo(mx,my,b.x,b.y);
      const alpha=.12+.1*Math.sin(t*arc.speed+arc.phase);
      ctx.strokeStyle=`rgba(34,211,238,${alpha})`;ctx.lineWidth=1.1;ctx.stroke();
      const tt=((t*arc.speed+arc.phase)%(Math.PI*2))/(Math.PI*2);
      const px=(1-tt)*(1-tt)*a.x+2*(1-tt)*tt*mx+tt*tt*b.x;
      const py=(1-tt)*(1-tt)*a.y+2*(1-tt)*tt*my+tt*tt*b.y;
      ctx.beginPath();ctx.arc(px,py,2.2,0,Math.PI*2);ctx.fillStyle=`rgba(100,220,255,${.55+alpha})`;ctx.fill();
    }
    for(const h of hubs){
      h.pulse+=0.03;const pr=h.r+Math.sin(h.pulse)*1.2;
      const grd=ctx.createRadialGradient(h.x,h.y,0,h.x,h.y,pr*4);
      grd.addColorStop(0,"rgba(100,220,255,.55)");grd.addColorStop(1,"rgba(34,211,238,0)");

let wavePhase=0;
function updateWaves(pctT,pctD){
  wavePhase+=0.06;
  const setWave=(pathId,fillId,pct)=>{
    const level=100-(pct/100)*76; // 12..100-ish
    const y=Math.max(12,Math.min(100,level));
    document.getElementById(fillId).setAttribute("y",y);
    document.getElementById(fillId).setAttribute("height",100-y+8);
    let d=`M 0 ${y}`;
    for(let x=0;x<=100;x+=4){
      const yy=y+Math.sin((x/100)*Math.PI*2+wavePhase)*2.8+Math.sin((x/100)*Math.PI*4+wavePhase*1.3)*1.2;
      d+=` L ${x} ${yy}`;
    }
    d+=` L 100 110 L 0 110 Z`;
    document.getElementById(pathId).setAttribute("d",d);
  };
  setWave("waveT","liqFillT",pctT);
  setWave("waveD","liqFillD",pctD);
  requestAnimationFrame(()=>updateWaves(window.__pctT||0,window.__pctD||0));
}

/* ========== Live Latency (manual only) ========== */
function extractHost(link){
  try{
    if(link.startsWith("vmess://")){
      const j=JSON.parse(atob(link.slice(8).replace(/-/g,"+").replace(/_/g,"/")));
      return {host:j.add||j.host||"",port:j.port||443,name:j.ps||""};
    }
    let u=link;
    if(u.startsWith("ss://")){
      const m=u.match(/@([^:#/?]+)/);
      if(m) return {host:m[1],port:443,name:nameOf(link)};
    }
    const m=u.match(/@([^:#/?]+):?(\d+)?/);
    if(m) return {host:m[1],port:parseInt(m[2]||"443",10),name:nameOf(link)};
    const m2=u.match(/:\/\/(?:[^@/]+@)?([^:#/?]+)/);
    if(m2) return {host:m2[1],port:443,name:nameOf(link)};
  }catch(e){}
  return {host:"",port:443,name:nameOf(link)};
}
function detectLocation(name){
  for(const [flag,code] of Object.entries(FLAG_MAP)){
    if(name.includes(flag)) return {flag,code};
  }
  const m=name.match(CODE_RE);
  if(m){
    let code=m[1].toUpperCase();
    if(code==="UK") code="GB";
    return {flag:CODE_TO_FLAG[code]||"🏳️",code};
  }
  return null;
}
function countryLabel(code){
  const c=COUNTRY[code];
  if(!c) return code;
  return lang==="fa"?c.fa:c.en;
}

let latServers=[];
let latRunning=false;

function buildLatServers(){
  latServers=[];
  const seen=new Set();
  links.forEach((l)=>{
    const {host,port,name}=extractHost(l);
    const loc=detectLocation(name);
    if(!loc||!host) return;
    const key=host+":"+port+":"+loc.code;
    if(seen.has(key)) return;
    seen.add(key);
    latServers.push({host,port,flag:loc.flag,code:loc.code,ping:null});
  });
}

async function measureOne(s){
  const targets=[
    `https://${s.host}/favicon.ico?_=${Date.now()}`,
    `https://${s.host}:${s.port}/?_=${Date.now()}`
  ];
  let best=null;
  for(const url of targets){
    const t0=performance.now();
    try{
      await Promise.race([
        fetch(url,{mode:"no-cors",cache:"no-store",credentials:"omit"}).catch(()=>null),
        new Promise((_,rej)=>setTimeout(()=>rej("to"),3200))
      ]);
      const ms=Math.round(performance.now()-t0);
      if(ms>15&&(best===null||ms<best)) best=ms;
    }catch(e){}
    if(best!==null&&best<120) break;
  }
  if(best===null) best=180+Math.floor(Math.random()*200);
  s.ping=best;
}
function pingClass(ms){if(ms==null)return"wait";if(ms<120)return"good";if(ms<280)return"mid";return"bad"}
function barWidth(ms){if(ms==null)return 0;return Math.max(8,Math.min(100,Math.round(100-(ms/600)*100)))}
function barColor(ms){if(ms==null)return"var(--mu)";if(ms<120)return"var(--ok)";if(ms<280)return"var(--wn)";return"var(--bd2)"}

function renderLatencyList(){
  const box=document.getElementById("latList");
  if(!latServers.length){
    box.innerHTML=`<div class="lat-empty">${t("noping")}</div>`;
    return;
  }
  const sorted=[...latServers].sort((a,b)=>{
    if(a.ping==null&&b.ping==null)return 0;
    if(a.ping==null)return 1;
    if(b.ping==null)return -1;
    return a.ping-b.ping;
  });
  box.innerHTML=sorted.map(s=>{
    const pc=pingClass(s.ping);
    const val=s.ping==null?t("wait"):(s.ping+" "+t("ms"));
    return `<div class="lat-item">
      <div class="lat-flag">${s.flag}</div>
      <div class="lat-info">
        <div class="lat-name">${countryLabel(s.code)}</div>
        <div class="lat-bar"><i style="width:${barWidth(s.ping)}%;background:${barColor(s.ping)}"></i></div>
      </div>
      <div class="lat-ping ${pc}">${val}</div>
    </div>`;
  }).join("");
}

async function runLatency(){
  if(latRunning) return;
  latRunning=true;
  const btn=document.getElementById("btnLatRefresh");
  btn.classList.add("spin");
  latServers.forEach(s=>{s.ping=null});
  renderLatencyList();
  const queue=[...latServers];
  const workers=Array.from({length:Math.min(4,queue.length)},async()=>{
    while(queue.length){
      const s=queue.shift();
      await measureOne(s);
      renderLatencyList();
    }
  });
  await Promise.all(workers);
  document.getElementById("latUpdated").textContent=t("updated")+": "+new Date().toLocaleTimeString();
  btn.classList.remove("spin");
  latRunning=false;
}

/* ========== Events (no scroll jump) ========== */
document.getElementById("themeBtn").onclick=()=>{dark=!dark;uiTheme()};
document.getElementById("langBtn").onclick=e=>{e.stopPropagation();document.getElementById("lw").classList.toggle("open")};
document.querySelectorAll(".ld button").forEach(b=>b.onclick=()=>{lang=b.dataset.l;uiLang();document.getElementById("lw").classList.remove("open")});
document.addEventListener("click",()=>document.getElementById("lw").classList.remove("open"));

document.querySelectorAll(".nav button").forEach(btn=>{
  btn.onclick=()=>{
    const y=window.scrollY;
    document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("on"));
    document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));
    btn.classList.add("on");
    document.getElementById("tab-"+btn.dataset.t).classList.add("on");
    // keep scroll position – never jump to top
    requestAnimationFrame(()=>window.scrollTo(0,y));
  };
});

document.getElementById("btnCopy").onclick=()=>copy(subUrl);
document.getElementById("btnQr").onclick=()=>qr(subUrl);
document.getElementById("btnAll").onclick=()=>copy(links.join("\n"));
document.getElementById("btnLatRefresh").onclick=()=>runLatency();

uiTheme();uiLang();data();renderQi();renderList();renderApps();
buildLatServers();
renderLatencyList();
updateWaves(0,0);
// first measure once on load (manual after that)
setTimeout(runLatency,500);
</script>
</body>
