<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>{{ user.username }} - Sub</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root {
  --font: "Inter", "Vazirmatn", system-ui, sans-serif;
  --primary: #22d3ee;
  --primary-dim: rgba(34, 211, 238, 0.15);
  --primary-glow: rgba(34, 211, 238, 0.35);
  --bg: #0a1628;
  --surface: rgba(15, 30, 55, 0.65);
  --surface-solid: rgba(18, 35, 60, 0.92);
  --border: rgba(100, 180, 255, 0.12);
  --text: #f0f9ff;
  --muted: #8ba3b8;
  --ok: #34d399;
  --warn: #fbbf24;
  --bad: #f87171;
  --r: 16px;
}
html[data-theme="light"] {
  --bg: #eef5fb;
  --surface: rgba(255,255,255,0.78);
  --surface-solid: #ffffff;
  --border: rgba(30, 80, 140, 0.1);
  --text: #0f172a;
  --muted: #64748b;
  --primary: #0891b2;
  --primary-dim: rgba(8, 145, 178, 0.12);
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  font-family: var(--font);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  background-color: #04060d;
  background-image:
    radial-gradient(ellipse 80% 50% at 15% 20%, rgba(34, 211, 238, 0.14) 0%, transparent 55%),
    radial-gradient(ellipse 70% 45% at 85% 75%, rgba(59, 130, 246, 0.16) 0%, transparent 50%),
    radial-gradient(circle at 50% 50%, rgba(14, 40, 80, 0.4) 0%, transparent 70%),
    repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(34, 211, 238, 0.03) 39px, rgba(34, 211, 238, 0.03) 40px),
    repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(34, 211, 238, 0.03) 39px, rgba(34, 211, 238, 0.03) 40px),
    radial-gradient(circle, rgba(34, 211, 238, 0.09) 1px, transparent 1px),
    linear-gradient(160deg, #04060d 0%, #0a1224 45%, #060914 100%);
  background-size: 100% 100%, 100% 100%, 100% 100%, 40px 40px, 40px 40px, 28px 28px, 100% 100%;
  background-attachment: fixed;
}
html[data-theme="light"] body {
  background-color: #eef4fb;
  background-image:
    radial-gradient(ellipse 80% 50% at 15% 20%, rgba(8, 145, 178, 0.12) 0%, transparent 55%),
    radial-gradient(ellipse 70% 45% at 85% 75%, rgba(37, 99, 235, 0.1) 0%, transparent 50%),
    repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(8, 145, 178, 0.04) 39px, rgba(8, 145, 178, 0.04) 40px),
    repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(8, 145, 178, 0.04) 39px, rgba(8, 145, 178, 0.04) 40px),
    radial-gradient(circle, rgba(8, 145, 178, 0.08) 1px, transparent 1px),
    linear-gradient(160deg, #eef4fb 0%, #e0ebf7 50%, #f0f7fc 100%);
  background-size: 100% 100%, 100% 100%, 40px 40px, 40px 40px, 28px 28px, 100% 100%;
}
.wrap {
  width: 100%;
  max-width: 420px;
  min-height: 100vh;
  padding: 1.15rem 1rem 5.5rem;
}
@media (min-width: 960px) {
  .wrap {
    max-width: 880px;
    margin: 1.5rem auto;
    padding: 1.5rem 1.75rem 1.75rem;
    min-height: auto;
    background: rgba(10, 20, 40, 0.55);
    border: 1px solid var(--border);
    border-radius: 24px;
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    box-shadow: 0 25px 80px rgba(0,0,0,0.35);
  }
  html[data-theme="light"] .wrap {
    background: rgba(255,255,255,0.7);
  }
  .desk {
    display: block;
    max-width: 520px;
    margin: 0 auto;
  }
  .row {
    flex-wrap: nowrap;
  }
  .btn {
    min-width: 0;
    flex: 1 1 0;
  }
  .qi {
    grid-template-columns: 1fr 1fr;
  }
  .grid3 {
    grid-template-columns: repeat(3, 1fr);
  }
  .nav {
    position: static;
    transform: none;
    max-width: none;
    width: 100%;
    margin-bottom: 1.15rem;
  }
  /* On desktop both side columns visible for home+apps when on home tab:
     keep simple single flow - show all tabs normally */
  .tab.on { display: block; }
}
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.25rem;
  gap: 0.75rem;
}
.header h1 {
  font-size: 1.1rem;
  font-weight: 800;
  letter-spacing: 0.01em;
}
.header .meta {
  font-size: 0.75rem;
  color: var(--muted);
  margin-top: 0.2rem;
}
.htools { display: flex; gap: 0.4rem; }
.hbtn {
  width: 36px; height: 36px;
  border-radius: 11px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  display: grid; place-items: center;
  cursor: pointer;
  font-size: 0.85rem;
  backdrop-filter: blur(12px);
}
.hbtn:active { transform: scale(0.95); }
.lang-wrap { position: relative; }
.lang-dd {
  display: none;
  position: absolute;
  top: 42px;
  inset-inline-start: 0;
  min-width: 120px;
  background: var(--surface-solid);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  z-index: 50;
  box-shadow: 0 12px 30px rgba(0,0,0,0.25);
}
.lang-wrap.open .lang-dd { display: block; }
.lang-dd button {
  display: block; width: 100%;
  padding: 0.55rem 0.85rem;
  border: 0; background: transparent;
  color: var(--text);
  font-family: var(--font);
  font-size: 0.8rem;
  font-weight: 600;
  cursor: pointer;
  text-align: start;
}
.lang-dd button:hover { background: var(--primary-dim); }
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 1.15rem;
  margin-bottom: 0.9rem;
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
}
.badge {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  font-size: 0.72rem;
  font-weight: 700;
  padding: 0.28rem 0.7rem;
  border-radius: 999px;
}
.badge.ok { background: rgba(52,211,153,0.15); color: var(--ok); }
.badge.bad { background: rgba(248,113,113,0.15); color: var(--bad); }
.usage-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 0.85rem;
}
.usage-pct {
  font-size: 1.5rem;
  font-weight: 800;
  color: var(--primary);
}
.bar {
  height: 10px;
  background: rgba(255,255,255,0.06);
  border-radius: 999px;
  overflow: hidden;
  margin-bottom: 0.9rem;
}
html[data-theme="light"] .bar { background: rgba(0,0,0,0.06); }
.bar > i {
  display: block;
  height: 100%;
  width: 0%;
  border-radius: 999px;
  background: linear-gradient(90deg, #22d3ee, #3b82f6);
  transition: width 0.5s ease;
}
.grid3 {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 0.5rem;
}
.cell {
  text-align: center;
  padding: 0.65rem 0.35rem;
  background: rgba(0,0,0,0.15);
  border-radius: 12px;
}
html[data-theme="light"] .cell { background: rgba(0,0,0,0.04); }
.cell strong { display: block; font-size: 0.82rem; font-weight: 700; }
.cell span { font-size: 0.65rem; color: var(--muted); }
.row {
  display: flex;
  gap: 0.5rem;
  margin-top: 1rem;
  flex-wrap: nowrap;
}
.btn {
  flex: 1 1 0;
  min-width: 0;
  padding: 0.72rem 0.85rem;
  border-radius: 12px;
  border: 0;
  font-family: var(--font);
  font-weight: 700;
  font-size: 0.84rem;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.4rem;
}
.btn-p {
  background: linear-gradient(135deg, #06b6d4, #2563eb);
  color: #fff;
  box-shadow: 0 6px 20px rgba(37, 99, 235, 0.25);
}
.btn-g {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
}
.btn:active { transform: scale(0.97); }
.stitle {
  font-size: 0.88rem;
  font-weight: 800;
  margin: 1.15rem 0 0.65rem;
  display: flex;
  align-items: center;
  gap: 0.4rem;
}
.stitle i { color: var(--primary); }
.qi {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 0.45rem;
}
.qi a {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.qi a {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.4rem;
  padding: 0.7rem;
  border-radius: 12px;
  background: var(--primary-dim);
  border: 1px solid var(--border);
  color: var(--text);
  text-decoration: none;
  font-size: 0.8rem;
  font-weight: 600;
}
.qi a:hover { border-color: var(--primary); }
.item {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.7rem 0.75rem;
  background: rgba(0,0,0,0.14);
  border-radius: 12px;
  margin-bottom: 0.4rem;
}
html[data-theme="light"] .item { background: rgba(0,0,0,0.04); }
.item .n {
  flex: 1;
  font-size: 0.8rem;
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.ib {
  width: 32px; height: 32px;
  border-radius: 9px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  display: grid; place-items: center;
  cursor: pointer;
  font-size: 0.75rem;
}
.grp { margin-bottom: 1rem; }
.grp h4 {
  font-size: 0.78rem;
  color: var(--muted);
  margin-bottom: 0.4rem;
  font-weight: 700;
}
.grp.hot {
  border: 1px solid rgba(34,211,238,0.28);
  border-radius: 14px;
  padding: 0.75rem;
  background: var(--primary-dim);
}
.al {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.6rem 0.7rem;
  border-radius: 10px;
  background: rgba(0,0,0,0.12);
  color: var(--text);
  text-decoration: none;
  font-size: 0.82rem;
  font-weight: 600;
  margin-bottom: 0.35rem;
}
html[data-theme="light"] .al { background: rgba(0,0,0,0.04); }
.al .tag {
  font-size: 0.65rem;
  color: var(--primary);
  margin-inline-start: 0.25rem;
}
.al .dl { margin-inline-start: auto; opacity: 0.45; font-size: 0.75rem; }
.nav {
  position: fixed;
  bottom: 14px;
  left: 50%;
  transform: translateX(-50%);
  width: calc(100% - 28px);
  max-width: 400px;
  display: flex;
  justify-content: space-around;
  padding: 0.5rem;
  background: var(--surface-solid);
  border: 1px solid var(--border);
  border-radius: 18px;
  backdrop-filter: blur(20px);
  z-index: 40;
  box-shadow: 0 10px 40px rgba(0,0,0,0.25);
}
.nav button {
  background: none;
  border: 0;
  color: var(--muted);
  font-family: var(--font);
  font-size: 0.65rem;
  font-weight: 600;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.15rem;
  cursor: pointer;
  padding: 0.3rem 0.7rem;
  border-radius: 12px;
}
.nav button i { font-size: 1.1rem; }
.nav button.on {
  color: var(--primary);
  background: var(--primary-dim);
}
@media (min-width: 960px) {
  .nav {
    position: static;
    transform: none;
    max-width: none;
    width: 100%;
    margin-bottom: 1.15rem;
  }
}
.tab { display: none; }
.tab.on { display: block; }
.toast {
  position: fixed;
  top: 18px;
  left: 50%;
  transform: translateX(-50%) translateY(-12px);
  opacity: 0;
  background: var(--surface-solid);
  border: 1px solid var(--border);
  padding: 0.6rem 1.15rem;
  border-radius: 999px;
  font-size: 0.82rem;
  font-weight: 700;
  z-index: 100;
  transition: 0.25s;
  pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
#modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  z-index: 90;
  align-items: center;
  justify-content: center;
  padding: 1rem;
}
#modal.open { display: flex; }
.mbox {
  background: var(--surface-solid);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 1.4rem;
  text-align: center;
  max-width: 280px;
  width: 100%;
}
#qr { display: flex; justify-content: center; margin: 1rem 0; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div>
      <h1 id="title">Subscription</h1>
      <div class="meta" id="subtitle">—</div>
    </div>
    <div class="htools">
      <div class="lang-wrap" id="langWrap">
        <button class="hbtn" type="button" id="langBtn"><i class="fa-solid fa-language"></i></button>
        <div class="lang-dd">
          <button type="button" data-l="fa">فارسی</button>
          <button type="button" data-l="en">English</button>
        </div>
      </div>
      <button class="hbtn" type="button" id="themeBtn"><i class="fa-solid fa-moon"></i></button>
    </div>
  </div>

  <nav class="nav" id="nav">
    <button type="button" class="on" data-t="home"><i class="fa-solid fa-chart-pie"></i><span id="n1">Overview</span></button>
    <button type="button" data-t="cfg"><i class="fa-solid fa-link"></i><span id="n2">Configs</span></button>
    <button type="button" data-t="apps"><i class="fa-solid fa-mobile-screen"></i><span id="n3">Apps</span></button>
  </nav>

  <div class="desk">
    <div>
      <div id="tab-home" class="tab on">
        <div class="card">
          <div class="usage-head">
            <span class="badge" id="badge"><span id="badgeTxt">—</span></span>
            <div class="usage-pct" id="pct">0%</div>
          </div>
          <div class="bar"><i id="barFill"></i></div>
          <div class="grid3">
            <div class="cell"><strong id="used">—</strong><span id="sUsed">Used</span></div>
            <div class="cell"><strong id="limit">—</strong><span id="sLimit">Limit</span></div>
            <div class="cell"><strong id="expire">—</strong><span id="sExp">Expire</span></div>
          </div>
          <div class="row">
            <button class="btn btn-p" type="button" id="btnCopy"><i class="fa-solid fa-copy"></i> <span id="tCopy">Copy</span></button>
            <button class="btn btn-g" type="button" id="btnQr"><i class="fa-solid fa-qrcode"></i> QR</button>
          </div>
        </div>
        <div class="stitle"><i class="fa-solid fa-bolt"></i> <span id="tQi">Quick import</span></div>
        <div class="qi" id="qi"></div>
      </div>

      <div id="tab-cfg" class="tab">
        <div class="stitle"><i class="fa-solid fa-server"></i> <span id="tCfg">Configs</span></div>
        <div class="row" style="margin-top:0;margin-bottom:0.75rem">
          <button class="btn btn-g" type="button" id="btnCopyAll"><i class="fa-solid fa-copy"></i> <span id="tAll">Copy all</span></button>
        </div>
        <div id="list"></div>
      </div>
    </div>

    <div id="tab-apps" class="tab">
      <div class="stitle"><i class="fa-solid fa-download"></i> <span id="tApps">Clients</span></div>
      <div id="apps"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div id="modal"><div class="mbox"><div id="qr"></div>
<button class="btn btn-p" type="button" style="width:100%" onclick="document.getElementById('modal').classList.remove('open')">OK</button>
</div></div>

<script>
const _UD = {{ user_data | tojson | safe }};
const _LINKS = {{ links | tojson | safe }};
const TV = (function(){
  const u = _UD || {};
  const linksArr = Array.isArray(_LINKS) ? _LINKS : [];
  return {
    sId: String(u.id || ""),
    enabled: (u.status === "active" || u.status === "Active") ? "true" : "false",
    isOnline: "false",
    downloadByte: String(u.used_traffic || 0),
    uploadByte: "0",
    totalByte: String(u.data_limit || 0),
    expire: u.expire ? String(u.expire) : "",
    lastOnline: "",
    subUrl: location.href.split("?")[0],
    subJsonUrl: "",
    subClashUrl: "",
    subTitle: u.username || "{{ user.username }}",
    subSupportUrl: "",
    announce: "",
    links: linksArr.join("\n"),
    emails: u.username || "{{ user.username }}",
  };
})();

const APPS = [
  {p:"Android", i:"fa-brands fa-android", a:[
    {n:"Happ", u:"https://play.google.com/store/apps/details?id=com.happproxy", r:1},
    {n:"v2rayNG", u:"https://github.com/2dust/v2rayNG/releases"},
    {n:"V2Box", u:"https://play.google.com/store/apps/details?id=dev.hexasoftware.v2box"},
    {n:"Hiddify", u:"https://github.com/hiddify/hiddify-app/releases"},
  ]},
  {p:"iOS", i:"fa-brands fa-apple", a:[
    {n:"Happ", u:"https://apps.apple.com/app/id6504287215", r:1},
    {n:"Streisand", u:"https://apps.apple.com/app/id6450534064"},
    {n:"V2Box", u:"https://apps.apple.com/app/id6446814690"},
    {n:"Shadowrocket", u:"https://apps.apple.com/app/id932747118"},
  ]},
  {p:"Windows", i:"fa-brands fa-windows", a:[
    {n:"Happ", u:"https://github.com/Happ-proxy/happ-desktop/releases", r:1},
    {n:"Throne", u:"https://github.com/throneproj/Throne/releases", r:1},
    {n:"Hiddify", u:"https://github.com/hiddify/hiddify-app/releases"},
    {n:"v2rayN", u:"https://github.com/2dust/v2rayN/releases"},
  ]},
  {p:"macOS", i:"fa-brands fa-apple", a:[
    {n:"Happ", u:"https://apps.apple.com/app/id6504287215", r:1},
    {n:"Hiddify", u:"https://github.com/hiddify/hiddify-app/releases"},
    {n:"V2Box", u:"https://apps.apple.com/app/id6446814690"},
  ]},
  {p:"Linux", i:"fa-brands fa-linux", a:[
    {n:"Happ", u:"https://github.com/Happ-proxy/happ-desktop/releases", r:1},
    {n:"Throne", u:"https://github.com/throneproj/Throne/releases", r:1},
    {n:"Hiddify", u:"https://github.com/hiddify/hiddify-app/releases"},
  ]},
];

const QI = [
  {n:"Happ", i:"fa-solid fa-bolt", s:"happ://add/{U}"},
  {n:"Hiddify", i:"fa-solid fa-shield-halved", s:"hiddify://import/{U}"},
  {n:"v2rayNG", i:"fa-brands fa-android", s:"v2rayng://install-config?url={E}"},
  {n:"V2Box", i:"fa-solid fa-box-open", s:"v2box://install-sub?url={E}&title={T}"},
];

const L = {
  fa: {n1:"نمای کلی",n2:"کانفیگ",n3:"برنامه‌ها",used:"مصرف",limit:"سقف",exp:"انقضا",copy:"کپی اشتراک",qi:"افزودن سریع",cfg:"کانفیگ‌ها",all:"کپی همه",apps:"کلاینت‌ها",on:"فعال",off:"غیرفعال",online:"آنلاین",unl:"نامحدود",days:"روز",ok:"کپی شد!",none:"موردی نیست"},
  en: {n1:"Overview",n2:"Configs",n3:"Apps",used:"Used",limit:"Limit",exp:"Expire",copy:"Copy sub",qi:"Quick import",cfg:"Configs",all:"Copy all",apps:"Clients",on:"Active",off:"Inactive",online:"Online",unl:"Unlimited",days:"days",ok:"Copied!",none:"Nothing here"}
};

let lang = localStorage.getItem("nn_lang") || "fa";
let dark = localStorage.getItem("nn_theme") !== "light";
const t = k => (L[lang]||L.en)[k]||k;
const ph = v => typeof v==="string" && v.includes("{{") && v.includes("}}");
const n = (v,f) => { const s=String(v??"").trim(); return (!s||ph(s))?f:s; };
const num = v => { const s=n(v,""); if(!s)return null; const x=Number(s.replace(/[, ]/g,"")); return isNaN(x)?null:x; };
const bytes = b => { b=+b||0; if(b<=0)return "0 B"; const u=["B","KB","MB","GB","TB"]; let i=0; while(b>=1024&&i<u.length-1){b/=1024;i++;} return b.toFixed(i>1?2:0)+" "+u[i]; };
const toast = m => { const e=document.getElementById("toast"); e.textContent=m; e.classList.add("show"); setTimeout(()=>e.classList.remove("show"),1500); };
const copy = x => navigator.clipboard.writeText(x).then(()=>toast(t("ok"))).catch(()=>toast("Error"));
const os = () => {
  const ua=(navigator.userAgent||"").toLowerCase(), p=(navigator.platform||"").toLowerCase();
  if(/android/.test(ua)) return "Android";
  if(/iphone|ipad|ipod/.test(ua)) return "iOS";
  if(/win/.test(p)||/windows/.test(ua)) return "Windows";
  if(/mac/.test(p)&&!/iphone|ipad/.test(ua)) return "macOS";
  if(/linux/.test(p)||/linux/.test(ua)) return "Linux";
  return "";
};

const subUrl = n(TV.subUrl, location.href.split("?")[0]);
const subTitle = n(TV.subTitle, "Subscription");
const links = n(TV.links,"").split(/\r?\n/).filter(Boolean);
const emails = n(TV.emails,"").split(/[,\s]+/).filter(Boolean);

function uiLang() {
  document.documentElement.lang = lang;
  document.documentElement.dir = lang==="fa" ? "rtl" : "ltr";
  ["n1","n2","n3"].forEach((id,i)=>{ document.getElementById(id).textContent = t(["n1","n2","n3"][i]); });
  document.getElementById("sUsed").textContent=t("used");
  document.getElementById("sLimit").textContent=t("limit");
  document.getElementById("sExp").textContent=t("exp");
  document.getElementById("tCopy").textContent=t("copy");
  document.getElementById("tQi").textContent=t("qi");
  document.getElementById("tCfg").textContent=t("cfg");
  document.getElementById("tAll").textContent=t("all");
  document.getElementById("tApps").textContent=t("apps");
  localStorage.setItem("nn_lang", lang);
}

function uiTheme() {
  document.documentElement.setAttribute("data-theme", dark?"dark":"light");
  document.getElementById("themeBtn").innerHTML = dark ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-solid fa-moon"></i>';
  localStorage.setItem("nn_theme", dark?"dark":"light");
}

function data() {
  document.getElementById("title").textContent = subTitle;
  document.getElementById("subtitle").textContent = emails[0] || ("ID "+n(TV.sId,"—"));

  const en = n(TV.enabled,"true");
  const on = n(TV.isOnline,"");
  const b = document.getElementById("badge");
  const bt = document.getElementById("badgeTxt");
  if (en==="false"||en==="0") { b.className="badge bad"; bt.textContent=t("off"); }
  else { b.className="badge ok"; bt.textContent=(on==="true"||on==="1")?t("online"):t("on"); }

  const d=num(TV.downloadByte)||0, u=num(TV.uploadByte)||0, tot=num(TV.totalByte)||0;
  const used=d+u;
  document.getElementById("used").textContent=bytes(used);
  document.getElementById("limit").textContent=tot?bytes(tot):t("unl");
  let pct=0;
  if(tot>0) pct=Math.min(100, Math.round(used/tot*100));
  document.getElementById("pct").textContent = tot ? pct+"%" : "∞";
  document.getElementById("barFill").style.width = tot ? pct+"%" : "0%";

  const exp=num(TV.expire);
  if(exp){
    const ms=exp<1e12?exp*1000:exp;
    const days=Math.ceil((ms-Date.now())/86400000);
    document.getElementById("expire").textContent = days>0 ? days+" "+t("days") : "0";
  } else document.getElementById("expire").textContent=t("unl");
}

function renderQi() {
  const E=encodeURIComponent(subUrl), T=encodeURIComponent(subTitle);
  document.getElementById("qi").innerHTML = QI.map(x=>{
    const href=x.s.replace("{U}",subUrl).replace("{E}",E).replace("{T}",T);
    return `<a href="${href}"><i class="${x.i}"></i>${x.n}</a>`;
  }).join("");
}

function renderList() {
  const box=document.getElementById("list");
  if(!links.length){ box.innerHTML=`<div class="card" style="text-align:center;color:var(--muted)">${t("none")}</div>`; return; }
  box.innerHTML=links.map((l,i)=>{
    const name=(l.split("#")[1]||("Config "+(i+1))).slice(0,42);
    return `<div class="item"><span class="n">${name}</span>
      <button class="ib" type="button" data-c="${i}"><i class="fa-solid fa-copy"></i></button>
      <button class="ib" type="button" data-q="${i}"><i class="fa-solid fa-qrcode"></i></button></div>`;
  }).join("");
  box.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>copy(links[+b.dataset.c]));
  box.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>qr(links[+b.dataset.q]));
}

function renderApps() {
  const cur=os();
  const sorted=[...APPS].sort((a,b)=>(a.p===cur?-1:0)-(b.p===cur?-1:0));
  document.getElementById("apps").innerHTML=sorted.map(g=>{
    const hot=g.p===cur?" hot":"";
    return `<div class="grp${hot}"><h4><i class="${g.i}"></i> ${g.p}${g.p===cur?" ·":""}</h4>
      ${g.a.map(x=>`<a class="al" href="${x.u}" target="_blank" rel="noopener">${x.n}${x.r?'<span class="tag">★</span>':''}<span class="dl"><i class="fa-solid fa-download"></i></span></a>`).join("")}
    </div>`;
  }).join("");
}

function qr(txt) {
  const el=document.getElementById("qr"); el.innerHTML="";
  new QRCode(el,{text:txt,width:180,height:180});
  document.getElementById("modal").classList.add("open");
}

document.getElementById("btnCopy").onclick=()=>copy(subUrl);
document.getElementById("btnQr").onclick=()=>qr(subUrl);
document.getElementById("btnCopyAll").onclick=()=>copy(links.join("\n"));
document.getElementById("themeBtn").onclick=()=>{ dark=!dark; uiTheme(); };
document.getElementById("langBtn").onclick=e=>{ e.stopPropagation(); document.getElementById("langWrap").classList.toggle("open"); };
document.querySelectorAll(".lang-dd button").forEach(b=>b.onclick=()=>{ lang=b.dataset.l; uiLang(); data(); document.getElementById("langWrap").classList.remove("open"); });
document.addEventListener("click",()=>document.getElementById("langWrap").classList.remove("open"));
document.querySelectorAll(".nav button").forEach(btn=>{
  btn.onclick=()=>{
    document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("on"));
    document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));
    btn.classList.add("on");
    document.getElementById("tab-"+btn.dataset.t).classList.add("on");
  };
});

uiTheme(); uiLang(); data(); renderQi(); renderList(); renderApps();
</script>
</body>
</html>
