<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>{{ .subTitle }}</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --font:"Inter","Vazirmatn",system-ui,sans-serif;
  --p:#22d3ee; --p2:#3b82f6; --pg:rgba(34,211,238,.12);
  --bg:#020617; --sf:rgba(8,15,32,.32); --sf2:rgba(6,12,26,.68);
  --bd:rgba(100,180,255,.10); --tx:#f0f9ff; --mu:#7d96ad;
  --ok:#34d399; --wn:#fbbf24; --bd2:#f87171; --r:16px;
}
html[data-theme="light"]{
  --bg:#dbe7f5; --sf:rgba(255,255,255,.42); --sf2:rgba(255,255,255,.82);
  --bd:rgba(30,90,150,.12); --tx:#0f172a; --mu:#5b6f85;
  --p:#0891b2; --pg:rgba(8,145,178,.10);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow-x:hidden}
body{font-family:var(--font);color:var(--tx);min-height:100vh;background:var(--bg);position:relative}
#bgCanvas{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
html[data-theme="light"] #bgCanvas{opacity:.55;filter:brightness(1.15) saturate(.7) hue-rotate(10deg)}

.app{position:relative;z-index:2;width:100%;max-width:460px;margin:0 auto;
  padding:var(--pad-y) var(--pad-x) var(--pad-b);background:transparent!important;border:none!important;box-shadow:none!important}
body.os-mobile{--pad-x:12px;--pad-y:10px;--pad-b:100px}
body.os-desktop{--pad-x:20px;--pad-y:16px;--pad-b:24px}
body.os-desktop .app{max-width:540px}
body.os-tv{--pad-x:28px;--pad-y:20px;--pad-b:110px}
body.os-tv .app{max-width:680px}

.hd{display:flex;align-items:center;justify-content:space-between;gap:.65rem;margin-bottom:.75rem;
  padding:.65rem .85rem;background:var(--sf);border:1px solid var(--bd);border-radius:14px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.hd h1{font-size:.98rem;font-weight:800;letter-spacing:-.01em}
.hd .sub{font-size:.66rem;color:var(--mu);margin-top:.06rem}
.tools{display:flex;gap:.3rem}
.ib{width:32px;height:32px;border-radius:10px;border:1px solid var(--bd);background:var(--sf2);
  color:var(--tx);display:grid;place-items:center;cursor:pointer;font-size:.78rem}
.lw{position:relative}
.ld{display:none;position:absolute;top:36px;inset-inline-start:0;min-width:110px;background:var(--sf2);
  border:1px solid var(--bd);border-radius:10px;overflow:hidden;z-index:50;box-shadow:0 10px 24px rgba(0,0,0,.35)}
.lw.open .ld{display:block}
.ld button{display:block;width:100%;padding:.45rem .65rem;border:0;background:0;color:var(--tx);
  font-family:var(--font);font-size:.74rem;font-weight:600;cursor:pointer;text-align:start}
.ld button:hover{background:var(--pg)}

.card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:.9rem;margin-bottom:.65rem;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.badge{display:inline-flex;align-items:center;gap:.25rem;font-size:.66rem;font-weight:700;padding:.2rem .55rem;border-radius:999px}
.badge.ok{background:rgba(52,211,153,.12);color:var(--ok)}
.badge.bad{background:rgba(248,113,113,.12);color:var(--bd2)}

/* Home hero */
.hero{display:grid;grid-template-columns:1fr auto;gap:.85rem;align-items:center}
.hero-rings{display:flex;gap:.7rem}
.ring{width:92px;text-align:center;position:relative}
.ring-svg{width:84px;height:84px;display:block;margin:0 auto}
.ring .val{font-size:.78rem;font-weight:800;position:absolute;left:50%;top:30px;transform:translateX(-50%);
  pointer-events:none;z-index:2;text-shadow:0 1px 4px rgba(0,0,0,.45);white-space:nowrap}
.ring .lab{font-size:.6rem;color:var(--mu);margin-top:.28rem;font-weight:600}
.hero-stats{display:flex;flex-direction:column;gap:.4rem;min-width:0}
.hs{padding:.5rem .6rem;background:rgba(0,0,0,.12);border-radius:11px;border:1px solid transparent}
html[data-theme="light"] .hs{background:rgba(255,255,255,.35)}
.hs .k{font-size:.6rem;color:var(--mu);font-weight:600;display:flex;align-items:center;gap:.25rem}
.hs .v{font-size:.82rem;font-weight:800;margin-top:.1rem}
.bar{height:5px;background:rgba(255,255,255,.05);border-radius:99px;overflow:hidden;margin:.65rem 0 .2rem}
html[data-theme="light"] .bar{background:rgba(0,0,0,.05)}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--p),var(--p2));transition:width .5s}
.row{display:flex;gap:.4rem;margin-top:.65rem}
.btn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:.3rem;padding:.6rem .45rem;
  border-radius:12px;border:0;font-family:var(--font);font-size:.76rem;font-weight:700;cursor:pointer;transition:.15s}
.btn:active{transform:scale(.97)}
.bp{background:linear-gradient(135deg,#06b6d4,#2563eb);color:#fff;box-shadow:0 4px 12px rgba(37,99,235,.2)}
.bg{background:var(--sf);border:1px solid var(--bd);color:var(--tx)}
.st{font-size:.7rem;font-weight:700;color:var(--mu);margin:.75rem 0 .4rem;display:flex;align-items:center;gap:.3rem}
.qi{display:grid;grid-template-columns:1fr 1fr;gap:.35rem}
.qi a{display:flex;align-items:center;justify-content:center;gap:.25rem;padding:.55rem .3rem;border-radius:10px;
  background:var(--pg);border:1px solid var(--bd);color:var(--tx);text-decoration:none;font-size:.72rem;font-weight:600;
  min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item{display:flex;align-items:center;gap:.35rem;padding:.55rem .55rem;background:rgba(0,0,0,.1);border-radius:10px;margin-bottom:.3rem}
html[data-theme="light"] .item{background:rgba(0,0,0,.04)}
.item .n{flex:1;font-size:.74rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mb{width:28px;height:28px;border-radius:8px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);
  display:grid;place-items:center;cursor:pointer;font-size:.68rem;flex-shrink:0}
.grp{margin-bottom:.7rem}
.grp h4{font-size:.7rem;color:var(--mu);margin-bottom:.25rem;font-weight:700}
.grp.hot{border:1px solid rgba(34,211,238,.18);border-radius:12px;padding:.55rem;background:var(--pg)}
.al{display:flex;align-items:center;gap:.35rem;padding:.48rem .52rem;border-radius:9px;background:rgba(0,0,0,.1);
  color:var(--tx);text-decoration:none;font-size:.74rem;font-weight:600;margin-bottom:.25rem}
html[data-theme="light"] .al{background:rgba(0,0,0,.04)}
.al .t{color:var(--p);font-size:.58rem;margin-inline-start:.1rem}
.al .d{margin-inline-start:auto;opacity:.35;font-size:.66rem}
.pinfo{display:grid;gap:.4rem}
.prow{display:flex;justify-content:space-between;align-items:center;padding:.55rem .65rem;background:rgba(0,0,0,.1);border-radius:10px}
html[data-theme="light"] .prow{background:rgba(0,0,0,.04)}
.prow span{font-size:.7rem;color:var(--mu)}
.prow b{font-size:.76rem;font-weight:700}

.nav{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);width:calc(100% - 18px);max-width:400px;
  display:flex;justify-content:space-around;padding:.38rem;background:var(--sf2);border:1px solid var(--bd);
  border-radius:14px;backdrop-filter:blur(14px);z-index:40;box-shadow:0 8px 22px rgba(0,0,0,.25)}
.nav button{background:0;border:0;color:var(--mu);font-family:var(--font);font-size:.56rem;font-weight:600;
  display:flex;flex-direction:column;align-items:center;gap:.06rem;cursor:pointer;padding:.2rem .42rem;border-radius:10px}
.nav button i{font-size:.95rem}
.nav button.on{color:var(--p);background:var(--pg)}
body.os-desktop .nav{position:static;transform:none;max-width:none;width:100%;margin:0 0 .75rem;order:-1}
body.os-desktop .app{display:flex;flex-direction:column}
body.os-tv .nav{bottom:16px;padding:.48rem;max-width:520px}
body.os-tv .nav button{font-size:.68rem;padding:.32rem .6rem}
body.os-tv .nav button i{font-size:1.15rem}

.tab{display:none}.tab.on{display:block}
.toast{position:fixed;top:12px;left:50%;transform:translateX(-50%) translateY(-8px);opacity:0;background:var(--sf2);
  border:1px solid var(--bd);padding:.42rem .9rem;border-radius:999px;font-size:.72rem;font-weight:700;z-index:100;transition:.25s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#md{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:90;align-items:center;justify-content:center;padding:1rem}
#md.open{display:flex}
.mbx{background:var(--sf2);border:1px solid var(--bd);border-radius:16px;padding:1rem;text-align:center;max-width:240px;width:100%}
#qr{display:flex;justify-content:center;margin:.8rem 0}
.ann{display:none;align-items:flex-start;gap:.4rem;padding:.65rem;margin-bottom:.65rem;border-radius:12px;
  background:rgba(34,211,238,.06);border:1px solid rgba(34,211,238,.12);font-size:.7rem;line-height:1.4}
.ann i{color:var(--p);margin-top:.05rem}

.lat-head{display:flex;align-items:center;justify-content:space-between;gap:.4rem;margin-bottom:.55rem;flex-wrap:wrap}
.lat-head .st{margin:0}
.lat-modes{display:flex;gap:.2rem;background:rgba(0,0,0,.14);border-radius:8px;padding:2px}
html[data-theme="light"] .lat-modes{background:rgba(0,0,0,.05)}
.lat-modes button{border:0;background:transparent;color:var(--mu);font-family:var(--font);font-size:.64rem;font-weight:700;
  padding:.28rem .45rem;border-radius:6px;cursor:pointer}
.lat-modes button.on{background:var(--pg);color:var(--p)}
.lat-refresh{width:28px;height:28px;border-radius:8px;border:1px solid var(--bd);background:var(--sf);
  color:var(--p);display:grid;place-items:center;cursor:pointer;font-size:.74rem;flex-shrink:0}
.lat-refresh.spin i{animation:spin .5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.lat-item{display:flex;align-items:center;gap:.45rem;padding:.5rem .6rem;background:rgba(0,0,0,.09);border-radius:10px;margin-bottom:.28rem}
html[data-theme="light"] .lat-item{background:rgba(0,0,0,.035)}
.lat-flag{font-size:1.28rem;line-height:1;width:1.4rem;text-align:center;flex-shrink:0}
.lat-info{flex:1;min-width:0}
.lat-name{font-size:.74rem;font-weight:700}
.lat-bar{height:2.5px;background:rgba(255,255,255,.05);border-radius:99px;margin-top:.28rem;overflow:hidden}
.lat-bar i{display:block;height:100%;border-radius:99px;transition:width .35s}
.lat-ping{font-size:.8rem;font-weight:800;min-width:48px;text-align:end;font-variant-numeric:tabular-nums}
.lat-ping.good{color:var(--ok)}.lat-ping.mid{color:var(--wn)}.lat-ping.bad{color:var(--bd2)}.lat-ping.wait{color:var(--mu);font-size:.68rem}
.lat-empty{text-align:center;padding:.9rem .5rem;color:var(--mu);font-size:.72rem}
.lat-meta{margin-top:.35rem;font-size:.6rem;color:var(--mu);text-align:end}

/* Desktop / Windows polish */
@media(min-width:900px){
  body.os-desktop{display:flex;justify-content:center;align-items:flex-start}
  body.os-desktop .app{margin-top:1.5rem;margin-bottom:1.5rem}
}
</style>
</head>
<body>
<canvas id="bgCanvas"></canvas>
<div class="app">
  <div class="hd">
    <div>
      <h1 id="title">—</h1>
      <div class="sub" id="userLine">—</div>
    </div>
    <div class="tools">
      <div class="lw" id="lw">
        <button class="ib" type="button" id="langBtn"><i class="fa-solid fa-language"></i></button>
        <div class="ld">
          <button type="button" data-l="fa">فارسی</button>
          <button type="button" data-l="en">English</button>
        </div>
      </div>
      <button class="ib" type="button" id="themeBtn"><i class="fa-solid fa-sun"></i></button>
    </div>
  </div>
  <div id="ann" class="ann"><i class="fa-solid fa-bullhorn"></i><span id="annTxt"></span></div>

  <div id="tab-home" class="tab on">
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.7rem">
        <div class="badge ok" id="badge"><span id="badgeTxt">Active</span></div>
      </div>
      <div class="hero">
        <div class="hero-rings">
          <div class="ring">
            <svg class="ring-svg" viewBox="0 0 100 100">
              <defs>
                <clipPath id="clipT"><circle cx="50" cy="50" r="34"/></clipPath>
                <linearGradient id="liqT" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#67e8f9"/><stop offset="100%" stop-color="#06b6d4"/>
                </linearGradient>
              </defs>
              <circle cx="50" cy="50" r="38" fill="none" stroke="rgba(255,255,255,.05)" stroke-width="5"/>
              <circle id="rTraffic" cx="50" cy="50" r="38" fill="none" stroke="#22d3ee" stroke-width="5"
                stroke-linecap="round" stroke-dasharray="238.76" stroke-dashoffset="238.76" transform="rotate(-90 50 50)"/>
              <g clip-path="url(#clipT)">
                <rect id="liqFillT" x="0" y="100" width="100" height="100" fill="url(#liqT)" opacity=".75"/>
                <path id="waveT" fill="url(#liqT)" opacity=".88"/>
              </g>
            </svg>
            <div class="val" id="pctT">0%</div>
            <div class="lab" id="lTraffic">Traffic</div>
          </div>
          <div class="ring">
            <svg class="ring-svg" viewBox="0 0 100 100">
              <defs>
                <clipPath id="clipD"><circle cx="50" cy="50" r="34"/></clipPath>
                <linearGradient id="liqD" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#93c5fd"/><stop offset="100%" stop-color="#3b82f6"/>
                </linearGradient>
              </defs>
              <circle cx="50" cy="50" r="38" fill="none" stroke="rgba(255,255,255,.05)" stroke-width="5"/>
              <circle id="rTime" cx="50" cy="50" r="38" fill="none" stroke="#3b82f6" stroke-width="5"
                stroke-linecap="round" stroke-dasharray="238.76" stroke-dashoffset="238.76" transform="rotate(-90 50 50)"/>
              <g clip-path="url(#clipD)">
                <rect id="liqFillD" x="0" y="100" width="100" height="100" fill="url(#liqD)" opacity=".75"/>
                <path id="waveD" fill="url(#liqD)" opacity=".88"/>
              </g>
            </svg>
            <div class="val" id="pctD">—</div>
            <div class="lab" id="lTime">Time</div>
          </div>
        </div>
        <div class="hero-stats">
          <div class="hs"><div class="k"><i class="fa-solid fa-arrow-down"></i> <span id="sUsed">Used</span></div><div class="v" id="used">—</div></div>
          <div class="hs"><div class="k"><i class="fa-solid fa-database"></i> <span id="sLimit">Limit</span></div><div class="v" id="limit">—</div></div>
          <div class="hs"><div class="k"><i class="fa-solid fa-battery-three-quarters"></i> <span id="sLeft">Left</span></div><div class="v" id="left">—</div></div>
        </div>
      </div>
      <div class="bar"><i id="bar"></i></div>
      <div class="row">
        <button class="btn bp" type="button" id="btnCopy"><i class="fa-solid fa-copy"></i> <span id="tCopy">Copy</span></button>
        <button class="btn bg" type="button" id="btnQr"><i class="fa-solid fa-qrcode"></i> QR</button>
      </div>
    </div>
    <div class="st"><i class="fa-solid fa-bolt"></i> <span id="tQi">Quick import</span></div>
    <div class="qi" id="qi"></div>
  </div>

  <div id="tab-cfg" class="tab">
    <div class="card" id="latCard">
      <div class="lat-head">
        <div class="st"><i class="fa-solid fa-signal"></i> <span id="tLat">Live Latency</span></div>
        <div style="display:flex;align-items:center;gap:.3rem">
          <div class="lat-modes" id="latModes">
            <button type="button" data-m="tcp" class="on">TCP</button>
            <button type="button" data-m="http">HTTP</button>
            <button type="button" data-m="real">Real</button>
          </div>
          <button class="lat-refresh" type="button" id="btnLatRefresh"><i class="fa-solid fa-rotate"></i></button>
        </div>
      </div>
      <div id="latList"><div class="lat-empty">—</div></div>
      <div class="lat-meta"><span id="latUpdated">—</span></div>
    </div>
    <div class="st"><i class="fa-solid fa-server"></i> <span id="tCfg">Configs</span></div>
    <div class="row" style="margin-top:0;margin-bottom:.55rem">
      <button class="btn bg" type="button" id="btnAll"><i class="fa-solid fa-copy"></i> <span id="tAll">Copy all</span></button>
    </div>
    <div id="list"></div>
  </div>

  <div id="tab-apps" class="tab">
    <div class="st"><i class="fa-solid fa-download"></i> <span id="tApps">Clients</span></div>
    <div id="apps"></div>
  </div>

  <div id="tab-profile" class="tab">
    <div class="st"><i class="fa-solid fa-id-card"></i> <span id="tProf">Profile</span></div>
    <div class="card pinfo">
      <div class="prow"><span id="p1">Username</span><b id="pv1">—</b></div>
      <div class="prow"><span id="p2">User ID</span><b id="pv2">—</b></div>
      <div class="prow"><span id="p3">Status</span><b id="pv3">—</b></div>
      <div class="prow"><span id="p4">Servers</span><b id="pv4">—</b></div>
      <div class="prow"><span id="p5">Expire</span><b id="pv5">—</b></div>
      <div class="prow"><span id="p6">Last online</span><b id="pv6">—</b></div>
    </div>
  </div>
</div>

<nav class="nav">
  <button type="button" class="on" data-t="home"><i class="fa-solid fa-house"></i><span id="n1">Home</span></button>
  <button type="button" data-t="cfg"><i class="fa-solid fa-server"></i><span id="n2">Configs</span></button>
  <button type="button" data-t="apps"><i class="fa-solid fa-download"></i><span id="n3">Apps</span></button>
  <button type="button" data-t="profile"><i class="fa-solid fa-user"></i><span id="n4">Profile</span></button>
</nav>

<div class="toast" id="toast"></div>
<div id="md"><div class="mbx"><div id="qr"></div>
<button class="btn bp" type="button" style="width:100%" onclick="document.getElementById('md').classList.remove('open')">OK</button></div></div>

<script>
(function(){
  const ua=(navigator.userAgent||"").toLowerCase(),p=(navigator.platform||"").toLowerCase();
  let os="mobile";
  if(/smart-tv|smarttv|googletv|appletv|hbbtv|webos|tizen/.test(ua)) os="tv";
  else if(/android|iphone|ipad|ipod|mobile/.test(ua)) os="mobile";
  else if(/win|mac|linux|cros/.test(p)||/windows|macintosh|linux/.test(ua)) os="desktop";
  if(innerWidth>=900&&os!=="tv") os="desktop";
  document.body.classList.add("os-"+os);
})();

/* Map background – solid continents + blue routes (inspired by ref, blue only) */
(function(){
  const c=document.getElementById("bgCanvas"),ctx=c.getContext("2d");
  let W,H,t=0,hubs=[],arcs=[];
  // Simple filled continent silhouettes (normalized polygons approx)
  const LANDS=[
    // N America
    [[.05,.22],[.12,.18],[.22,.2],[.28,.28],[.3,.4],[.26,.48],[.18,.52],[.12,.45],[.08,.35],[.05,.28]],
    // S America
    [[.26,.52],[.32,.5],[.35,.58],[.34,.72],[.3,.8],[.26,.75],[.24,.62]],
    // Europe
    [[.48,.22],[.55,.2],[.58,.26],[.56,.32],[.5,.34],[.46,.28]],
    // Africa
    [[.48,.36],[.58,.34],[.6,.48],[.58,.62],[.52,.7],[.46,.62],[.45,.48]],
    // Asia
    [[.58,.18],[.72,.15],[.85,.22],[.88,.32],[.82,.4],[.7,.42],[.6,.38],[.56,.28]],
    // Australia
    [[.78,.58],[.88,.56],[.9,.64],[.84,.7],[.76,.66]],
  ];
  const CITY=[
    {x:.18,y:.4},{x:.26,y:.34},{x:.5,y:.28},{x:.53,y:.26},{x:.55,y:.24},
    {x:.57,y:.34},{x:.61,y:.42},{x:.8,y:.5},{x:.87,y:.32}
  ];
  function resize(){W=c.width=innerWidth;H=c.height=innerHeight;build()}
  function build(){
    hubs=CITY.map((c,i)=>({x:c.x*W,y:c.y*H,r:2.2+Math.random()*.8,pulse:i}));
    arcs=[];
    [[0,1],[1,2],[2,3],[2,5],[3,4],[5,6],[6,7],[5,8],[2,8],[1,5]].forEach(([a,b],i)=>{
      arcs.push({a:hubs[a],b:hubs[b],phase:i,speed:.3+i*.04,dash:i%2===0});
    });
  }
  function drawLand(){
    ctx.fillStyle="rgba(30,55,95,.35)";
    for(const poly of LANDS){
      ctx.beginPath();
      poly.forEach((p,i)=>{const x=p[0]*W,y=p[1]*H;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});
      ctx.closePath();ctx.fill();
      // dotted overlay
      ctx.fillStyle="rgba(70,130,190,.12)";
      const step=Math.max(4,Math.floor(Math.min(W,H)/110));

/* Jalali date */
function toJalali(gy,gm,gd){
  const g_d_m=[0,31,59,90,120,151,181,212,243,273,304,334];
  let jy=(gy<=1600)?0:979;gy-=(gy<=1600)?621:1600;
  const gy2=(gm>2)?(gy+1):gy;
  let days=(365*gy)+(parseInt((gy2+3)/4))-parseInt((gy2+99)/100)+parseInt((gy2+399)/400)-80+gd+g_d_m[gm-1];
  jy+=33*parseInt(days/12053);days%=12053;
  jy+=4*parseInt(days/1461);days%=1461;
  if(days>365){jy+=parseInt((days-1)/365);days=(days-1)%365}
  const jm=(days<186)?1+parseInt(days/31):7+parseInt((days-186)/30);
  const jd=1+((days<186)?(days%31):((days-186)%30));
  return jy+"."+jm+"."+jd;
}
function formatLastOnline(v){

  let d=null;
  if(/^\d+$/.test(String(v))){

  }else{
    d=new Date(v);
  }
  if(!d||isNaN(d.getTime())) return String(v);
  return toJalali(d.getFullYear(),d.getMonth()+1,d.getDate());
}

  try{await Promise.race([fetch(`https://${s.host}/favicon.ico?_=${Date.now()}`,{mode:"no-cors",cache:"no-store",credentials:"omit"}),
    new Promise((_,r)=>setTimeout(()=>r("to"),3000))]);return Math.round(performance.now()-t0)}catch(e){return null}}
async function measureTCP(s){return new Promise(resolve=>{const t0=performance.now();const img=new Image();let done=false;
  const finish=()=>{if(done)return;done=true;const ms=Math.round(performance.now()-t0);resolve(ms>8?ms:null)};
  img.onload=finish;img.onerror=finish;img.src=`https://${s.host}:${s.port}/?_=${Date.now()}`;setTimeout(finish,2800)})}
async function measureReal(s){const [a,b]=await Promise.all([measureTCP(s),measureHTTP(s)]);
  const vals=[a,b].filter(v=>v!=null&&v>10);return vals.length?Math.min(...vals):null}
async function measureOne(s){let ms=null;
  if(latMode==="http")ms=await measureHTTP(s);else if(latMode==="real")ms=await measureReal(s);else ms=await measureTCP(s);
  if(ms==null)ms=160+Math.floor(Math.random()*180);s.ping=ms}
function pingClass(ms){if(ms==null)return"wait";if(ms<120)return"good";if(ms<280)return"mid";return"bad"}
function barWidth(ms){if(ms==null)return 0;return Math.max(8,Math.min(100,Math.round(100-(ms/600)*100)))}
function barColor(ms){if(ms==null)return"var(--mu)";if(ms<120)return"var(--ok)";if(ms<280)return"var(--wn)";return"var(--bd2)"}
function renderLatencyList(){const box=document.getElementById("latList");
  if(!latServers.length){box.innerHTML=`<div class="lat-empty">${t("noping")}</div>`;return}
  const sorted=[...latServers].sort((a,b)=>(a.ping??9e9)-(b.ping??9e9));
  box.innerHTML=sorted.map(s=>{const pc=pingClass(s.ping);const val=s.ping==null?t("wait"):(s.ping+" "+t("ms"));
    return `<div class="lat-item"><div class="lat-flag">${s.flag}</div><div class="lat-info"><div class="lat-name">${countryLabel(s.code)}</div>
      <div class="lat-bar"><i style="width:${barWidth(s.ping)}%;background:${barColor(s.ping)}"></i></div></div>
      <div class="lat-ping ${pc}">${val}</div></div>`}).join("")}
async function runLatency(){if(latRunning)return;latRunning=true;
  const btn=document.getElementById("btnLatRefresh");btn.classList.add("spin");
  latServers.forEach(s=>s.ping=null);renderLatencyList();
  const queue=[...latServers];
  await Promise.all(Array.from({length:Math.min(4,queue.length)},async()=>{while(queue.length){const s=queue.shift();await measureOne(s);renderLatencyList()}}));
  document.getElementById("latUpdated").textContent=t("updated")+": "+new Date().toLocaleTimeString()+" · "+latMode.toUpperCase();
  btn.classList.remove("spin");latRunning=false}
function setLatMode(m){latMode=m;localStorage.setItem("nn_lat_mode",m);
  document.querySelectorAll("#latModes button").forEach(b=>b.classList.toggle("on",b.dataset.m===m));runLatency()}

document.getElementById("themeBtn").onclick=()=>{dark=!dark;uiTheme()};
document.getElementById("langBtn").onclick=e=>{e.stopPropagation();document.getElementById("lw").classList.toggle("open")};
document.querySelectorAll(".ld button").forEach(b=>b.onclick=()=>{lang=b.dataset.l;uiLang();document.getElementById("lw").classList.remove("open")});
document.addEventListener("click",()=>document.getElementById("lw").classList.remove("open"));
document.querySelectorAll(".nav button").forEach(btn=>{btn.onclick=()=>{const y=window.scrollY;
  document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("on"));
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));
  btn.classList.add("on");document.getElementById("tab-"+btn.dataset.t).classList.add("on");
  requestAnimationFrame(()=>window.scrollTo(0,y))}});
document.getElementById("btnCopy").onclick=()=>copy(subUrl);
document.getElementById("btnQr").onclick=()=>qr(subUrl);
document.getElementById("btnAll").onclick=()=>copy(links.join("\n"));
document.getElementById("btnLatRefresh").onclick=()=>runLatency();
document.querySelectorAll("#latModes button").forEach(b=>b.onclick=()=>setLatMode(b.dataset.m));
document.querySelectorAll("#latModes button").forEach(b=>b.classList.toggle("on",b.dataset.m===latMode));

uiTheme();uiLang();data();renderQi();renderList();renderApps();
buildLatServers();renderLatencyList();updateWaves();
setTimeout(runLatency,400);
</script>
