.app{width:100%;max-width:440px;min-height:100vh;padding:1rem 1rem 6rem;position:relative}
@media(min-width:900px){
  .app{max-width:480px;margin:1.25rem auto;padding:1.25rem 1.25rem 1.5rem;min-height:auto;
    background:var(--sf);border:1px solid var(--bd);border-radius:24px;
    backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
    box-shadow:0 20px 60px rgba(0,0,0,.35)}
}
.hd{display:flex;align-items:center;justify-content:space-between;gap:.75rem;margin-bottom:1.1rem}
.hd h1{font-size:1.08rem;font-weight:800}
.hd .sub{font-size:.74rem;color:var(--mu);margin-top:.15rem}
.tools{display:flex;gap:.4rem}
.ib{width:36px;height:36px;border-radius:12px;border:1px solid var(--bd);background:var(--sf);
  color:var(--tx);display:grid;place-items:center;cursor:pointer;font-size:.85rem;backdrop-filter:blur(10px)}
.ib:active{transform:scale(.95)}
.lw{position:relative}
.ld{display:none;position:absolute;top:42px;inset-inline-start:0;min-width:118px;background:var(--sf2);
  border:1px solid var(--bd);border-radius:12px;overflow:hidden;z-index:40;box-shadow:0 12px 28px rgba(0,0,0,.3)}
.lw.open .ld{display:block}
.ld button{display:block;width:100%;padding:.55rem .8rem;border:0;background:0;color:var(--tx);
  font-family:var(--font);font-size:.8rem;font-weight:600;cursor:pointer;text-align:start}
.ld button:hover{background:var(--pg)}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:1.1rem;margin-bottom:.85rem;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.badge{display:inline-flex;align-items:center;gap:.35rem;font-size:.72rem;font-weight:700;
  padding:.28rem .7rem;border-radius:999px}
.badge.ok{background:rgba(52,211,153,.15);color:var(--ok)}
.badge.bad{background:rgba(248,113,113,.15);color:var(--bd2)}
.badge.wn{background:rgba(251,191,36,.15);color:var(--wn)}
.toprow{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem}
.rings{display:flex;justify-content:center;gap:1.25rem;margin:0 auto 1rem;flex-wrap:wrap}
.ring{width:100px;text-align:center}
.ring svg{width:88px;height:88px;transform:rotate(-90deg)}
.ring .lab{font-size:.68rem;color:var(--mu);margin-top:.35rem}
.ring .val{font-size:.95rem;font-weight:800;margin-top:.15rem}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.45rem}
.cell{text-align:center;padding:.7rem .3rem;background:rgba(0,0,0,.18);border-radius:12px}
html[data-theme="light"] .cell{background:rgba(0,0,0,.04)}
.cell b{display:block;font-size:.82rem;font-weight:700}
.cell span{font-size:.62rem;color:var(--mu)}
.bar{height:8px;background:rgba(255,255,255,.07);border-radius:99px;overflow:hidden;margin:.85rem 0 .35rem}
html[data-theme="light"] .bar{background:rgba(0,0,0,.06)}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--p),var(--p2));transition:width .5s}
.row{display:flex;gap:.45rem;margin-top:.9rem}
.btn{flex:1 1 0;min-width:0;padding:.72rem .7rem;border-radius:13px;border:0;font-family:var(--font);
  font-weight:700;font-size:.82rem;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:.35rem}
.bp{background:linear-gradient(135deg,#06b6d4,#2563eb);color:#fff;box-shadow:0 6px 18px rgba(37,99,235,.28)}
.bg{background:var(--sf);border:1px solid var(--bd);color:var(--tx)}
.btn:active{transform:scale(.97)}
.st{font-size:.88rem;font-weight:800;margin:1.05rem 0 .55rem;display:flex;align-items:center;gap:.4rem}
.st i{color:var(--p)}
.qi{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.4rem}
.qi a{display:flex;align-items:center;justify-content:center;gap:.35rem;padding:.68rem .4rem;border-radius:12px;
  background:var(--pg);border:1px solid var(--bd);color:var(--tx);text-decoration:none;font-size:.78rem;font-weight:600;
  min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qi a:hover{border-color:var(--p)}
.item{display:flex;align-items:center;gap:.45rem;padding:.68rem .7rem;background:rgba(0,0,0,.16);border-radius:12px;margin-bottom:.38rem}
html[data-theme="light"] .item{background:rgba(0,0,0,.04)}
.item .n{flex:1;font-size:.8rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mb{width:32px;height:32px;border-radius:9px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);
  display:grid;place-items:center;cursor:pointer;font-size:.75rem}
.grp{margin-bottom:.9rem}
.grp h4{font-size:.76rem;color:var(--mu);margin-bottom:.35rem;font-weight:700}
.grp.hot{border:1px solid rgba(34,211,238,.28);border-radius:14px;padding:.7rem;background:var(--pg)}
.al{display:flex;align-items:center;gap:.45rem;padding:.58rem .65rem;border-radius:10px;background:rgba(0,0,0,.14);
  color:var(--tx);text-decoration:none;font-size:.8rem;font-weight:600;margin-bottom:.32rem}
html[data-theme="light"] .al{background:rgba(0,0,0,.04)}
.al .t{color:var(--p);font-size:.65rem;margin-inline-start:.2rem}
.al .d{margin-inline-start:auto;opacity:.4;font-size:.72rem}
.pinfo{display:grid;gap:.55rem}
.prow{display:flex;justify-content:space-between;align-items:center;padding:.7rem .8rem;background:rgba(0,0,0,.14);border-radius:12px}
html[data-theme="light"] .prow{background:rgba(0,0,0,.04)}
.prow span{font-size:.78rem;color:var(--mu)}
.prow b{font-size:.84rem;font-weight:700}
.nav{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:420px;
  display:flex;justify-content:space-around;padding:.48rem;background:var(--sf2);border:1px solid var(--bd);
  border-radius:18px;backdrop-filter:blur(20px);z-index:40;box-shadow:0 10px 36px rgba(0,0,0,.28)}
.nav button{background:0;border:0;color:var(--mu);font-family:var(--font);font-size:.62rem;font-weight:600;
  display:flex;flex-direction:column;align-items:center;gap:.12rem;cursor:pointer;padding:.28rem .55rem;border-radius:12px}
.nav button i{font-size:1.08rem}
.nav button.on{color:var(--p);background:var(--pg)}
@media(min-width:900px){.nav{position:static;transform:none;max-width:none;width:100%;margin-bottom:1rem}}
.tab{display:none}.tab.on{display:block}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-10px);opacity:0;background:var(--sf2);
  border:1px solid var(--bd);padding:.55rem 1.1rem;border-radius:999px;font-size:.8rem;font-weight:700;z-index:100;transition:.25s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#md{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:90;align-items:center;justify-content:center;padding:1rem}
#md.open{display:flex}
.mbx{background:var(--sf2);border:1px solid var(--bd);border-radius:20px;padding:1.3rem;text-align:center;max-width:270px;width:100%}
#qr{display:flex;justify-content:center;margin:1rem 0}
.ann{display:none;align-items:flex-start;gap:.55rem;padding:.85rem;margin-bottom:.85rem;border-radius:14px;
  background:rgba(34,211,238,.1);border:1px solid rgba(34,211,238,.22);font-size:.8rem;line-height:1.45}
.ann i{color:var(--p);margin-top:.15rem}
</style>
</head>
<body>
<div class="app">
  <div class="hd">
    <div>
      <h1 id="title">Subscription</h1>
      <div class="sub" id="userLine">—</div>
    </div>
    <div class="tools">
      <div class="lw" id="lw">
        <button class="ib" type="button" id="langBtn"><i class="fa-solid fa-language"></i></button>
        <div class="ld">
          <button type="button" data-l="fa">فارسی</button>
          <button type="button" data-l="en">English</button>
        </div>
      </div>
      <button class="ib" type="button" id="themeBtn"><i class="fa-solid fa-moon"></i></button>
    </div>
  </div>

  <nav class="nav">
    <button type="button" class="on" data-t="home"><i class="fa-solid fa-house"></i><span id="n1">Home</span></button>
    <button type="button" data-t="cfg"><i class="fa-solid fa-link"></i><span id="n2">Configs</span></button>
    <button type="button" data-t="apps"><i class="fa-solid fa-mobile-screen"></i><span id="n3">Apps</span></button>
    <button type="button" data-t="profile"><i class="fa-solid fa-user"></i><span id="n4">Profile</span></button>
  </nav>

  <div id="ann" class="ann"><i class="fa-solid fa-bullhorn"></i><div id="annTxt"></div></div>

  <div id="tab-home" class="tab on">
    <div class="card">
      <div class="toprow">
        <span class="badge ok" id="badge"><span id="badgeTxt">—</span></span>
        <span style="font-size:.75rem;color:var(--mu)" id="expLine">—</span>
      </div>
      <div class="rings">
        <div class="ring">
          <svg viewBox="0 0 88 88"><circle cx="44" cy="44" r="36" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="8"/>
          <circle id="rTraffic" cx="44" cy="44" r="36" fill="none" stroke="#22d3ee" stroke-width="8" stroke-linecap="round" stroke-dasharray="226.08" stroke-dashoffset="226.08"/></svg>
          <div class="val" id="pctT">0%</div>
          <div class="lab" id="lTraffic">Traffic</div>
        </div>
        <div class="ring">
          <svg viewBox="0 0 88 88"><circle cx="44" cy="44" r="36" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="8"/>
          <circle id="rTime" cx="44" cy="44" r="36" fill="none" stroke="#3b82f6" stroke-width="8" stroke-linecap="round" stroke-dasharray="226.08" stroke-dashoffset="226.08"/></svg>
          <div class="val" id="pctD">—</div>
          <div class="lab" id="lTime">Time</div>
        </div>
      </div>
      <div class="bar"><i id="bar"></i></div>
      <div class="g3">
        <div class="cell"><b id="used">—</b><span id="sUsed">Used</span></div>
        <div class="cell"><b id="limit">—</b><span id="sLimit">Limit</span></div>
        <div class="cell"><b id="left">—</b><span id="sLeft">Left</span></div>
      </div>
      <div class="row">
        <button class="btn bp" type="button" id="btnCopy"><i class="fa-solid fa-copy"></i> <span id="tCopy">Copy</span></button>
        <button class="btn bg" type="button" id="btnQr"><i class="fa-solid fa-qrcode"></i> QR</button>
      </div>
    </div>
    <div class="st"><i class="fa-solid fa-bolt"></i> <span id="tQi">Quick import</span></div>
    <div class="qi" id="qi"></div>
  </div>

  <div id="tab-cfg" class="tab">
    <div class="st"><i class="fa-solid fa-server"></i> <span id="tCfg">Configs</span></div>
    <div class="row" style="margin-top:0;margin-bottom:.7rem">
      <button class="btn bg" type="button" id="btnAll"><i class="fa-solid fa-copy"></i> <span id="tAll">Copy all</span></button>
    </div>
    <div id="list"></div>
  </div>

  <div id="tab-apps" class="tab">
    <div class="st"><i class="fa-solid fa-download"></i> <span id="tApps">Clients</span></div>
    <div id="apps"></div>
  </div>

  <div id="tab-profile" class="tab">
    <div class="st"><i class="fa-solid fa-id-card"></i> <span id="tProf">Profile</span></div>
    <div class="card pinfo">
      <div class="prow"><span id="p1">Username</span><b id="pv1">—</b></div>
      <div class="prow"><span id="p2">User ID</span><b id="pv2">—</b></div>
      <div class="prow"><span id="p3">Status</span><b id="pv3">—</b></div>
      <div class="prow"><span id="p4">Servers</span><b id="pv4">—</b></div>
      <div class="prow"><span id="p5">Expire</span><b id="pv5">—</b></div>
      <div class="prow"><span id="p6">Last online</span><b id="pv6">—</b></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div id="md"><div class="mbx"><div id="qr"></div>
<button class="btn bp" type="button" style="width:100%" onclick="document.getElementById('md').classList.remove('open')">OK</button></div></div>

<script>
const TV={
  sId:"{{ .sId }}",enabled:"{{ .enabled }}",isOnline:"{{ .isOnline }}",
  downloadByte:"{{ .downloadByte }}",uploadByte:"{{ .uploadByte }}",totalByte:"{{ .totalByte }}",
  expire:"{{ .expire }}",lastOnline:"{{ .lastOnline }}",
  subUrl:"{{ .subUrl }}",subJsonUrl:"{{ .subJsonUrl }}",subClashUrl:"{{ .subClashUrl }}",
  subTitle:"{{ .subTitle }}",subSupportUrl:"{{ .subSupportUrl }}",
  announce:`{{ .announce }}`,
  links:`{{ range .links }}{{ . }}\n{{ end }}`,
  emails:`{{ range .emails }}{{ . }}\n{{ end }}`,
};
const APPS=[
  {p:"Android",i:"fa-brands fa-android",a:[{n:"Happ",u:"https://play.google.com/store/apps/details?id=com.happproxy",r:1},{n:"v2rayNG",u:"https://github.com/2dust/v2rayNG/releases"},{n:"V2Box",u:"https://play.google.com/store/apps/details?id=dev.hexasoftware.v2box"},{n:"Hiddify",u:"https://github.com/hiddify/hiddify-app/releases"}]},
  {p:"iOS",i:"fa-brands fa-apple",a:[{n:"Happ",u:"https://apps.apple.com/app/id6504287215",r:1},{n:"Streisand",u:"https://apps.apple.com/app/id6450534064"},{n:"V2Box",u:"https://apps.apple.com/app/id6446814690"},{n:"Shadowrocket",u:"https://apps.apple.com/app/id932747118"}]},
  {p:"Windows",i:"fa-brands fa-windows",a:[{n:"Happ",u:"https://github.com/Happ-proxy/happ-desktop/releases",r:1},{n:"Throne",u:"https://github.com/throneproj/Throne/releases",r:1},{n:"Hiddify",u:"https://github.com/hiddify/hiddify-app/releases"},{n:"v2rayN",u:"https://github.com/2dust/v2rayN/releases"}]},
  {p:"macOS",i:"fa-brands fa-apple",a:[{n:"Happ",u:"https://apps.apple.com/app/id6504287215",r:1},{n:"Hiddify",u:"https://github.com/hiddify/hiddify-app/releases"},{n:"V2Box",u:"https://apps.apple.com/app/id6446814690"}]},
  {p:"Linux",i:"fa-brands fa-linux",a:[{n:"Happ",u:"https://github.com/Happ-proxy/happ-desktop/releases",r:1},{n:"Throne",u:"https://github.com/throneproj/Throne/releases",r:1},{n:"Hiddify",u:"https://github.com/hiddify/hiddify-app/releases"}]},
];
const QI=[
  {n:"Happ",i:"fa-solid fa-bolt",s:"happ://add/{U}"},
  {n:"Hiddify",i:"fa-solid fa-shield-halved",s:"hiddify://import/{U}"},
  {n:"v2rayNG",i:"fa-brands fa-android",s:"v2rayng://install-config?url={E}"},
  {n:"V2Box",i:"fa-solid fa-box-open",s:"v2box://install-sub?url={E}&title={T}"},
];
const I={
  fa:{n1:"خانه",n2:"کانفیگ",n3:"برنامه‌ها",n4:"پروفایل",used:"مصرف",limit:"سقف",left:"باقیمانده",copy:"کپی اشتراک",qi:"افزودن سریع",cfg:"کانفیگ‌ها",all:"کپی همه",apps:"کلاینت‌ها",prof:"پروفایل",on:"فعال",off:"غیرفعال",online:"آنلاین",unl:"نامحدود",days:"روز",ok:"کپی شد!",none:"موردی نیست",traffic:"ترافیک",time:"زمان",p1:"نام کاربری",p2:"شناسه",p3:"وضعیت",p4:"تعداد سرور",p5:"انقضا",p6:"آخرین آنلاین"},
  en:{n1:"Home",n2:"Configs",n3:"Apps",n4:"Profile",used:"Used",limit:"Limit",left:"Left",copy:"Copy sub",qi:"Quick import",cfg:"Configs",all:"Copy all",apps:"Clients",prof:"Profile",on:"Active",off:"Inactive",online:"Online",unl:"Unlimited",days:"days",ok:"Copied!",none:"Nothing here",traffic:"Traffic",time:"Time",p1:"Username",p2:"User ID",p3:"Status",p4:"Servers",p5:"Expire",p6:"Last online"}
};
let lang=localStorage.getItem("nn_lang")||"fa", dark=localStorage.getItem("nn_theme")!=="light";
const t=k=>(I[lang]||I.en)[k]||k;
const ph=v=>typeof v==="string"&&v.includes("{{")&&v.includes("}}");
const n=(v,f)=>{const s=String(v??"").trim();return(!s||ph(s))?f:s};
const num=v=>{const s=n(v,"");if(!s)return null;const x=Number(s.replace(/[, ]/g,""));return isNaN(x)?null:x};
const bytes=b=>{b=+b||0;if(b<=0)return"0 B";const u=["B","KB","MB","GB","TB"];let i=0;while(b>=1024&&i<u.length-1){b/=1024;i++}return b.toFixed(i>1?2:0)+" "+u[i]};
const toast=m=>{const e=document.getElementById("toast");e.textContent=m;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),1500)};
const copy=x=>navigator.clipboard.writeText(x).then(()=>toast(t("ok"))).catch(()=>toast("Error"));
const os=()=>{const ua=(navigator.userAgent||"").toLowerCase(),p=(navigator.platform||"").toLowerCase();
  if(/android/.test(ua))return"Android";if(/iphone|ipad|ipod/.test(ua))return"iOS";
  if(/win/.test(p)||/windows/.test(ua))return"Windows";if(/mac/.test(p)&&!/iphone|ipad/.test(ua))return"macOS";
  if(/linux/.test(p)||/linux/.test(ua))return"Linux";return""};
const C=226.08;
const subUrl=n(TV.subUrl,location.href.split("?")[0]);
const subTitle=n(TV.subTitle,"Subscription");
const links=n(TV.links,"").split(/\r?\n/).filter(Boolean);
const emails=n(TV.emails,"").split(/[,\s]+/).filter(Boolean);

function uiLang(){
  document.documentElement.lang=lang;document.documentElement.dir=lang==="fa"?"rtl":"ltr";
  ["n1","n2","n3","n4"].forEach((id,i)=>document.getElementById(id).textContent=t(["n1","n2","n3","n4"][i]));
  document.getElementById("sUsed").textContent=t("used");
  document.getElementById("sLimit").textContent=t("limit");
  document.getElementById("sLeft").textContent=t("left");
  document.getElementById("tCopy").textContent=t("copy");
  document.getElementById("tQi").textContent=t("qi");
  document.getElementById("tCfg").textContent=t("cfg");
  document.getElementById("tAll").textContent=t("all");
  document.getElementById("tApps").textContent=t("apps");
  document.getElementById("tProf").textContent=t("prof");
  document.getElementById("lTraffic").textContent=t("traffic");
  document.getElementById("lTime").textContent=t("time");
  for(let i=1;i<=6;i++) document.getElementById("p"+i).textContent=t("p"+i);
  localStorage.setItem("nn_lang",lang);
}
function uiTheme(){
  document.documentElement.setAttribute("data-theme",dark?"dark":"light");
  document.getElementById("themeBtn").innerHTML=dark?'<i class="fa-solid fa-sun"></i>':'<i class="fa-solid fa-moon"></i>';
  localStorage.setItem("nn_theme",dark?"dark":"light");
}
function data(){
  document.getElementById("title").textContent=subTitle;
  document.getElementById("userLine").textContent=emails[0]||("ID "+n(TV.sId,"—"));
  const en=n(TV.enabled,"true"), on=n(TV.isOnline,"");
  const badge=document.getElementById("badge"), bt=document.getElementById("badgeTxt");
  let stTxt=t("on");
  if(en==="false"||en==="0"){badge.className="badge bad";stTxt=t("off")}
  else if(on==="true"||on==="1"){badge.className="badge ok";stTxt=t("online")}
  else{badge.className="badge ok";stTxt=t("on")}
  bt.textContent=stTxt;

  const d=num(TV.downloadByte)||0,u=num(TV.uploadByte)||0,tot=num(TV.totalByte)||0;
  const used=d+u, left=tot>0?Math.max(0,tot-used):0;
  document.getElementById("used").textContent=bytes(used);
  document.getElementById("limit").textContent=tot?bytes(tot):t("unl");
  document.getElementById("left").textContent=tot?bytes(left):t("unl");
  let pct=tot>0?Math.min(100,Math.round(used/tot*100)):0;
  document.getElementById("pctT").textContent=tot?pct+"%":"∞";
  document.getElementById("bar").style.width=tot?pct+"%":"0%";
  document.getElementById("rTraffic").style.strokeDashoffset=tot?(C-C*pct/100):C;

  const exp=num(TV.expire);
  let daysLeft=null, expLabel=t("unl");
  if(exp){
    const ms=exp<1e12?exp*1000:exp;
    daysLeft=Math.ceil((ms-Date.now())/86400000);
    expLabel=daysLeft>0?daysLeft+" "+t("days"):"0";
    const timePct=Math.max(0,Math.min(100,daysLeft>90?100:Math.round(daysLeft/90*100)));
    document.getElementById("rTime").style.strokeDashoffset=C-C*timePct/100;
  } else document.getElementById("rTime").style.strokeDashoffset=0;
  document.getElementById("pctD").textContent=expLabel;
  document.getElementById("expLine").textContent=expLabel;

  const ann=n(TV.announce,"");
  const annEl=document.getElementById("ann");
  if(ann){document.getElementById("annTxt").textContent=ann;annEl.style.display="flex"}
  else annEl.style.display="none";

  document.getElementById("pv1").textContent=emails[0]||"—";
  document.getElementById("pv2").textContent=n(TV.sId,"—");
  document.getElementById("pv3").textContent=stTxt;
  document.getElementById("pv4").textContent=String(links.length);
  document.getElementById("pv5").textContent=expLabel;
  const lo=n(TV.lastOnline,"");
  document.getElementById("pv6").textContent=lo&&!ph(lo)?lo:"—";
}
function renderQi(){
  const E=encodeURIComponent(subUrl),T=encodeURIComponent(subTitle);
  document.getElementById("qi").innerHTML=QI.map(x=>{
    const href=x.s.replace("{U}",subUrl).replace("{E}",E).replace("{T}",T);
    return `<a href="${href}"><i class="${x.i}"></i>${x.n}</a>`;
  }).join("");
}
function renderList(){
  const box=document.getElementById("list");
  if(!links.length){box.innerHTML=`<div class="card" style="text-align:center;color:var(--mu)">${t("none")}</div>`;return}
  box.innerHTML=links.map((l,i)=>{
    const name=(l.split("#")[1]||("Config "+(i+1))).slice(0,40);
    return `<div class="item"><span class="n">${name}</span>
      <button class="mb" type="button" data-c="${i}"><i class="fa-solid fa-copy"></i></button>
      <button class="mb" type="button" data-q="${i}"><i class="fa-solid fa-qrcode"></i></button></div>`;
  }).join("");
  box.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>copy(links[+b.dataset.c]));
  box.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>qr(links[+b.dataset.q]));
}
function renderApps(){
  const cur=os();
  const sorted=[...APPS].sort((a,b)=>(a.p===cur?-1:0)-(b.p===cur?-1:0));
  document.getElementById("apps").innerHTML=sorted.map(g=>{
    const hot=g.p===cur?" hot":"";
    return `<div class="grp${hot}"><h4><i class="${g.i}"></i> ${g.p}${g.p===cur?" ·":""}</h4>
      ${g.a.map(x=>`<a class="al" href="${x.u}" target="_blank" rel="noopener">${x.n}${x.r?'<span class="t">★</span>':''}<span class="d"><i class="fa-solid fa-download"></i></span></a>`).join("")}
    </div>`;
  }).join("");
}
function qr(txt){const el=document.getElementById("qr");el.innerHTML="";new QRCode(el,{text:txt,width:180,height:180});document.getElementById("md").classList.add("open")}

document.getElementById("btnCopy").onclick=()=>copy(subUrl);
document.getElementById("btnQr").onclick=()=>qr(subUrl);
document.getElementById("btnAll").onclick=()=>copy(links.join("\n"));
document.getElementById("themeBtn").onclick=()=>{dark=!dark;uiTheme()};
document.getElementById("langBtn").onclick=e=>{e.stopPropagation();document.getElementById("lw").classList.toggle("open")};
document.querySelectorAll(".ld button").forEach(b=>b.onclick=()=>{lang=b.dataset.l;uiLang();data();document.getElementById("lw").classList.remove("open")});
document.addEventListener("click",()=>document.getElementById("lw").classList.remove("open"));
document.querySelectorAll(".nav button").forEach(btn=>{
  btn.onclick=()=>{
    document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("on"));
    document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));
    btn.classList.add("on");
    document.getElementById("tab-"+btn.dataset.t).classList.add("on");
  };
});
uiTheme();uiLang();data();renderQi();renderList();renderApps();
</script>
</body>
</html>
