<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%2306b6d4'/%3E%3Cpath d='M8 16h16M16 8v16' stroke='%23fff' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E"/>
<title>{{ .subTitle }}</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --font:"Inter","Vazirmatn",system-ui,sans-serif;
  --p:#22d3ee; --p2:#3b82f6; --pg:rgba(34,211,238,.14);
  --bg:#020617; --sf:rgba(10,18,38,.55); --sf2:rgba(8,14,28,.88);
  --bd:rgba(100,180,255,.14); --tx:#f0f9ff; --mu:#8ba3b8;
  --ok:#34d399; --wn:#fbbf24; --er:#f87171; --r:18px;
}
html[data-theme="light"]{
  --bg:#dce8f6; --sf:rgba(255,255,255,.72); --sf2:rgba(255,255,255,.92);
  --bd:rgba(30,90,150,.12); --tx:#0f172a; --mu:#5b6f85;
  --p:#0891b2; --pg:rgba(8,145,178,.12);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:auto;min-height:100%;overflow-x:hidden}
body{
  font-family:var(--font);color:var(--tx);min-height:100vh;
  background:var(--bg);display:flex;justify-content:center;
  -webkit-overflow-scrolling:touch;
}
.app{-webkit-overflow-scrolling:touch;padding-bottom:0}
.ambient{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:radial-gradient(120% 80% at 50% -10%,#0b1a33 0%,#030712 55%,#02040a 100%)}
html[data-theme="light"] .ambient{background:radial-gradient(120% 80% at 50% -10%,#c7d8f0 0%,#e8eef8 55%,#dfe8f5 100%)}
.orb{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55;animation:float 18s ease-in-out infinite;pointer-events:none}
.orb.a{width:340px;height:340px;background:#1d4ed8;top:-8%;left:-10%;animation-duration:22s}
.orb.b{width:280px;height:280px;background:#0ea5e9;bottom:5%;right:-12%;animation-duration:26s;animation-delay:-6s}
.orb.c{width:220px;height:220px;background:#4338ca;top:40%;left:55%;animation-duration:20s;animation-delay:-10s;opacity:.35}
html[data-theme="light"] .orb{opacity:.35}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(4%,6%) scale(1.06)}66%{transform:translate(-5%,-3%) scale(.96)}}
.stars{position:absolute;inset:0;opacity:.7;pointer-events:none;animation:twinkle 8s ease-in-out infinite alternate;background-image:radial-gradient(1px 1px at 10% 20%,rgba(255,255,255,.35),transparent),radial-gradient(1px 1px at 30% 70%,rgba(255,255,255,.25),transparent),radial-gradient(1.5px 1.5px at 70% 30%,rgba(255,255,255,.3),transparent),radial-gradient(1px 1px at 85% 60%,rgba(255,255,255,.2),transparent)}
html[data-theme="light"] .stars{opacity:.2}
@keyframes twinkle{from{opacity:.4}to{opacity:.85}}
.lat-note{font-size:.65rem;color:var(--mu);margin-top:.4rem;line-height:1.4;opacity:.85}

/* Always phone-column — works on Windows too */
.app{
  position:relative;z-index:2;width:100%;max-width:440px;min-height:100vh;
  padding:1rem 1rem 8.5rem;background:transparent;
}

.hd{display:flex;align-items:center;justify-content:space-between;gap:.75rem;margin-bottom:.85rem}
.hd-info{min-width:0}
.hd h1{font-size:1.05rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd .sub{font-size:.72rem;color:var(--mu);margin-top:.12rem;display:flex;align-items:center;gap:.35rem}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);flex-shrink:0}
.dot.off{background:var(--er);box-shadow:0 0 8px var(--er)}
.tools{display:flex;gap:.4rem;flex-shrink:0}
.ib{width:36px;height:36px;border-radius:12px;border:1px solid var(--bd);background:var(--sf);
  color:var(--tx);display:grid;place-items:center;cursor:pointer;font-size:.85rem;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.ib:active{transform:scale(.95)}
.lw{position:relative}
.ld{display:none;position:absolute;top:42px;inset-inline-start:0;min-width:120px;background:var(--sf2);
  border:1px solid var(--bd);border-radius:12px;overflow:hidden;z-index:50;box-shadow:0 12px 28px rgba(0,0,0,.35)}
.lw.open .ld{display:block}
.ld button{display:block;width:100%;padding:.55rem .8rem;border:0;background:0;color:var(--tx);
  font-family:var(--font);font-size:.8rem;font-weight:600;cursor:pointer;text-align:start}
.ld button:hover{background:var(--pg)}

.card{
  background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:1.1rem;margin-bottom:.75rem;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  box-shadow:0 8px 32px rgba(0,0,0,.12);
}
.badge{display:inline-flex;align-items:center;gap:.3rem;font-size:.7rem;font-weight:700;
  padding:.25rem .65rem;border-radius:999px}
.badge.ok{background:rgba(52,211,153,.14);color:var(--ok)}
.badge.bad{background:rgba(248,113,113,.14);color:var(--er)}
.badge.wn{background:rgba(251,191,36,.14);color:var(--wn)}

/* Usage block */
.usage{display:flex;align-items:center;gap:1rem;margin-bottom:.85rem;flex-wrap:wrap}
.usage .vol-grid{flex:1;min-width:160px}
.ring-wrap{position:relative;width:110px;height:110px;flex-shrink:0}
.ring-wrap svg{width:110px;height:110px;display:block}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  pointer-events:none;text-shadow:0 1px 6px rgba(0,0,0,.4)}
.ring-center .pct{font-size:1.25rem;font-weight:900;line-height:1.1}
.ring-center .lab{font-size:.62rem;color:var(--mu);margin-top:.12rem;font-weight:600}
.period-card{margin-bottom:.75rem}
.period-card .st{margin:0 0 .55rem}
.period{display:grid;grid-template-columns:repeat(4,1fr);gap:.35rem}
.period button{border:1px solid var(--bd);background:rgba(0,0,0,.12);color:var(--mu);font-family:var(--font);
  font-size:.72rem;font-weight:700;padding:.55rem .35rem;border-radius:12px;cursor:pointer;transition:.15s}
html[data-theme="light"] .period button{background:rgba(0,0,0,.04)}
.period button.on{background:var(--pg);color:var(--p);border-color:rgba(34,211,238,.35);box-shadow:0 0 0 1px rgba(34,211,238,.15)}
.period button:active{transform:scale(.97)}
.vol-grid{display:grid;grid-template-columns:1fr 1fr;gap:.45rem}
.vol{padding:.65rem .7rem;border-radius:12px;background:rgba(0,0,0,.12);border:1px solid rgba(255,255,255,.04)}
html[data-theme="light"] .vol{background:rgba(0,0,0,.04)}
.vol .k{font-size:.66rem;color:var(--mu);font-weight:600;display:flex;align-items:center;gap:.28rem;margin-bottom:.25rem}
.vol .k i{color:var(--p);font-size:.7rem;width:12px;text-align:center}
.vol .v{font-size:.92rem;font-weight:800;direction:ltr;text-align:start;unicode-bidi:isolate}
.vol.full{grid-column:1/-1}
.vol.accent{border-color:rgba(34,211,238,.2);background:rgba(34,211,238,.06)}

/* Expiry timer */
.exp-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:.75rem}
.exp-hd .t{font-size:.8rem;font-weight:700;display:flex;align-items:center;gap:.35rem}
.exp-hd .t i{color:var(--p2)}
.exp-tag{font-size:.68rem;font-weight:700;padding:.2rem .55rem;border-radius:8px;
  background:rgba(59,130,246,.12);color:#93c5fd}
.timers{display:grid;grid-template-columns:repeat(3,1fr);gap:.45rem}
.timer{text-align:center;padding:.65rem .3rem;border-radius:12px;background:rgba(0,0,0,.16);
  border:1px solid rgba(255,255,255,.04)}
html[data-theme="light"] .timer{background:rgba(0,0,0,.04)}
.timer .n{font-size:1.25rem;font-weight:900;font-variant-numeric:tabular-nums}
.timer .l{font-size:.62rem;color:var(--mu);margin-top:.15rem;font-weight:600}

.bar{height:6px;background:rgba(255,255,255,.06);border-radius:99px;overflow:hidden;margin:.85rem 0 0}
html[data-theme="light"] .bar{background:rgba(0,0,0,.06)}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--p),var(--p2));transition:width .5s}

.row{display:grid;grid-template-columns:1fr 1fr;gap:.55rem;margin-top:.85rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;padding:.72rem .5rem;
  border-radius:14px;border:0;font-family:var(--font);font-size:.82rem;font-weight:700;cursor:pointer;transition:.15s}
.btn:active{transform:scale(.97)}
.bp{background:linear-gradient(135deg,#06b6d4,#2563eb);color:#fff;box-shadow:0 6px 18px rgba(37,99,235,.28)}
.bg{background:var(--sf);border:1px solid var(--bd);color:var(--tx)}

.st{font-size:.76rem;font-weight:700;color:var(--mu);margin:.95rem 0 .5rem;display:flex;align-items:center;gap:.35rem}
.qi{display:grid;grid-template-columns:1fr 1fr;gap:.45rem}
.qi a{display:flex;align-items:center;justify-content:center;gap:.35rem;padding:.65rem .4rem;border-radius:12px;
  background:var(--pg);border:1px solid var(--bd);color:var(--tx);text-decoration:none;font-size:.78rem;font-weight:600}
.qi a:hover{border-color:var(--p)}

.item{display:flex;align-items:center;gap:.45rem;padding:.65rem .7rem;background:rgba(0,0,0,.14);border-radius:12px;margin-bottom:.35rem}
html[data-theme="light"] .item{background:rgba(0,0,0,.04)}
.item .n{flex:1;font-size:.8rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mb{width:32px;height:32px;border-radius:9px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);
  display:grid;place-items:center;cursor:pointer;font-size:.74rem;flex-shrink:0}

.grp{margin-bottom:.85rem;background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:.75rem;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.grp h4{font-size:.74rem;color:var(--mu);margin-bottom:.4rem;font-weight:700}
.grp.hot{border-color:rgba(34,211,238,.28);background:rgba(34,211,238,.08)}
.al{display:flex;align-items:center;gap:.4rem;padding:.55rem .65rem;border-radius:10px;background:rgba(0,0,0,.1);
  color:var(--tx);text-decoration:none;font-size:.8rem;font-weight:600;margin-bottom:.3rem;
  border:1px solid transparent}
.al:last-child{margin-bottom:0}
html[data-theme="light"] .al{background:rgba(0,0,0,.04)}
.al:hover{border-color:var(--bd)}
.al .t{color:var(--p);font-size:.62rem;margin-inline-start:.15rem}
.al .d{margin-inline-start:auto;opacity:.35;font-size:.7rem}

.pinfo{display:grid;gap:.5rem}
.prow{display:flex;justify-content:space-between;align-items:center;padding:.65rem .75rem;background:rgba(0,0,0,.12);border-radius:12px}
html[data-theme="light"] .prow{background:rgba(0,0,0,.04)}
.prow span{font-size:.76rem;color:var(--mu)}
.prow b{font-size:.82rem;font-weight:700}

/* Bottom nav — always fixed bottom */
.nav{
  position:fixed;bottom:12px;left:50%;transform:translateX(-50%);
  width:calc(100% - 24px);max-width:416px;
  display:flex;justify-content:space-around;padding:.45rem;
  background:var(--sf2);border:1px solid var(--bd);border-radius:18px;
  backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  z-index:40;box-shadow:0 10px 36px rgba(0,0,0,.3);
}
.nav button{background:0;border:0;color:var(--mu);font-family:var(--font);font-size:.6rem;font-weight:600;
  display:flex;flex-direction:column;align-items:center;gap:.1rem;cursor:pointer;padding:.28rem .55rem;border-radius:12px}
.nav button i{font-size:1.1rem}
.nav button.on{color:var(--p);background:var(--pg)}

.tab{display:none;padding-bottom:.75rem}.tab.on{display:block;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-10px);opacity:0;background:var(--sf2);
  border:1px solid var(--bd);padding:.55rem 1.1rem;border-radius:999px;font-size:.8rem;font-weight:700;z-index:100;transition:.25s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#md{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:90;align-items:center;justify-content:center;padding:1rem}
#md.open{display:flex}
.mbx{background:var(--sf2);border:1px solid var(--bd);border-radius:20px;padding:1.25rem;text-align:center;max-width:260px;width:100%}
#qr{display:flex;justify-content:center;margin:1rem 0}
.ann{display:none;align-items:flex-start;gap:.5rem;padding:.8rem;margin-bottom:.75rem;border-radius:14px;
  background:rgba(34,211,238,.08);border:1px solid rgba(34,211,238,.16);font-size:.76rem;line-height:1.45}
.ann i{color:var(--p);margin-top:.08rem}

/* Latency */
.lat-head{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin-bottom:.65rem;flex-wrap:wrap}
.lat-head .st{margin:0}
.lat-modes{display:flex;gap:.25rem;background:rgba(0,0,0,.16);border-radius:10px;padding:3px}
html[data-theme="light"] .lat-modes{background:rgba(0,0,0,.05)}
.lat-modes button{border:0;background:transparent;color:var(--mu);font-family:var(--font);font-size:.68rem;font-weight:700;
  padding:.32rem .52rem;border-radius:8px;cursor:pointer}
.lat-modes button.on{background:var(--pg);color:var(--p)}
.lat-refresh{width:32px;height:32px;border-radius:9px;border:1px solid var(--bd);background:var(--sf);
  color:var(--p);display:grid;place-items:center;cursor:pointer;font-size:.8rem;flex-shrink:0}
.lat-refresh.spin i{animation:spin .5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.lat-item{display:flex;align-items:center;gap:.55rem;padding:.6rem .7rem;background:rgba(0,0,0,.12);border-radius:12px;margin-bottom:.35rem}
html[data-theme="light"] .lat-item{background:rgba(0,0,0,.04)}
.lat-flag{font-size:1.4rem;line-height:1;width:1.55rem;text-align:center;flex-shrink:0}
.lat-info{flex:1;min-width:0}
.lat-name{font-size:.8rem;font-weight:700}
.lat-bar{height:3px;background:rgba(255,255,255,.05);border-radius:99px;margin-top:.32rem;overflow:hidden}
.lat-bar i{display:block;height:100%;border-radius:99px;transition:width .35s}
.lat-ping{font-size:.86rem;font-weight:800;min-width:52px;text-align:end;font-variant-numeric:tabular-nums}
.lat-ping.good{color:var(--ok)}.lat-ping.mid{color:var(--wn)}.lat-ping.bad{color:var(--er)}.lat-ping.wait{color:var(--mu);font-size:.72rem}
.lat-empty{text-align:center;padding:1rem;color:var(--mu);font-size:.78rem}
.lat-meta{margin-top:.45rem;font-size:.65rem;color:var(--mu);text-align:end}

/* v2.1 */
.warn{display:none;align-items:flex-start;gap:.55rem;padding:.8rem .9rem;margin-bottom:.75rem;border-radius:14px;font-size:.78rem;line-height:1.45;font-weight:600}
.warn.show{display:flex}
.warn.vol{background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.28);color:#fbbf24}
.warn.exp{background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.28);color:#f87171}
.warn i{margin-top:.1rem}
.fmt{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.55rem}
.fmt button{flex:1 1 auto;min-width:72px;padding:.55rem .5rem;border-radius:11px;border:1px solid var(--bd);
  background:var(--sf);color:var(--tx);font-family:var(--font);font-size:.72rem;font-weight:700;cursor:pointer}
.fmt button:active{transform:scale(.97)}
.fmt button.hid{display:none}
.act-row{display:flex;gap:.4rem;margin:.7rem 0;flex-wrap:wrap}
.act-row a{flex:1;min-width:0;text-decoration:none;text-align:center}
.lat-int{display:flex;gap:.25rem;margin-inline-start:.25rem}
.lat-int button{border:0;background:transparent;color:var(--mu);font-family:var(--font);font-size:.62rem;font-weight:700;
  padding:.25rem .4rem;border-radius:7px;cursor:pointer}
.lat-int button.on{background:var(--pg);color:var(--p)}
.app-badge{width:22px;height:22px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;
  font-size:.65rem;font-weight:800;color:#fff;flex-shrink:0;background:linear-gradient(135deg,#06b6d4,#2563eb)}
.app-badge.happ{background:linear-gradient(135deg,#f59e0b,#ea580c)}
.app-badge.throne{background:linear-gradient(135deg,#8b5cf6,#6d28d9)}
.app-badge.hiddify{background:linear-gradient(135deg,#22c55e,#15803d)}
.app-badge.v2ray{background:linear-gradient(135deg,#3b82f6,#1d4ed8)}
.app-badge.v2box{background:linear-gradient(135deg,#ec4899,#be185d)}
.app-badge.streisand{background:linear-gradient(135deg,#14b8a6,#0f766e)}
.app-badge.shadow{background:linear-gradient(135deg,#64748b,#334155)}



.cfg-item{display:flex;align-items:center;gap:.5rem;padding:.65rem .7rem;background:rgba(0,0,0,.14);border-radius:12px;margin-bottom:.4rem}
html[data-theme="light"] .cfg-item{background:rgba(0,0,0,.04)}
.cfg-flag{font-size:1.35rem;line-height:1;width:1.5rem;text-align:center;flex-shrink:0}
.cfg-info{flex:1;min-width:0}
.cfg-name{font-size:.82rem;font-weight:700}
.cfg-bar{height:3px;background:rgba(255,255,255,.06);border-radius:99px;margin-top:.3rem;overflow:hidden}
.cfg-bar i{display:block;height:100%;border-radius:99px;transition:width .35s}
.cfg-ping{font-size:.8rem;font-weight:800;min-width:48px;text-align:end;font-variant-numeric:tabular-nums}
.cfg-ping.good{color:var(--ok)}.cfg-ping.mid{color:var(--wn)}.cfg-ping.bad{color:var(--er)}.cfg-ping.wait{color:var(--mu);font-size:.7rem}
.cfg-acts{display:flex;gap:.3rem;flex-shrink:0}
.app-logo{width:22px;height:22px;border-radius:6px;object-fit:contain;flex-shrink:0;background:rgba(255,255,255,.06)}


.wave-line{position:absolute;left:-10%;right:-10%;height:120px;opacity:.18;pointer-events:none;
  background:repeating-linear-gradient(90deg,transparent,transparent 40px,rgba(34,211,238,.35) 40px,rgba(34,211,238,.35) 41px);
  filter:blur(0.5px);animation:waveMove 12s linear infinite}
.wave-line.w1{bottom:18%;animation-duration:14s;opacity:.14}
.wave-line.w2{bottom:28%;animation-duration:18s;animation-direction:reverse;opacity:.1;transform:rotate(-3deg)}
.wave-line.w3{top:22%;animation-duration:16s;opacity:.08;transform:rotate(2deg)}
@keyframes waveMove{0%{transform:translateX(0)}100%{transform:translateX(-80px)}}
.orb{animation-duration:12s!important}
.orb.a{animation:float 14s ease-in-out infinite,pulseGlow 6s ease-in-out infinite}
.orb.b{animation:float 16s ease-in-out infinite reverse,pulseGlow 7s ease-in-out infinite 1s}
.orb.c{animation:float 11s ease-in-out infinite,pulseGlow 5s ease-in-out infinite 2s}
@keyframes pulseGlow{0%,100%{opacity:.45;transform:scale(1)}50%{opacity:.75;transform:scale(1.08)}}
.stars{animation:twinkle 4s ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.35}to{opacity:.7}}

/* v2.2 */
.skel{display:none;padding:1rem 0}
.skel.on{display:block}
.skel .srow{height:14px;border-radius:8px;background:linear-gradient(90deg,rgba(255,255,255,.04),rgba(255,255,255,.1),rgba(255,255,255,.04));background-size:200% 100%;animation:shimmer 1.2s infinite;margin-bottom:.55rem}
.skel .srow.lg{height:88px;border-radius:16px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.home-renew{display:none;margin-bottom:.75rem}
.home-renew.show{display:block}
.home-renew .btn{width:100%;padding:.85rem 1rem;font-size:.9rem;box-shadow:0 8px 28px rgba(37,99,235,.35)}
.status-pill{display:inline-flex;align-items:center;gap:.35rem;font-size:.72rem;font-weight:800;padding:.3rem .75rem;border-radius:999px}
.status-pill.ok{background:rgba(52,211,153,.15);color:var(--ok)}
.status-pill.bad{background:rgba(248,113,113,.15);color:var(--er)}
.status-pill.wn{background:rgba(251,191,36,.15);color:var(--wn)}
.btn-all{width:100%;margin-top:.5rem;padding:.8rem 1rem!important;font-size:.88rem!important;font-weight:800!important;
  background:linear-gradient(135deg,#06b6d4,#2563eb)!important;color:#fff!important;border:0!important;box-shadow:0 6px 20px rgba(37,99,235,.28)}
#md .mbx{max-width:300px;padding:1.4rem}
#md #qr{margin:1.1rem 0}

/* ===== Liquid wave ===== */
let wavePhase=0;
function updateWaves(){
  wavePhase+=0.05;
  const pct=window.__pctT||0;
  const y=Math.max(20,Math.min(120,120-(pct/100)*88));
  const f=document.getElementById("liqFillT");

  let d=`M 0 ${y}`;

/* ===== Jalali ===== */
function toJalaliParts(gy,gm,gd){
  const g_d_m=[0,31,59,90,120,151,181,212,243,273,304,334];
  let jy=(gy<=1600)?0:979;gy-=(gy<=1600)?621:1600;

  let days=(365*gy)+(parseInt((gy2+3)/4))-parseInt((gy2+99)/100)+parseInt((gy2+399)/400)-80+gd+g_d_m[gm-1];
  jy+=33*parseInt(days/12053);days%=12053;jy+=4*parseInt(days/1461);days%=1461;
  if(days>365){jy+=parseInt((days-1)/365);days=(days-1)%365}
  const jm=(days<186)?1+parseInt(days/31):7+parseInt((days-186)/30);
  const jd=1+((days<186)?(days%31):((days-186)%30));
  return {jy,jm,jd};
}
function pad2(n){return String(n).padStart(2,"0")}
function toJalali(gy,gm,gd){const p=toJalaliParts(gy,gm,gd);return p.jy+"/"+pad2(p.jm)+"/"+pad2(p.jd)}
function formatJalaliDateTime(v){
  if(!v||v==="0"||v==="—"||v==="-")return"—";
  let d=null;
  if(/^\d+$/.test(String(v))){const n=Number(v);d=new Date(n>1e12?n:n*1000)}
  else d=new Date(v);
  if(!d||isNaN(d.getTime()))return String(v);
  const date=toJalali(d.getFullYear(),d.getMonth()+1,d.getDate());
  return date+" - "+pad2(d.getHours())+":"+pad2(d.getMinutes());
}
function formatLastOnline(v){return formatJalaliDateTime(v)}
function formatExpireDate(v){
  if(!v||v==="0"||v==="")return null;
  let d=new Date(isNaN(v)?v:Number(v)*1000);
  if(!d||isNaN(d.getTime())||d.getFullYear()<2000)return null;
  return toJalali(d.getFullYear(),d.getMonth()+1,d.getDate());

/* usage period: client-side samples in localStorage */
let usagePeriod=localStorage.getItem("nn_usage_period")||"total";
function recordUsageSample(down,up){
  try{
    const key="nn_usage_hist";
    let arr=JSON.parse(localStorage.getItem(key)||"[]");
    const now=Date.now();
    arr.push({t:now,d:down,u:up});
    // keep 40 days
    arr=arr.filter(x=>now-x.t<40*864e5);
    // dedupe if last sample < 10min and same totals
    if(arr.length>1){
      const a=arr[arr.length-2],b=arr[arr.length-1];
      if(b.t-a.t<600000 && a.d===b.d && a.u===b.u) arr.splice(arr.length-2,1);
    }
    localStorage.setItem(key,JSON.stringify(arr));
  }catch(e){}
}
function periodWindowMs(p){
  if(p==="24h")return 864e5;
  if(p==="7d")return 7*864e5;
  if(p==="30d")return 30*864e5;
  return null;
}
function usageForPeriod(down,up,period){
  if(period==="total"||!periodWindowMs(period))return{d:down,u:up};
  try{
    let arr=JSON.parse(localStorage.getItem("nn_usage_hist")||"[]");
    // ignore samples from the last 15s (just written this session)
    const now=Date.now(),win=periodWindowMs(period),from=now-win;
    arr=arr.filter(s=>now-s.t>15000);
    if(!arr.length)return{d:down,u:up};
    let base=null;
    for(const s of arr){ if(s.t<=from) base=s; else break; }
    if(!base) base=arr[0];
    let dd=Math.max(0,down-(base.d||0)), uu=Math.max(0,up-(base.u||0));
    // if no meaningful change yet, fall back to total so UI is not empty zeros
    if(dd===0 && uu===0) return{d:down,u:up};
    return{d:dd,u:uu};
  }catch(e){return{d:down,u:up}}
}
function renderTraffic(){
  const rawD=num(TV.downloadByte)||0, rawU=num(TV.uploadByte)||0, tot=num(TV.totalByte)||0;
  // IMPORTANT: compute period BEFORE writing new sample (else delta becomes 0)
  const {d,u}=usageForPeriod(rawD,rawU,usagePeriod);
  recordUsageSample(rawD,rawU);
  const used=d+u, left=tot>0?Math.max(0,tot-(rawD+rawU)):0;
  const noLimit=!tot||tot<=0;
  document.getElementById("down").textContent=bytes(d);
  document.getElementById("up").textContent=bytes(u);
  document.getElementById("used").textContent=bytes(used);
  document.getElementById("limit").textContent=noLimit?"∞":bytes(tot);
  document.getElementById("left").textContent=noLimit?"∞":bytes(left);
  const pctBase=rawD+rawU;
  const pct=noLimit?0:Math.min(100,Math.round(pctBase/tot*100));
  document.getElementById("pctT").textContent=noLimit?"∞":(pct+"%");
  document.getElementById("rTraffic").style.strokeDashoffset=String(CIRC-CIRC*(noLimit?0:pct)/100);
  document.getElementById("bar").style.width=(noLimit?0:pct)+"%";window.__pctT=noLimit?0:pct;
  document.querySelectorAll("#periodBar button").forEach(b=>b.classList.toggle("on",b.dataset.p===usagePeriod));
}

function measureWS(s){
  return new Promise(resolve=>{
    const t0=performance.now(); let done=false; let ws;
    const finish=ms=>{ if(done)return; done=true; try{ws&&ws.close()}catch(e){} resolve(ms); };
    const ports=[];
    if(s.port) ports.push(s.port);
    if(!ports.includes(443)) ports.push(443);
    if(!ports.includes(80)) ports.push(80);
    let pi=0;
    const tryNext=()=>{
      if(pi>=ports.length){ finish(null); return; }
      const port=ports[pi++]; const portStr=(port===443||port===80)?"":(":"+port);
      const schemes=port===80?["ws","wss"]:["wss","ws"];
      let si=0;
      const tryScheme=()=>{
        if(si>=schemes.length){ tryNext(); return; }
        const sch=schemes[si++];
        try{
          ws=new WebSocket(sch+"://"+s.host+portStr+"/");
        }catch(e){ tryScheme(); return; }
        const timer=setTimeout(()=>{ try{ws.close()}catch(e){} tryScheme(); }, 2000);
        ws.onopen=()=>{ clearTimeout(timer); finish(Math.round(performance.now()-t0)); };
        ws.onerror=()=>{ clearTimeout(timer); try{ws.close()}catch(e){} tryScheme(); };
      };
      tryScheme();
    };
    tryNext();
  });
}
function measureHTTP(s){
  return new Promise(resolve=>{
    const t0=performance.now();
    const ports=[];
    if(s.port) ports.push(s.port);
    if(!ports.includes(443)) ports.push(443);
    let finished=false;
    const done=ms=>{ if(finished)return; finished=true; resolve(ms); };
    const tryFetch=(url)=>{
      return Promise.race([
        fetch(url,{mode:"no-cors",cache:"no-store",credentials:"omit"}).then(()=>Math.round(performance.now()-t0)).catch(()=>null),
        new Promise(r=>setTimeout(()=>r(null),2500))
      ]);
    };
    const tryImg=(url)=>{
      return new Promise(res=>{
        const img=new Image();
        const t=setTimeout(()=>{ img.src=""; res(null); }, 2500);
        img.onload=img.onerror=()=>{ clearTimeout(t); res(Math.round(performance.now()-t0)); };
        img.src=url+(url.includes("?")?"&":"?")+"t="+Date.now();
      });
    };
    (async()=>{
      for(const port of ports){
        const portStr=(port===443||port===80)?"":(":"+port);
        const urls=[
          "https://"+s.host+portStr+"/",
          "http://"+s.host+portStr+"/",
        ];
        for(const u of urls){
          let ms=await tryFetch(u);
          if(ms!=null){ done(ms); return; }
          ms=await tryImg(u+"favicon.ico");
          if(ms!=null){ done(ms); return; }
        }
      }
      done(null);
    })();
  });
}
async function measureOne(s){
  let ms=null;
  // Auto: HTTP first (works more often from browsers), then WS
  if(latMode==="ws") ms=await measureWS(s);
  else if(latMode==="http") ms=await measureHTTP(s);
  else {
    ms=await measureHTTP(s);
    if(ms==null) ms=await measureWS(s);
  }
  s.ping=ms;
}

  if(el("btnQrCopy")) el("btnQrCopy").onclick=()=>{ if(window.__lastQr) copy(window.__lastQr); };
  if(el("btnFmtJson")) el("btnFmtJson").onclick=()=>{const u=n(TV.subJsonUrl,""); if(u) copy(u)};
  if(el("btnFmtClash")) el("btnFmtClash").onclick=()=>{const u=n(TV.subClashUrl,""); if(u) copy(u)};
  let pingTimer=null;
  document.querySelectorAll("#latInt button").forEach(b=>{
    b.onclick=()=>{
      document.querySelectorAll("#latInt button").forEach(x=>x.classList.remove("on"));
      b.classList.add("on");
      const s=Number(b.dataset.s)||0;
      if(pingTimer){ clearInterval(pingTimer); pingTimer=null; }
      if(s>0){
        const tick=()=>{ try{ if(typeof runLatency==="function") runLatency(); else if(el("btnLatRefresh")) el("btnLatRefresh").click(); }catch(e){} };
        pingTimer=setInterval(tick, s*1000);
      }
    };
  });
})();

</script>
</body>
</html>
