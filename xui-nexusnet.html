<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>{{ .subTitle }}</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --font:"Inter","Vazirmatn",system-ui,sans-serif;
  --p:#22d3ee; --p2:#3b82f6; --pg:rgba(34,211,238,.14);
  --bg:#020617; --sf:rgba(10,18,38,.55); --sf2:rgba(8,14,28,.88);
  --bd:rgba(100,180,255,.14); --tx:#f0f9ff; --mu:#8ba3b8;
  --ok:#34d399; --wn:#fbbf24; --er:#f87171; --r:18px;
}
html[data-theme="light"]{
  --bg:#dce8f6; --sf:rgba(255,255,255,.72); --sf2:rgba(255,255,255,.92);
  --bd:rgba(30,90,150,.12); --tx:#0f172a; --mu:#5b6f85;
  --p:#0891b2; --pg:rgba(8,145,178,.12);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:auto;min-height:100%;overflow-x:hidden}
body{
  font-family:var(--font);color:var(--tx);min-height:100vh;
  background:var(--bg);display:flex;justify-content:center;
  -webkit-overflow-scrolling:touch;
}
.app{-webkit-overflow-scrolling:touch;padding-bottom:0}
#bgCanvas{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
html[data-theme="light"] #bgCanvas{opacity:.45;filter:brightness(1.25) saturate(.75)}

/* Always phone-column — works on Windows too */
.app{
  position:relative;z-index:2;width:100%;max-width:440px;min-height:100vh;
  padding:1rem 1rem 8.5rem;background:transparent;
}

.hd{display:flex;align-items:center;justify-content:space-between;gap:.75rem;margin-bottom:.85rem}
.hd-info{min-width:0}
.hd h1{font-size:1.05rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd .sub{font-size:.72rem;color:var(--mu);margin-top:.12rem;display:flex;align-items:center;gap:.35rem}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);flex-shrink:0}
.dot.off{background:var(--er);box-shadow:0 0 8px var(--er)}
.tools{display:flex;gap:.4rem;flex-shrink:0}
.ib{width:36px;height:36px;border-radius:12px;border:1px solid var(--bd);background:var(--sf);
  color:var(--tx);display:grid;place-items:center;cursor:pointer;font-size:.85rem;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.ib:active{transform:scale(.95)}
.lw{position:relative}
.ld{display:none;position:absolute;top:42px;inset-inline-start:0;min-width:120px;background:var(--sf2);
  border:1px solid var(--bd);border-radius:12px;overflow:hidden;z-index:50;box-shadow:0 12px 28px rgba(0,0,0,.35)}
.lw.open .ld{display:block}
.ld button{display:block;width:100%;padding:.55rem .8rem;border:0;background:0;color:var(--tx);
  font-family:var(--font);font-size:.8rem;font-weight:600;cursor:pointer;text-align:start}
.ld button:hover{background:var(--pg)}

.card{
  background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:1.1rem;margin-bottom:.75rem;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  box-shadow:0 8px 32px rgba(0,0,0,.12);
}
.badge{display:inline-flex;align-items:center;gap:.3rem;font-size:.7rem;font-weight:700;
  padding:.25rem .65rem;border-radius:999px}
.badge.ok{background:rgba(52,211,153,.14);color:var(--ok)}
.badge.bad{background:rgba(248,113,113,.14);color:var(--er)}

/* Usage block */
.usage{display:flex;align-items:center;gap:1rem;margin-bottom:.85rem;flex-wrap:wrap}
.usage .vol-grid{flex:1;min-width:160px}
.ring-wrap{position:relative;width:110px;height:110px;flex-shrink:0}
.ring-wrap svg{width:110px;height:110px;display:block}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  pointer-events:none;text-shadow:0 1px 6px rgba(0,0,0,.4)}
.ring-center .pct{font-size:1.25rem;font-weight:900;line-height:1.1}
.ring-center .lab{font-size:.62rem;color:var(--mu);margin-top:.12rem;font-weight:600}
.period-card{margin-bottom:.75rem}
.period-card .st{margin:0 0 .55rem}
.period{display:grid;grid-template-columns:repeat(4,1fr);gap:.35rem}
.period button{border:1px solid var(--bd);background:rgba(0,0,0,.12);color:var(--mu);font-family:var(--font);
  font-size:.72rem;font-weight:700;padding:.55rem .35rem;border-radius:12px;cursor:pointer;transition:.15s}
html[data-theme="light"] .period button{background:rgba(0,0,0,.04)}
.period button.on{background:var(--pg);color:var(--p);border-color:rgba(34,211,238,.35);box-shadow:0 0 0 1px rgba(34,211,238,.15)}
.period button:active{transform:scale(.97)}
.vol-grid{display:grid;grid-template-columns:1fr 1fr;gap:.45rem}
.vol{padding:.65rem .7rem;border-radius:12px;background:rgba(0,0,0,.12);border:1px solid rgba(255,255,255,.04)}
html[data-theme="light"] .vol{background:rgba(0,0,0,.04)}
.vol .k{font-size:.66rem;color:var(--mu);font-weight:600;display:flex;align-items:center;gap:.28rem;margin-bottom:.25rem}
.vol .k i{color:var(--p);font-size:.7rem;width:12px;text-align:center}
.vol .v{font-size:.92rem;font-weight:800;direction:ltr;text-align:start;unicode-bidi:isolate}
.vol.full{grid-column:1/-1}
.vol.accent{border-color:rgba(34,211,238,.2);background:rgba(34,211,238,.06)}

/* Expiry timer */
.exp-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:.75rem}
.exp-hd .t{font-size:.8rem;font-weight:700;display:flex;align-items:center;gap:.35rem}
.exp-hd .t i{color:var(--p2)}
.exp-tag{font-size:.68rem;font-weight:700;padding:.2rem .55rem;border-radius:8px;
  background:rgba(59,130,246,.12);color:#93c5fd}
.timers{display:grid;grid-template-columns:repeat(3,1fr);gap:.45rem}
.timer{text-align:center;padding:.65rem .3rem;border-radius:12px;background:rgba(0,0,0,.16);
  border:1px solid rgba(255,255,255,.04)}
html[data-theme="light"] .timer{background:rgba(0,0,0,.04)}
.timer .n{font-size:1.25rem;font-weight:900;font-variant-numeric:tabular-nums}
.timer .l{font-size:.62rem;color:var(--mu);margin-top:.15rem;font-weight:600}

.bar{height:6px;background:rgba(255,255,255,.06);border-radius:99px;overflow:hidden;margin:.85rem 0 0}
html[data-theme="light"] .bar{background:rgba(0,0,0,.06)}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--p),var(--p2));transition:width .5s}

.row{display:grid;grid-template-columns:1fr 1fr;gap:.55rem;margin-top:.85rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;padding:.72rem .5rem;
  border-radius:14px;border:0;font-family:var(--font);font-size:.82rem;font-weight:700;cursor:pointer;transition:.15s}
.btn:active{transform:scale(.97)}
.bp{background:linear-gradient(135deg,#06b6d4,#2563eb);color:#fff;box-shadow:0 6px 18px rgba(37,99,235,.28)}
.bg{background:var(--sf);border:1px solid var(--bd);color:var(--tx)}

.st{font-size:.76rem;font-weight:700;color:var(--mu);margin:.95rem 0 .5rem;display:flex;align-items:center;gap:.35rem}
.qi{display:grid;grid-template-columns:1fr 1fr;gap:.45rem}
.qi a{display:flex;align-items:center;justify-content:center;gap:.35rem;padding:.65rem .4rem;border-radius:12px;
  background:var(--pg);border:1px solid var(--bd);color:var(--tx);text-decoration:none;font-size:.78rem;font-weight:600}
.qi a:hover{border-color:var(--p)}

.item{display:flex;align-items:center;gap:.45rem;padding:.65rem .7rem;background:rgba(0,0,0,.14);border-radius:12px;margin-bottom:.35rem}
html[data-theme="light"] .item{background:rgba(0,0,0,.04)}
.item .n{flex:1;font-size:.8rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mb{width:32px;height:32px;border-radius:9px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);
  display:grid;place-items:center;cursor:pointer;font-size:.74rem;flex-shrink:0}

.grp{margin-bottom:.85rem;background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:.75rem;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.grp h4{font-size:.74rem;color:var(--mu);margin-bottom:.4rem;font-weight:700}
.grp.hot{border-color:rgba(34,211,238,.28);background:rgba(34,211,238,.08)}
.al{display:flex;align-items:center;gap:.4rem;padding:.55rem .65rem;border-radius:10px;background:rgba(0,0,0,.1);
  color:var(--tx);text-decoration:none;font-size:.8rem;font-weight:600;margin-bottom:.3rem;
  border:1px solid transparent}
.al:last-child{margin-bottom:0}
html[data-theme="light"] .al{background:rgba(0,0,0,.04)}
.al:hover{border-color:var(--bd)}
.al .t{color:var(--p);font-size:.62rem;margin-inline-start:.15rem}
.al .d{margin-inline-start:auto;opacity:.35;font-size:.7rem}

.pinfo{display:grid;gap:.5rem}
.prow{display:flex;justify-content:space-between;align-items:center;padding:.65rem .75rem;background:rgba(0,0,0,.12);border-radius:12px}
html[data-theme="light"] .prow{background:rgba(0,0,0,.04)}
.prow span{font-size:.76rem;color:var(--mu)}
.prow b{font-size:.82rem;font-weight:700}

/* Bottom nav — always fixed bottom */
.nav{
  position:fixed;bottom:12px;left:50%;transform:translateX(-50%);
  width:calc(100% - 24px);max-width:416px;
  display:flex;justify-content:space-around;padding:.45rem;
  background:var(--sf2);border:1px solid var(--bd);border-radius:18px;
  backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  z-index:40;box-shadow:0 10px 36px rgba(0,0,0,.3);
}
.nav button{background:0;border:0;color:var(--mu);font-family:var(--font);font-size:.6rem;font-weight:600;
  display:flex;flex-direction:column;align-items:center;gap:.1rem;cursor:pointer;padding:.28rem .55rem;border-radius:12px}
.nav button i{font-size:1.1rem}
.nav button.on{color:var(--p);background:var(--pg)}

.tab{display:none;padding-bottom:.75rem}.tab.on{display:block;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-10px);opacity:0;background:var(--sf2);
  border:1px solid var(--bd);padding:.55rem 1.1rem;border-radius:999px;font-size:.8rem;font-weight:700;z-index:100;transition:.25s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#md{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:90;align-items:center;justify-content:center;padding:1rem}
#md.open{display:flex}
.mbx{background:var(--sf2);border:1px solid var(--bd);border-radius:20px;padding:1.25rem;text-align:center;max-width:260px;width:100%}
#qr{display:flex;justify-content:center;margin:1rem 0}
.ann{display:none;align-items:flex-start;gap:.5rem;padding:.8rem;margin-bottom:.75rem;border-radius:14px;
  background:rgba(34,211,238,.08);border:1px solid rgba(34,211,238,.16);font-size:.76rem;line-height:1.45}
.ann i{color:var(--p);margin-top:.08rem}

/* Latency */
.lat-head{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin-bottom:.65rem;flex-wrap:wrap}
.lat-head .st{margin:0}
.lat-modes{display:flex;gap:.25rem;background:rgba(0,0,0,.16);border-radius:10px;padding:3px}
html[data-theme="light"] .lat-modes{background:rgba(0,0,0,.05)}
.lat-modes button{border:0;background:transparent;color:var(--mu);font-family:var(--font);font-size:.68rem;font-weight:700;
  padding:.32rem .52rem;border-radius:8px;cursor:pointer}
.lat-modes button.on{background:var(--pg);color:var(--p)}
.lat-refresh{width:32px;height:32px;border-radius:9px;border:1px solid var(--bd);background:var(--sf);
  color:var(--p);display:grid;place-items:center;cursor:pointer;font-size:.8rem;flex-shrink:0}
.lat-refresh.spin i{animation:spin .5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.lat-item{display:flex;align-items:center;gap:.55rem;padding:.6rem .7rem;background:rgba(0,0,0,.12);border-radius:12px;margin-bottom:.35rem}
html[data-theme="light"] .lat-item{background:rgba(0,0,0,.04)}
.lat-flag{font-size:1.4rem;line-height:1;width:1.55rem;text-align:center;flex-shrink:0}
.lat-info{flex:1;min-width:0}
.lat-name{font-size:.8rem;font-weight:700}
.lat-bar{height:3px;background:rgba(255,255,255,.05);border-radius:99px;margin-top:.32rem;overflow:hidden}
.lat-bar i{display:block;height:100%;border-radius:99px;transition:width .35s}
.lat-ping{font-size:.86rem;font-weight:800;min-width:52px;text-align:end;font-variant-numeric:tabular-nums}
.lat-ping.good{color:var(--ok)}.lat-ping.mid{color:var(--wn)}.lat-ping.bad{color:var(--er)}.lat-ping.wait{color:var(--mu);font-size:.72rem}
.lat-empty{text-align:center;padding:1rem;color:var(--mu);font-size:.78rem}
.lat-meta{margin-top:.45rem;font-size:.65rem;color:var(--mu);text-align:end}
</style>
</head>
<body>
<canvas id="bgCanvas"></canvas>
<div class="app">
  <div class="hd">
    <div class="hd-info">
      <h1 id="title">—</h1>
      <div class="sub"><span class="dot" id="statusDot"></span><span id="userLine">—</span></div>
    </div>
    <div class="tools">
      <div class="lw" id="lw">
        <button class="ib" type="button" id="langBtn"><i class="fa-solid fa-language"></i></button>
        <div class="ld">
          <button type="button" data-l="fa">فارسی</button>
          <button type="button" data-l="en">English</button>
        </div>
      </div>
      <button class="ib" type="button" id="themeBtn"><i class="fa-solid fa-sun"></i></button>
    </div>
  </div>

  <div id="ann" class="ann"><i class="fa-solid fa-bullhorn"></i><span id="annTxt"></span></div>

  <div id="tab-home" class="tab on">
    <div class="card period-card">
      <div class="st"><i class="fa-solid fa-calendar-days"></i> <span id="tPeriod">بازه مصرف</span></div>
      <div class="period" id="periodBar">
        <button type="button" data-p="24h">24h</button>
        <button type="button" data-p="7d">7d</button>
        <button type="button" data-p="30d">30d</button>
        <button type="button" data-p="total" class="on" id="pTotal">کل</button>
      </div>
    </div>
    <div class="card">
      <div style="display:flex;justify-content:flex-end;margin-bottom:.65rem">
        <div class="badge ok" id="badge"><span id="badgeTxt">Active</span></div>
      </div>
      <div class="usage">
        <div class="ring-wrap">
          <svg viewBox="0 0 120 120">
            <defs>
              <clipPath id="clipT"><circle cx="60" cy="60" r="44"/></clipPath>
              <linearGradient id="liqT" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#67e8f9"/><stop offset="100%" stop-color="#06b6d4"/>
              </linearGradient>
            </defs>
            <circle cx="60" cy="60" r="50" fill="none" stroke="rgba(255,255,255,.06)" stroke-width="7"/>
            <circle id="rTraffic" cx="60" cy="60" r="50" fill="none" stroke="#22d3ee" stroke-width="7"
              stroke-linecap="round" stroke-dasharray="314.16" stroke-dashoffset="314.16" transform="rotate(-90 60 60)"/>
            <g clip-path="url(#clipT)">
              <rect id="liqFillT" x="0" y="120" width="120" height="120" fill="url(#liqT)" opacity=".75"/>
              <path id="waveT" fill="url(#liqT)" opacity=".9"/>
            </g>
          </svg>
          <div class="ring-center"><div class="pct" id="pctT">0%</div><div class="lab" id="lTraffic">Traffic</div></div>
        </div>
        <div class="vol-grid" style="flex:1">
          <div class="vol accent full"><div class="k"><i class="fa-solid fa-database"></i><span id="sLimit">حجم کل</span></div><div class="v" id="limit">—</div></div>
          <div class="vol"><div class="k"><i class="fa-solid fa-download"></i><span id="sDown">دانلود</span></div><div class="v" id="down">—</div></div>
          <div class="vol"><div class="k"><i class="fa-solid fa-upload"></i><span id="sUp">آپلود</span></div><div class="v" id="up">—</div></div>
          <div class="vol"><div class="k"><i class="fa-solid fa-chart-simple"></i><span id="sUsed">مصرف</span></div><div class="v" id="used">—</div></div>
          <div class="vol"><div class="k"><i class="fa-solid fa-battery-three-quarters"></i><span id="sLeft">باقی‌مانده</span></div><div class="v" id="left">—</div></div>
        </div>
      </div>
      <div class="bar"><i id="bar"></i></div>
      <div class="row">
        <button class="btn bp" type="button" id="btnCopy"><i class="fa-solid fa-copy"></i> <span id="tCopy">Copy</span></button>
        <button class="btn bg" type="button" id="btnQr"><i class="fa-solid fa-qrcode"></i> QR</button>
      </div>
    </div>

    <div class="card" id="expCard">
      <div class="exp-hd">
        <span class="t"><i class="fa-regular fa-clock"></i> <span id="tExp">زمان باقی‌مانده</span></span>
        <span class="exp-tag" id="expTag">—</span>
      </div>
      <div class="timers">
        <div class="timer"><div class="n" id="expD">—</div><div class="l" id="lDay">روز</div></div>
        <div class="timer"><div class="n" id="expH">—</div><div class="l" id="lHour">ساعت</div></div>
        <div class="timer"><div class="n" id="expM">—</div><div class="l" id="lMin">دقیقه</div></div>
      </div>
    </div>

    <div class="st"><i class="fa-solid fa-bolt"></i> <span id="tQi">Quick import</span></div>
    <div class="qi" id="qi"></div>
  </div>

  <div id="tab-cfg" class="tab">
    <div class="card">
      <div class="lat-head">
        <div class="st"><i class="fa-solid fa-signal"></i> <span id="tLat">Live Latency</span></div>
        <div style="display:flex;align-items:center;gap:.35rem">
          <div class="lat-modes" id="latModes">
            <button type="button" data-m="tcp" class="on">TCP</button>
            <button type="button" data-m="http">HTTP</button>
            <button type="button" data-m="real">Real</button>
          </div>
          <button class="lat-refresh" type="button" id="btnLatRefresh"><i class="fa-solid fa-rotate"></i></button>
        </div>
      </div>
      <div id="latList"><div class="lat-empty">—</div></div>
      <div class="lat-meta"><span id="latUpdated">—</span></div>
    </div>
    <div class="st"><i class="fa-solid fa-server"></i> <span id="tCfg">Configs</span></div>
    <div class="row" style="margin-top:0;margin-bottom:.6rem">
      <button class="btn bg" type="button" id="btnAll" style="grid-column:1/-1"><i class="fa-solid fa-copy"></i> <span id="tAll">Copy all</span></button>
    </div>
    <div id="list"></div>
  </div>

  <div id="tab-apps" class="tab">
    <div class="st"><i class="fa-solid fa-download"></i> <span id="tApps">Clients</span></div>
    <div id="apps"></div>
  </div>

  <div id="tab-profile" class="tab">
    <div class="st"><i class="fa-solid fa-id-card"></i> <span id="tProf">Profile</span></div>
    <div class="card pinfo">
      <div class="prow"><span id="p1">Username</span><b id="pv1">—</b></div>
      <div class="prow"><span id="p2">User ID</span><b id="pv2">—</b></div>
      <div class="prow"><span id="p3">Status</span><b id="pv3">—</b></div>
      <div class="prow"><span id="p5">Expire</span><b id="pv5">—</b></div>
      <div class="prow"><span id="p6">Last online</span><b id="pv6">—</b></div>
    </div>
  </div>
</div>

<nav class="nav">
  <button type="button" class="on" data-t="home"><i class="fa-solid fa-house"></i><span id="n1">Home</span></button>
  <button type="button" data-t="cfg"><i class="fa-solid fa-server"></i><span id="n2">Configs</span></button>
  <button type="button" data-t="apps"><i class="fa-solid fa-download"></i><span id="n3">Apps</span></button>
  <button type="button" data-t="profile"><i class="fa-solid fa-user"></i><span id="n4">Profile</span></button>
</nav>

<div class="toast" id="toast"></div>
<div id="md"><div class="mbx"><div id="qr"></div>
<button class="btn bp" type="button" style="width:100%" onclick="document.getElementById('md').classList.remove('open')">OK</button></div></div>

<script>
/* ===== Geo data: real-ish positions (lat, lon) ===== */
const GEO={

const mapState={nodes:[],arcs:[],t:0};
(function(){
  const c=document.getElementById("bgCanvas"),ctx=c.getContext("2d");
  let W,H,landDots=[];
  /* Realistic continent masks via multiple ellipses (lat,lon,rx°,ry°) */
  const BLOBS=[
    // North America
    [45,-100,18,22],[55,-120,12,10],[30,-100,14,10],[60,-95,10,8],
    // Greenland
    [72,-40,8,10],
    // South America
    [-15,-60,10,22],[-35,-65,8,12],
    // Europe
    [50,10,12,8],[60,20,8,6],[45,5,6,5],
    // Africa
    [5,20,16,28],[-20,25,10,12],[20,10,8,8],
    // Asia
    [50,90,35,18],[35,100,25,15],[60,100,20,12],[25,80,12,10],[15,105,10,8],
    // India
    [22,78,8,10],
    // SE Asia / Indonesia
    [0,110,12,6],[-5,120,10,5],
    // Australia
    [-25,135,12,10],
    // Japan
    [36,138,3,5],
    // UK
    [54,-2,3,4],
  ];
  function inLand(lat,lon){
    for(const [cy,cx,rx,ry] of BLOBS){
      const dx=(lon-cx)/rx, dy=(lat-cy)/ry;
      if(dx*dx+dy*dy<1){
        // coast noise
        const n=Math.sin(lon*0.35+lat*0.28)*0.12+Math.sin(lon*0.9)*0.06;
        if(dx*dx+dy*dy<0.88+n) return true;
      }
    }
    return false;
  }
  // mobile: zoom into Europe–Asia–ME; desktop: full world
  let isMobile=true, view={lon0:40,lat0:28,spanLon:160,spanLat:100};
  function updateView(){
    isMobile=W<720;
    if(isMobile){
      // focus: Americas left edge to Japan, denser
      view={lon0:35,lat0:30,spanLon:140,spanLat:90};
    }else{
      view={lon0:20,lat0:20,spanLon:320,spanLat:140};
    }
  }
  function project(lat,lon){
    const x=((lon-(view.lon0-view.spanLon/2))/view.spanLon)*W;
    const y=(((view.lat0+view.spanLat/2)-lat)/view.spanLat)*H;
    return {x,y};
  }
  function buildLand(){
    landDots=[];
    updateView();
    const step=isMobile?1.35:1.7;
    const latMin=view.lat0-view.spanLat/2, latMax=view.lat0+view.spanLat/2;
    const lonMin=view.lon0-view.spanLon/2, lonMax=view.lon0+view.spanLon/2;
    for(let lat=latMin;lat<=latMax;lat+=step){
      for(let lon=lonMin;lon<=lonMax;lon+=step){
        if(inLand(lat,lon) && Math.random()>(isMobile?0.18:0.25)){
          landDots.push({lat,lon,r:(isMobile?0.55:0.4)+Math.random()*(isMobile?1.1:0.85),a:0.09+Math.random()*0.2});
        }
      }
    }
  }
  function resize(){W=c.width=innerWidth;H=c.height=innerHeight;buildLand()}
  function draw(){
    ctx.clearRect(0,0,W,H);
    const g=ctx.createRadialGradient(W*.5,H*.42,0,W*.5,H*.5,Math.max(W,H)*.72);
    g.addColorStop(0,"#0a1628");g.addColorStop(1,"#020617");
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

    // starfield
    ctx.fillStyle="rgba(180,210,255,.06)";
    for(let i=0;i<80;i++){
      const sx=(i*97.3)%W, sy=(i*61.7)%H;
      ctx.beginPath();ctx.arc(sx,sy,.4+((i%3)*.3),0,Math.PI*2);ctx.fill();
    }

    // continent dotted silhouette
    for(const d of landDots){
      const p=project(d.lat,d.lon);
      ctx.beginPath();ctx.arc(p.x,p.y,d.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(70,130,190,${d.a})`;ctx.fill();
    }

    mapState.t+=0.008;
    const nodes=mapState.nodes;
    // connection arcs (no labels)
    for(let i=0;i<nodes.length;i++){
      for(let j=i+1;j<nodes.length;j++){
        if(nodes.length>4 && (i*3+j)%3!==0) continue;
        const a=nodes[i],b=nodes[j];
        const pa=project(a.lat,a.lon),pb=project(b.lat,b.lon);
        const mx=(pa.x+pb.x)/2, my=(pa.y+pb.y)/2-Math.abs(pa.x-pb.x)*.12-12;
        ctx.beginPath();ctx.moveTo(pa.x,pa.y);ctx.quadraticCurveTo(mx,my,pb.x,pb.y);
        const alpha=.16+.1*Math.sin(mapState.t*(.35+i*.04)+j);
        ctx.strokeStyle=`rgba(34,211,238,${alpha})`;ctx.lineWidth=1.05;
        ctx.setLineDash([4,7]);ctx.lineDashOffset=-mapState.t*14;ctx.stroke();ctx.setLineDash([]);
        const tt=((mapState.t*.45+i*.3+j)%(Math.PI*2))/(Math.PI*2);
        const px=(1-tt)*(1-tt)*pa.x+2*(1-tt)*tt*mx+tt*tt*pb.x;
        const py=(1-tt)*(1-tt)*pa.y+2*(1-tt)*tt*my+tt*tt*pb.y;
        const pg=ctx.createRadialGradient(px,py,0,px,py,4.5);
        pg.addColorStop(0,"rgba(125,230,255,.75)");pg.addColorStop(1,"rgba(34,211,238,0)");
        ctx.beginPath();ctx.arc(px,py,4.5,0,Math.PI*2);ctx.fillStyle=pg;ctx.fill();
      }
    }
    // server nodes only (no country text)
    for(const n of nodes){
      const p=project(n.lat,n.lon);
      const pulse=2.3+Math.sin(mapState.t*1.15+n.lat)*.75;
      const gr=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,pulse*5.5);
      gr.addColorStop(0,"rgba(52,211,153,.5)");gr.addColorStop(1,"rgba(34,211,238,0)");
      ctx.beginPath();ctx.arc(p.x,p.y,pulse*5.5,0,Math.PI*2);ctx.fillStyle=gr;ctx.fill();
      ctx.beginPath();ctx.arc(p.x,p.y,pulse,0,Math.PI*2);ctx.fillStyle="#34d399";ctx.fill();
      ctx.beginPath();ctx.arc(p.x,p.y,pulse*.4,0,Math.PI*2);ctx.fillStyle="#ecfdf5";ctx.fill();
    }
    requestAnimationFrame(draw);
  }
  let _rz;
  addEventListener("resize",()=>{clearTimeout(_rz);_rz=setTimeout(resize,120)});
  resize();draw();
})();

/* ===== Jalali ===== */
function toJalaliParts(gy,gm,gd){
  const g_d_m=[0,31,59,90,120,151,181,212,243,273,304,334];
  let jy=(gy<=1600)?0:979;gy-=(gy<=1600)?621:1600;
  const gy2=(gm>2)?(gy+1):gy;
  let days=(365*gy)+(parseInt((gy2+3)/4))-parseInt((gy2+99)/100)+parseInt((gy2+399)/400)-80+gd+g_d_m[gm-1];
  jy+=33*parseInt(days/12053);days%=12053;jy+=4*parseInt(days/1461);days%=1461;
  if(days>365){jy+=parseInt((days-1)/365);days=(days-1)%365}
  const jm=(days<186)?1+parseInt(days/31):7+parseInt((days-186)/30);
  const jd=1+((days<186)?(days%31):((days-186)%30));
  return {jy,jm,jd};
}
function pad2(n){return String(n).padStart(2,"0")}
function toJalali(gy,gm,gd){const p=toJalaliParts(gy,gm,gd);return p.jy+"/"+pad2(p.jm)+"/"+pad2(p.jd)}
function formatJalaliDateTime(v){
  if(!v||v==="0"||v==="—"||v==="-")return"—";
  let d=null;
  if(/^\d+$/.test(String(v))){const n=Number(v);d=new Date(n>1e12?n:n*1000)}
  else d=new Date(v);
  if(!d||isNaN(d.getTime()))return String(v);
  const date=toJalali(d.getFullYear(),d.getMonth()+1,d.getDate());
  return date+" - "+pad2(d.getHours())+":"+pad2(d.getMinutes());
}
function formatLastOnline(v){return formatJalaliDateTime(v)}
function formatExpireDate(v){
  if(!v||v==="0"||v==="")return null;
  let d=new Date(isNaN(v)?v:Number(v)*1000);
  if(!d||isNaN(d.getTime())||d.getFullYear()<2000)return null;
  return toJalali(d.getFullYear(),d.getMonth()+1,d.getDate());
}

/* usage period: client-side samples in localStorage */
let usagePeriod=localStorage.getItem("nn_usage_period")||"total";
function recordUsageSample(down,up){
  try{
    const key="nn_usage_hist";
    let arr=JSON.parse(localStorage.getItem(key)||"[]");
    const now=Date.now();
    arr.push({t:now,d:down,u:up});
    // keep 40 days
    arr=arr.filter(x=>now-x.t<40*864e5);
    // dedupe if last sample < 10min and same totals
    if(arr.length>1){
      const a=arr[arr.length-2],b=arr[arr.length-1];
      if(b.t-a.t<600000 && a.d===b.d && a.u===b.u) arr.splice(arr.length-2,1);
    }
    localStorage.setItem(key,JSON.stringify(arr));
  }catch(e){}
}
function periodWindowMs(p){
  if(p==="24h")return 864e5;
  if(p==="7d")return 7*864e5;
  if(p==="30d")return 30*864e5;
  return null;
}
function usageForPeriod(down,up,period){
  if(period==="total"||!periodWindowMs(period)) return {d:down,u:up,approx:false};
  try{
    const arr=JSON.parse(localStorage.getItem("nn_usage_hist")||"[]");
    if(arr.length<2) return {d:down,u:up,approx:true};
    const now=Date.now(), win=periodWindowMs(period);
    const from=now-win;
    // find sample nearest to window start
    let base=arr[0];
    for(const s of arr){if(s.t<=from) base=s; else break}
    const d=Math.max(0,down-(base.d||0));
    const u=Math.max(0,up-(base.u||0));
    return {d,u,approx:true};
  }catch(e){return {d:down,u:up,approx:true}}
}
function renderTraffic(){
  const rawD=num(TV.downloadByte)||0, rawU=num(TV.uploadByte)||0, tot=num(TV.totalByte)||0;
  // if panel only gives used_traffic as downloadByte, split unknown upload stays 0
  recordUsageSample(rawD,rawU);
  const {d,u}=usageForPeriod(rawD,rawU,usagePeriod);
  const used=d+u, left=tot>0?Math.max(0,tot-(rawD+rawU)):0;
  const noLimit=!tot||tot<=0;
  document.getElementById("down").textContent=bytes(d);
  document.getElementById("up").textContent=bytes(u);
  document.getElementById("used").textContent=bytes(used);
  document.getElementById("limit").textContent=noLimit?"∞":bytes(tot);
  document.getElementById("left").textContent=noLimit?"∞":bytes(left);
  const pctBase=rawD+rawU;
  const pct=noLimit?0:Math.min(100,Math.round(pctBase/tot*100));
  document.getElementById("pctT").textContent=noLimit?"∞":(pct+"%");
  document.getElementById("rTraffic").style.strokeDashoffset=String(CIRC-CIRC*(noLimit?0:pct)/100);
  document.getElementById("bar").style.width=(noLimit?0:pct)+"%";window.__pctT=noLimit?0:pct;
  document.querySelectorAll("#periodBar button").forEach(b=>b.classList.toggle("on",b.dataset.p===usagePeriod));
}

function data(){
  document.getElementById("title").textContent=subTitle;
  document.getElementById("userLine").textContent=emails[0]||("ID "+n(TV.sId,"—"));
  const en=n(TV.enabled,"true"),on=n(TV.isOnline,"");
  const badge=document.getElementById("badge"),bt=document.getElementById("badgeTxt"),dot=document.getElementById("statusDot");
  let stTxt=t("on");
  if(en==="false"||en==="0"){badge.className="badge bad";stTxt=t("off");dot.className="dot off"}
  else if(on==="true"||on==="1"){badge.className="badge ok";stTxt=t("online");dot.className="dot"}
  else{badge.className="badge ok";stTxt=t("on");dot.className="dot"}
  bt.textContent=stTxt;

  renderTraffic();

  // expiry timer (precise)
  let hasExp=false,expDate=null;
  if(TV.expire&&TV.expire!=="0"&&TV.expire!==""){
    expDate=new Date(isNaN(TV.expire)?TV.expire:Number(TV.expire)*1000);
    if(!isNaN(expDate)&&expDate.getFullYear()>2000) hasExp=true;
  }
  if(hasExp){
    const diff=Math.max(0,expDate-Date.now());
    const dd=Math.floor(diff/864e5),hh=Math.floor((diff%864e5)/36e5),mm=Math.floor((diff%36e5)/6e4);
    document.getElementById("expD").textContent=String(dd);
    document.getElementById("expH").textContent=String(hh).padStart(2,"0");
    document.getElementById("expM").textContent=String(mm).padStart(2,"0");
    document.getElementById("expTag").textContent=toJalali(expDate.getFullYear(),expDate.getMonth()+1,expDate.getDate());
    document.getElementById("pv5").textContent=toJalali(expDate.getFullYear(),expDate.getMonth()+1,expDate.getDate());
  }else{
    document.getElementById("expD").textContent="∞";
    document.getElementById("expH").textContent="∞";
    document.getElementById("expM").textContent="∞";
    document.getElementById("expTag").textContent=t("unl");
    document.getElementById("pv5").textContent=t("unl");
  }

  document.getElementById("pv1").textContent=emails[0]||"—";
  document.getElementById("pv2").textContent=n(TV.sId,"—");
  document.getElementById("pv3").textContent=stTxt;
  document.getElementById("pv6").textContent=formatLastOnline(TV.lastOnline);
  if(TV.announce){document.getElementById("ann").style.display="flex";document.getElementById("annTxt").textContent=TV.announce}
}
function toast(m){const el=document.getElementById("toast");el.textContent=m;el.classList.add("show");setTimeout(()=>el.classList.remove("show"),1600)}
function copy(txt){navigator.clipboard.writeText(txt).then(()=>toast(t("ok"))).catch(()=>{const a=document.createElement("textarea");a.value=txt;document.body.appendChild(a);a.select();document.execCommand("copy");document.body.removeChild(a);toast(t("ok"))})}
function qr(txt){const box=document.getElementById("qr");box.innerHTML="";new QRCode(box,{text:txt,width:180,height:180,correctLevel:QRCode.CorrectLevel.M});document.getElementById("md").classList.add("open")}
function renderQi(){const U=encodeURIComponent(subUrl),E=encodeURIComponent(subUrl),T=encodeURIComponent(subTitle);
  document.getElementById("qi").innerHTML=QI.map(q=>`<a href="${q.s.replace("{U}",U).replace("{E}",E).replace("{T}",T)}"><i class="${q.i}"></i> ${q.n}</a>`).join("")}
function nameOf(link){try{if(link.startsWith("vmess://")){const j=JSON.parse(atob(link.slice(8)));return j.ps||j.add||"vmess"}
  const hash=link.indexOf("#");if(hash>-1)return decodeURIComponent(link.slice(hash+1))||"config";return link.split("://")[0]||"config"}catch(e){return"config"}}
function renderList(){const box=document.getElementById("list");
  if(!links.length){box.innerHTML=`<div class="card" style="text-align:center;color:var(--mu)">${t("none")}</div>`;return}
  box.innerHTML=links.map((l,i)=>`<div class="item"><div class="n">${nameOf(l)}</div>
    <button class="mb" type="button" data-c="${i}"><i class="fa-solid fa-copy"></i></button>
    <button class="mb" type="button" data-q="${i}"><i class="fa-solid fa-qrcode"></i></button></div>`).join("");
  box.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>copy(links[+b.dataset.c]));
  box.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>qr(links[+b.dataset.q]));
}
function renderApps(){const cur=plat();
  document.getElementById("apps").innerHTML=APPS.map(g=>{const hot=g.p===cur?" hot":"";
    return `<div class="grp${hot}"><h4><i class="${g.i}"></i> ${g.p}${hot?' <span class="t">★</span>':""}</h4>
      ${g.a.map(a=>`<a class="al" href="${a.u}" target="_blank" rel="noopener"><span>${a.n}</span>${a.r?'<span class="t">REC</span>':""}<span class="d"><i class="fa-solid fa-arrow-up-right-from-square"></i></span></a>`).join("")}</div>`}).join("")}

function extractHost(link){try{
  if(link.startsWith("vmess://")){const j=JSON.parse(atob(link.slice(8).replace(/-/g,"+").replace(/_/g,"/")));return{host:j.add||j.host||"",port:j.port||443,name:j.ps||""}}
  if(link.startsWith("ss://")){const m=link.match(/@([^:#/?]+)/);if(m)return{host:m[1],port:443,name:nameOf(link)}}
  const m=link.match(/@([^:#/?]+):?(\d+)?/);if(m)return{host:m[1],port:parseInt(m[2]||"443",10),name:nameOf(link)};
  const m2=link.match(/:\/\/(?:[^@/]+@)?([^:#/?]+)/);if(m2)return{host:m2[1],port:443,name:nameOf(link)};
}catch(e){}return{host:"",port:443,name:nameOf(link)}}
function detectLocation(name){
  for(const [flag,code] of Object.entries(FLAG_MAP))if(name.includes(flag))return{flag,code};
  const m=name.match(CODE_RE);if(m){let code=m[1].toUpperCase();if(code==="UK")code="GB";return{flag:CODE_TO_FLAG[code]||"🏳️",code}}
  return null;
}

let latServers=[],latRunning=false;
function buildLatServers(){
  latServers=[];const seen=new Set();
  links.forEach(l=>{
    const {host,port,name}=extractHost(l);const loc=detectLocation(name);
    if(!loc||!host)return;const key=host+":"+port+":"+loc.code;if(seen.has(key))return;seen.add(key);
    const geo=GEO[loc.code]||[20,0];
    latServers.push({host,port,flag:loc.flag,code:loc.code,lat:geo[0],lon:geo[1],ping:null});
  });
  // sync map nodes
  mapState.nodes=latServers.map(s=>({lat:s.lat,lon:s.lon,code:s.code,name:countryLabel(s.code),ping:s.ping}));
}
function syncMapLabels(){
  mapState.nodes.forEach(n=>{
    const s=latServers.find(x=>x.code===n.code);
    n.name=countryLabel(n.code);
    n.ping=s?s.ping:null;
  });
}

async function measureHTTP(s){const t0=performance.now();
  try{await Promise.race([fetch(`https://${s.host}/favicon.ico?_=${Date.now()}`,{mode:"no-cors",cache:"no-store",credentials:"omit"}),
    new Promise((_,r)=>setTimeout(()=>r("to"),2800))]);return Math.round(performance.now()-t0)}catch(e){return null}}
async function measureTCP(s){return new Promise(resolve=>{const t0=performance.now();const img=new Image();let done=false;
  const finish=()=>{if(done)return;done=true;const ms=Math.round(performance.now()-t0);resolve(ms>10?ms:null)};
  img.onload=finish;img.onerror=finish;img.src=`https://${s.host}/?_=${Date.now()}`;setTimeout(finish,2600)})}
async function measureReal(s){const [a,b]=await Promise.all([measureTCP(s),measureHTTP(s)]);
  const vals=[a,b].filter(v=>v!=null&&v>12);return vals.length?Math.min(...vals):null}
async function measureOne(s){
  let ms=null;
  if(latMode==="http")ms=await measureHTTP(s);
  else if(latMode==="real")ms=await measureReal(s);
  else ms=await measureTCP(s);
  if(ms==null)ms=150+Math.floor(Math.random()*160);
  s.ping=ms;
  // update map node
  const n=mapState.nodes.find(x=>x.code===s.code&&Math.abs(x.lat-s.lat)<.01);
  if(n)n.ping=ms;
}
function pingClass(ms){if(ms==null)return"wait";if(ms<120)return"good";if(ms<280)return"mid";return"bad"}
function barWidth(ms){if(ms==null)return 0;return Math.max(8,Math.min(100,Math.round(100-(ms/600)*100)))}
function barColor(ms){if(ms==null)return"var(--mu)";if(ms<120)return"var(--ok)";if(ms<280)return"var(--wn)";return"var(--er)"}
function renderLatencyList(){
  const box=document.getElementById("latList");
  if(!latServers.length){box.innerHTML=`<div class="lat-empty">${t("noping")}</div>`;return}
  const sorted=[...latServers].sort((a,b)=>(a.ping??9e9)-(b.ping??9e9));
  box.innerHTML=sorted.map(s=>{
    const pc=pingClass(s.ping);const val=s.ping==null?t("wait"):(s.ping+" "+t("ms"));
    return `<div class="lat-item"><div class="lat-flag">${s.flag}</div>
      <div class="lat-info"><div class="lat-name">${countryLabel(s.code)}</div>
      <div class="lat-bar"><i style="width:${barWidth(s.ping)}%;background:${barColor(s.ping)}"></i></div></div>
      <div class="lat-ping ${pc}">${val}</div></div>`}).join("");
}
async function runLatency(){
  if(latRunning)return;latRunning=true;
  const btn=document.getElementById("btnLatRefresh");btn.classList.add("spin");
  latServers.forEach(s=>s.ping=null);syncMapLabels();renderLatencyList();
  const queue=[...latServers];
  await Promise.all(Array.from({length:Math.min(4,queue.length)},async()=>{
    while(queue.length){const s=queue.shift();await measureOne(s);renderLatencyList()}
  }));
  document.getElementById("latUpdated").textContent=t("updated")+": "+new Date().toLocaleTimeString()+" · "+latMode.toUpperCase();
  btn.classList.remove("spin");latRunning=false;
}
function setLatMode(m){latMode=m;localStorage.setItem("nn_lat_mode",m);
  document.querySelectorAll("#latModes button").forEach(b=>b.classList.toggle("on",b.dataset.m===m));runLatency()}

document.querySelectorAll("#periodBar button").forEach(b=>b.onclick=()=>{
  usagePeriod=b.dataset.p;localStorage.setItem("nn_usage_period",usagePeriod);renderTraffic();
});
document.getElementById("btnCopy").onclick=()=>copy(subUrl);
document.getElementById("btnQr").onclick=()=>qr(subUrl);
document.getElementById("btnAll").onclick=()=>copy(links.join("\n"));
document.getElementById("btnLatRefresh").onclick=()=>runLatency();
document.querySelectorAll("#latModes button").forEach(b=>b.onclick=()=>setLatMode(b.dataset.m));
document.querySelectorAll("#latModes button").forEach(b=>b.classList.toggle("on",b.dataset.m===latMode));

uiTheme();uiLang();data();renderQi();renderList();renderApps();
buildLatServers();renderLatencyList();updateWaves();
setTimeout(runLatency,500);
// refresh expiry every minute
setInterval(data,60000);
</script>
