<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%2306b6d4'/%3E%3Cpath d='M8 16h16M16 8v16' stroke='%23fff' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E"/>
<title>Subscription</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --font:"Inter","Vazirmatn",system-ui,sans-serif;
  --p:#22d3ee; --p2:#3b82f6; --pg:rgba(34,211,238,.14);
  --bg:#020617; --sf:rgba(10,18,38,.55); --sf2:rgba(8,14,28,.88);
  --bd:rgba(100,180,255,.14); --tx:#f0f9ff; --mu:#8ba3b8;
  --ok:#34d399; --wn:#fbbf24; --er:#f87171; --r:18px;
}
html[data-theme="light"]{
  --bg:#dce8f6; --sf:rgba(255,255,255,.72); --sf2:rgba(255,255,255,.92);
  --bd:rgba(30,90,150,.12); --tx:#0f172a; --mu:#5b6f85;
  --p:#0891b2; --pg:rgba(8,145,178,.12);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:auto;min-height:100%;overflow-x:hidden}
body{
  font-family:var(--font);color:var(--tx);min-height:100vh;
  background:var(--bg);display:flex;justify-content:center;
  -webkit-overflow-scrolling:touch;
}
.app{-webkit-overflow-scrolling:touch;padding-bottom:0}
.ambient{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:radial-gradient(120% 80% at 50% -10%,#06101f 0%,#02040c 50%,#010208 100%)}
html[data-theme="light"] .ambient{background:radial-gradient(120% 80% at 50% -10%,#c7d8f0 0%,#e8eef8 55%,#dfe8f5 100%)}
.orb{position:absolute;border-radius:50%;filter:blur(64px);opacity:.6;animation:float 16s ease-in-out infinite;pointer-events:none;will-change:transform}
.orb.a{width:380px;height:380px;background:#1e3a8a;top:-10%;left:-12%;animation-duration:20s}
.orb.b{width:320px;height:320px;background:#0c4a6e;bottom:2%;right:-14%;animation-duration:24s;animation-delay:-5s}
.orb.c{width:240px;height:240px;background:#312e81;top:38%;left:52%;animation-duration:18s;animation-delay:-9s;opacity:.4}
html[data-theme="light"] .orb{opacity:.32}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}25%{transform:translate(5%,8%) scale(1.08)}50%{transform:translate(-4%,12%) scale(.94)}75%{transform:translate(6%,-4%) scale(1.05)}}
.stars{position:absolute;inset:0;opacity:.8;pointer-events:none;animation:twinkle 7s ease-in-out infinite alternate;background-image:radial-gradient(1px 1px at 10% 20%,rgba(255,255,255,.4),transparent),radial-gradient(1px 1px at 30% 70%,rgba(255,255,255,.28),transparent),radial-gradient(1.5px 1.5px at 70% 30%,rgba(140,200,255,.35),transparent),radial-gradient(1px 1px at 85% 60%,rgba(255,255,255,.22),transparent),radial-gradient(1px 1px at 50% 50%,rgba(100,180,255,.2),transparent)}
html[data-theme="light"] .stars{opacity:.2}
@keyframes twinkle{from{opacity:.4}to{opacity:.9}}
.lat-note{font-size:.65rem;color:var(--mu);margin-top:.4rem;line-height:1.4;opacity:.85}

/* Always phone-column — works on Windows too */
.app{
  position:relative;z-index:2;width:100%;max-width:440px;min-height:100vh;
  padding:1rem 1rem 8.5rem;background:transparent;
}

.hd{display:flex;align-items:center;justify-content:space-between;gap:.75rem;margin-bottom:.85rem}
.hd-info{min-width:0}
.hd h1{font-size:1.05rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd .sub{font-size:.72rem;color:var(--mu);margin-top:.12rem;display:flex;align-items:center;gap:.35rem}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);flex-shrink:0}
.dot.off{background:var(--er);box-shadow:0 0 8px var(--er)}
.tools{display:flex;gap:.4rem;flex-shrink:0}
.ib{width:36px;height:36px;border-radius:12px;border:1px solid var(--bd);background:var(--sf);
  color:var(--tx);display:grid;place-items:center;cursor:pointer;font-size:.85rem;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.ib:active{transform:scale(.95)}
.lw{position:relative}
.ld{display:none;position:absolute;top:42px;inset-inline-start:0;min-width:120px;background:var(--sf2);
  border:1px solid var(--bd);border-radius:12px;overflow:hidden;z-index:50;box-shadow:0 12px 28px rgba(0,0,0,.35)}
.lw.open .ld{display:block}
.ld button{display:block;width:100%;padding:.55rem .8rem;border:0;background:0;color:var(--tx);
  font-family:var(--font);font-size:.8rem;font-weight:600;cursor:pointer;text-align:start}
.ld button:hover{background:var(--pg)}

.card{
  background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:1.1rem;margin-bottom:.75rem;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  box-shadow:0 8px 32px rgba(0,0,0,.12);
}
.badge{display:inline-flex;align-items:center;gap:.3rem;font-size:.7rem;font-weight:700;
  padding:.25rem .65rem;border-radius:999px}
.badge.ok{background:rgba(52,211,153,.14);color:var(--ok)}
.badge.bad{background:rgba(248,113,113,.14);color:var(--er)}
.badge.wn{background:rgba(251,191,36,.14);color:var(--wn)}

/* Usage block */
.usage{display:flex;align-items:center;gap:1rem;margin-bottom:.85rem;flex-wrap:wrap}
.usage .vol-grid{flex:1;min-width:160px}
.ring-wrap{position:relative;width:110px;height:110px;flex-shrink:0}
.ring-wrap svg{width:110px;height:110px;display:block}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  pointer-events:none;text-shadow:0 1px 6px rgba(0,0,0,.4)}
.ring-center .pct{font-size:1.25rem;font-weight:900;line-height:1.1}
.ring-center .lab{font-size:.62rem;color:var(--mu);margin-top:.12rem;font-weight:600}
.period-card{margin-bottom:.75rem}
.period-card .st{margin:0 0 .55rem}
.period{display:grid;grid-template-columns:repeat(4,1fr);gap:.35rem}
.period button{border:1px solid var(--bd);background:rgba(0,0,0,.12);color:var(--mu);font-family:var(--font);
  font-size:.72rem;font-weight:700;padding:.55rem .35rem;border-radius:12px;cursor:pointer;transition:.15s}
html[data-theme="light"] .period button{background:rgba(0,0,0,.04)}
.period button.on{background:var(--pg);color:var(--p);border-color:rgba(34,211,238,.35);box-shadow:0 0 0 1px rgba(34,211,238,.15)}
.period button:active{transform:scale(.97)}
.vol-grid{display:grid;grid-template-columns:1fr 1fr;gap:.45rem}
.vol{padding:.65rem .7rem;border-radius:12px;background:rgba(0,0,0,.12);border:1px solid rgba(255,255,255,.04)}
html[data-theme="light"] .vol{background:rgba(0,0,0,.04)}
.vol .k{font-size:.66rem;color:var(--mu);font-weight:600;display:flex;align-items:center;gap:.28rem;margin-bottom:.25rem}
.vol .k i{color:var(--p);font-size:.7rem;width:12px;text-align:center}
.vol .v{font-size:.92rem;font-weight:800;direction:ltr;text-align:start;unicode-bidi:isolate}
.vol.full{grid-column:1/-1}
.vol.accent{border-color:rgba(34,211,238,.2);background:rgba(34,211,238,.06)}

/* Expiry timer */
.exp-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:.75rem}
.exp-hd .t{font-size:.8rem;font-weight:700;display:flex;align-items:center;gap:.35rem}
.exp-hd .t i{color:var(--p2)}
.exp-tag{font-size:.68rem;font-weight:700;padding:.2rem .55rem;border-radius:8px;
  background:rgba(59,130,246,.12);color:#93c5fd}
.timers{display:grid;grid-template-columns:repeat(3,1fr);gap:.45rem}
.timer{text-align:center;padding:.65rem .3rem;border-radius:12px;background:rgba(0,0,0,.16);
  border:1px solid rgba(255,255,255,.04)}
html[data-theme="light"] .timer{background:rgba(0,0,0,.04)}
.timer .n{font-size:1.25rem;font-weight:900;font-variant-numeric:tabular-nums}
.timer .l{font-size:.62rem;color:var(--mu);margin-top:.15rem;font-weight:600}

.bar{height:6px;background:rgba(255,255,255,.06);border-radius:99px;overflow:hidden;margin:.85rem 0 0}
html[data-theme="light"] .bar{background:rgba(0,0,0,.06)}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--p),var(--p2));transition:width .5s}

.row{display:grid;grid-template-columns:1fr 1fr;gap:.55rem;margin-top:.85rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;padding:.72rem .5rem;
  border-radius:14px;border:0;font-family:var(--font);font-size:.82rem;font-weight:700;cursor:pointer;transition:.15s}
.btn:active{transform:scale(.97)}
.bp{background:linear-gradient(135deg,#06b6d4,#2563eb);color:#fff;box-shadow:0 6px 18px rgba(37,99,235,.28)}
.bg{background:var(--sf);border:1px solid var(--bd);color:var(--tx)}

.st{font-size:.76rem;font-weight:700;color:var(--mu);margin:.95rem 0 .5rem;display:flex;align-items:center;gap:.35rem}
.qi{display:grid;grid-template-columns:1fr 1fr;gap:.45rem}
.qi a{display:flex;align-items:center;justify-content:center;gap:.35rem;padding:.65rem .4rem;border-radius:12px;
  background:var(--pg);border:1px solid var(--bd);color:var(--tx);text-decoration:none;font-size:.78rem;font-weight:600}
.qi a:hover{border-color:var(--p)}

.item{display:flex;align-items:center;gap:.45rem;padding:.65rem .7rem;background:rgba(0,0,0,.14);border-radius:12px;margin-bottom:.35rem}
html[data-theme="light"] .item{background:rgba(0,0,0,.04)}
.item .n{flex:1;font-size:.8rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mb{width:32px;height:32px;border-radius:9px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);
  display:grid;place-items:center;cursor:pointer;font-size:.74rem;flex-shrink:0}

.grp{margin-bottom:.85rem;background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:.75rem;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.grp h4{font-size:.74rem;color:var(--mu);margin-bottom:.4rem;font-weight:700}
.grp.hot{border-color:rgba(34,211,238,.28);background:rgba(34,211,238,.08)}
.al{display:flex;align-items:center;gap:.4rem;padding:.55rem .65rem;border-radius:10px;background:rgba(0,0,0,.1);
  color:var(--tx);text-decoration:none;font-size:.8rem;font-weight:600;margin-bottom:.3rem;
  border:1px solid transparent}
.al:last-child{margin-bottom:0}
html[data-theme="light"] .al{background:rgba(0,0,0,.04)}
.al:hover{border-color:var(--bd)}
.al .t{color:var(--p);font-size:.62rem;margin-inline-start:.15rem}
.al .d{margin-inline-start:auto;opacity:.35;font-size:.7rem}

.pinfo{display:grid;gap:.5rem}
.prow{display:flex;justify-content:space-between;align-items:center;padding:.65rem .75rem;background:rgba(0,0,0,.12);border-radius:12px}
html[data-theme="light"] .prow{background:rgba(0,0,0,.04)}
.prow span{font-size:.76rem;color:var(--mu)}
.prow b{font-size:.82rem;font-weight:700}

/* Bottom nav — always fixed bottom */
.nav{
  position:fixed;bottom:12px;left:50%;transform:translateX(-50%);
  width:calc(100% - 24px);max-width:416px;
  display:flex;justify-content:space-around;padding:.45rem;
  background:var(--sf2);border:1px solid var(--bd);border-radius:18px;
  backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  z-index:40;box-shadow:0 10px 36px rgba(0,0,0,.3);
}
.nav button{background:0;border:0;color:var(--mu);font-family:var(--font);font-size:.6rem;font-weight:600;
  display:flex;flex-direction:column;align-items:center;gap:.1rem;cursor:pointer;padding:.28rem .55rem;border-radius:12px}
.nav button i{font-size:1.1rem}
.nav button.on{color:var(--p);background:var(--pg)}

.tab{display:none;padding-bottom:.75rem}.tab.on{display:block;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-10px);opacity:0;background:var(--sf2);
  border:1px solid var(--bd);padding:.55rem 1.1rem;border-radius:999px;font-size:.8rem;font-weight:700;z-index:100;transition:.25s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#md{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:90;align-items:center;justify-content:center;padding:1rem}
#md.open{display:flex}
.mbx{background:var(--sf2);border:1px solid var(--bd);border-radius:20px;padding:1.25rem;text-align:center;max-width:260px;width:100%}
#qr{display:flex;justify-content:center;margin:1rem 0}
.ann{display:none;align-items:flex-start;gap:.5rem;padding:.8rem;margin-bottom:.75rem;border-radius:14px;
  background:rgba(34,211,238,.08);border:1px solid rgba(34,211,238,.16);font-size:.76rem;line-height:1.45}
.ann i{color:var(--p);margin-top:.08rem}

/* Latency */


/* v2.1-opt — visual/performance only */
@media(min-width:960px){
  .app{max-width:440px!important;margin:1.25rem auto}
}
.orb{will-change:transform,opacity}
.stars{will-change:opacity}
html{-webkit-tap-highlight-color:transparent}
.btn,.mb,.nav button,.period button,.ib{touch-action:manipulation}
.card,.cfg-row,.al{-webkit-font-smoothing:antialiased}
/* slightly smoother nav */
.nav{backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}
/* readable text */
.hd h1,.vol .v,.timer .n{color:var(--tx)}

.hid{display:none!important}

.warn{display:none;align-items:flex-start;gap:.55rem;padding:.8rem .9rem;margin-bottom:.75rem;border-radius:14px;font-size:.78rem;line-height:1.45;font-weight:600}
.warn.show{display:flex}
.warn.vol{background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.28);color:#fbbf24}
.warn.exp{background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.28);color:#f87171}
.warn i{margin-top:.1rem}

.home-renew{display:none;margin-bottom:.75rem}
.home-renew.show{display:block}
.home-renew .btn{width:100%;padding:.85rem 1rem;font-size:.9rem;box-shadow:0 8px 28px rgba(37,99,235,.35);text-decoration:none}

a.btn,a.btn:hover{text-decoration:none;color:inherit}
a.btn.bp{color:#fff}

.usage-hd{display:none!important;display:flex;justify-content:flex-start;margin-bottom:.75rem}
.usage-hd .badge{font-size:.72rem}

.ring-wrap{filter:drop-shadow(0 0 18px rgba(34,211,238,.28))}
.ring-wrap svg circle[id="rTraffic"],.ring-wrap svg path{filter:drop-shadow(0 0 6px rgba(56,189,248,.45))}
.ring-center .pct{background:linear-gradient(180deg,#ecfeff,#67e8f9);-webkit-background-clip:text;background-clip:text;color:transparent;
  font-size:1.35rem;font-weight:900;letter-spacing:-.02em}
html[data-theme="light"] .ring-center .pct{background:linear-gradient(180deg,#0e7490,#0369a1);-webkit-background-clip:text;background-clip:text}
.ring-center .lab{opacity:.85;letter-spacing:.02em}
.ring-wrap::after{content:"";position:absolute;inset:18px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.14),transparent 55%);
  pointer-events:none}


.total-strip{display:flex;align-items:center;justify-content:space-between;gap:.5rem;
  padding:.35rem .65rem;margin-bottom:.55rem;border-radius:10px;
  background:rgba(0,0,0,.12);border:1px solid var(--bd);font-size:.78rem}
html[data-theme="light"] .total-strip{background:rgba(0,0,0,.04)}
.total-strip span{color:var(--mu);font-weight:600}
.total-strip b{font-weight:800;color:var(--tx);font-size:.85rem}
.usage-hd{display:none!important;height:0;margin:0;padding:0;overflow:hidden}
.ring-center .lab{display:none!important}

#liqFillT{fill:url('#liqT')!important}

}
.ring-wrap svg{overflow:visible}


/* ring column + liquid (CSS — works on Windows) */

  filter:drop-shadow(0 0 16px rgba(34,211,238,.35))}

100%{transform:translateX(28%)}}

  pointer-events:none}

  letter-spacing:-.02em}
html[data-theme="light"] .ring-center .pct{color:#0c4a6e;text-shadow:0 1px 0 rgba(255,255,255,.8)}
html[data-theme="light"] .liq-ball{background:radial-gradient(circle at 50% 30%,rgba(224,242,254,.9),rgba(186,230,253,.95))}

  padding:.28rem .45rem;border-radius:10px;background:rgba(0,0,0,.14);border:1px solid var(--bd)}
html[data-theme="light"] .total-under{background:rgba(255,255,255,.55)}
.total-under span{font-size:.65rem;color:var(--mu);font-weight:600}
.total-under b{font-size:.8rem;font-weight:800;color:var(--tx)}

.orb.d{width:240px;height:240px;background:#0369a1;top:60%;left:10%;animation:floatA 22s ease-in-out infinite reverse;opacity:.35}

  radial-gradient(1px 1px at 10% 20%,rgba(255,255,255,.55),transparent),

/* profile actions full width */
#profActs.act-row{display:flex;flex-direction:row;flex-wrap:nowrap;gap:.55rem;margin-bottom:.85rem}

.loc-card[data-cc="GB"] .loc-bg{background:linear-gradient(180deg,#0f172a,#1e3a8a 55%,#7f1d1d)}
.loc-card[data-cc="AE"] .loc-bg{background:linear-gradient(180deg,#042f2e,#0f766e 45%,#fbbf24)}
.loc-card[data-cc="JP"] .loc-bg{background:linear-gradient(180deg,#0f172a,#1e293b 50%,#9f1239)}
.loc-card[data-cc="SG"] .loc-bg{background:linear-gradient(180deg,#0f172a,#0e7490 50%,#e11d48)}
.loc-card[data-cc="RU"] .loc-bg{background:linear-gradient(180deg,#0f172a,#1d4ed8 55%,#f8fafc)}
.loc-card[data-cc="CA"] .loc-bg{background:linear-gradient(180deg,#0f172a,#b91c1c 60%,#f8fafc)}
.loc-card[data-cc="AU"] .loc-bg{background:linear-gradient(180deg,#0c4a6e,#0284c7 40%,#d97706)}
.loc-card .loc-bg::before{content:"";position:absolute;left:10%;right:10%;bottom:22%;height:18px;

/* ===== Jalali ===== */
function toJalaliParts(gy,gm,gd){
  const g_d_m=[0,31,59,90,120,151,181,212,243,273,304,334];
  let jy=(gy<=1600)?0:979;gy-=(gy<=1600)?621:1600;
  const gy2=(gm>2)?(gy+1):gy;
  let days=(365*gy)+(parseInt((gy2+3)/4))-parseInt((gy2+99)/100)+parseInt((gy2+399)/400)-80+gd+g_d_m[gm-1];
  jy+=33*parseInt(days/12053);days%=12053;jy+=4*parseInt(days/1461);days%=1461;
  if(days>365){jy+=parseInt((days-1)/365);days=(days-1)%365}
  const jm=(days<186)?1+parseInt(days/31):7+parseInt((days-186)/30);
  const jd=1+((days<186)?(days%31):((days-186)%30));
  return {jy,jm,jd};
}
function pad2(n){return String(n).padStart(2,"0")}
function toJalali(gy,gm,gd){const p=toJalaliParts(gy,gm,gd);return p.jy+"/"+pad2(p.jm)+"/"+pad2(p.jd)}
function formatJalaliDateTime(v){
  if(!v||v==="0"||v==="—"||v==="-")return"—";
  let d=null;
  if(/^\d+$/.test(String(v))){const n=Number(v);d=new Date(n>1e12?n:n*1000)}
  else d=new Date(v);
  if(!d||isNaN(d.getTime()))return String(v);
  const date=toJalali(d.getFullYear(),d.getMonth()+1,d.getDate());
  return date+" - "+pad2(d.getHours())+":"+pad2(d.getMinutes());
}
function formatLastOnline(v){return formatJalaliDateTime(v)}
function formatExpireDate(v){
  if(!v||v==="0"||v==="")return null;
  let d=new Date(isNaN(v)?v:Number(v)*1000);
  if(!d||isNaN(d.getTime())||d.getFullYear()<2000)return null;
  return toJalali(d.getFullYear(),d.getMonth()+1,d.getDate());
}

function renderTraffic(){
  try{
    const rawD=num(TV.downloadByte)||0, rawU=num(TV.uploadByte)||0, tot=num(TV.totalByte)||0;
    const used=rawD+rawU;
    const noLimit=!tot||tot<=0;
    const left=noLimit?0:Math.max(0,tot-used);
    const remPct=noLimit?80:Math.min(100,Math.max(0,Math.round((left/tot)*100)));
    const el=id=>document.getElementById(id);
    const setTxt=(id,v)=>{const e=el(id);if(e)e.textContent=v;};
    setTxt("down",bytes(rawD));
    setTxt("up",bytes(rawU));
    setTxt("used",bytes(used));
    setTxt("left",noLimit?"∞":bytes(left));
    setTxt("total",noLimit?"∞":bytes(tot));
    setTxt("pctT",noLimit?"∞":(remPct+"%"));
    window.__pctT=remPct;
    
    const bar=el("bar");
    if(bar&&bar.style) bar.style.width=(noLimit?0:Math.min(100,Math.round((used/Math.max(tot,1))*100)))+"%";
    const w=el("liqWater");
    if(w){
      const pct=Math.max(8, remPct)+"%";
      try{ if(w.style&&typeof w.style.setProperty==="function") w.style.setProperty("--pct",pct); }catch(_e){}
      try{ w.style.height=pct; }catch(_e){}
      const ball=w.parentElement;
      if(ball){ if(noLimit||remPct>=78) ball.classList.add("overflowing"); else ball.classList.remove("overflowing"); }
    }
  }catch(e){ try{console.error("renderTraffic",e);}catch(_e){} }
}

function applyMood(){
  try{
    const tot=num(TV.totalByte)||0;
    const used=(num(TV.downloadByte)||0)+(num(TV.uploadByte)||0);
    const exp=num(TV.expire);
    const last=num(TV.lastOnline);
    const en=n(TV.enabled,"true");
    let mood="ok";
    // expired or disabled or quota full -> red
    if(en==="false"||en==="0") mood="bad";
    else if(tot>0 && used>=tot) mood="bad";
    else if(exp){
      const ms=exp<1e12?exp*1000:exp;
      if(ms<Date.now()) mood="bad";
      else if((ms-Date.now())/86400000<=7) mood="warn";
    }
    // low traffic remaining (<=3 days estimate OR <=15% left)
    if(mood==="ok" && tot>0){
      const left=Math.max(0,tot-used);
      const pct=left/tot;
      if(pct<=0.15) mood="warn";
    }
    // never used -> fresh green (lastOnline 0 and used ~0)
    if(mood==="ok" && (!last || last===0) && used<=0) mood="fresh";
    document.body.setAttribute("data-mood", mood);
  }catch(e){ document.body.setAttribute("data-mood","ok"); }
}

  if(bClash){ if(clashU){ bClash.classList.remove("hid"); bClash.textContent=t("fmtClash"); } else bClash.classList.add("hid"); }
  const sup=n(CONFIG.supportUrl,"")||n(TV.subSupportUrl,"");
  const ren=n(CONFIG.renewUrl,"")||sup;
  const br=document.getElementById("btnRenew"), bs=document.getElementById("btnSupport");
  if(br){ if(ren){ br.style.display=""; br.href=ren; const tr=document.getElementById("tRenew"); if(tr) tr.textContent=t("renew"); } else br.style.display="none"; }
  if(bs){ if(sup){ bs.style.display=""; bs.href=sup; const ts=document.getElementById("tSupport"); if(ts) ts.textContent=t("support"); } else bs.style.display="none"; }

  document.getElementById("userLine").textContent=emails[0]||("ID "+n(TV.sId,"—"));

  // clearer status
  let st="ok", stTxt=t("on");
  try{
    const totB=num(TV.totalByte)||0, usedB=(num(TV.downloadByte)||0)+(num(TV.uploadByte)||0);
    const exp=num(TV.expire);
    const en=n(TV.enabled,"true");
    if(en==="false"||en==="0"){ st="bad"; stTxt=t("off"); }
    else if(totB>0 && usedB>=totB){ st="bad"; stTxt=lang==="fa"?"اتمام حجم":"Quota full"; }
    else if(exp){ const ms=exp<1e12?exp*1000:exp; if(ms<Date.now()){ st="bad"; stTxt=lang==="fa"?"منقضی":"Expired"; }
      else if((ms-Date.now())/86400000<=7){ st="wn"; stTxt=lang==="fa"?"نزدیک انقضا":"Expiring"; }
    }
    if(st==="ok" && (n(TV.isOnline,"")==="true"||n(TV.isOnline,"")==="1")) stTxt=t("online");
    const badge=document.getElementById("badge"), bt=document.getElementById("badgeTxt");
    if(badge){ badge.className="badge "+(st==="ok"?"ok":st==="wn"?"wn":"bad"); }
    if(bt) bt.textContent=stTxt;
    const dot=document.getElementById("statusDot");
    if(dot) dot.className=(st==="bad")?"dot off":"dot";
    const hr=document.getElementById("homeRenew"), bhr=document.getElementById("btnHomeRenew");
    const ren=n(CONFIG.renewUrl,"")||n(CONFIG.supportUrl,"")||n(TV.subSupportUrl,"");
    let needRenew=false;
    if(exp){ const ms=exp<1e12?exp*1000:exp; const days=(ms-Date.now())/86400000; if(days>=0&&days<=7) needRenew=true; }
    if(totB>0 && usedB/totB>=0.85) needRenew=true;
    if(hr&&bhr){ if(needRenew&&ren){ hr.classList.add("show"); bhr.href=ren; const th=document.getElementById("tHomeRenew"); if(th) th.textContent=t("renew"); } else hr.classList.remove("show"); }
  }catch(e){}

  // status already set above — only update statusDot
  try{
    const badge=document.getElementById("badge"),dot=document.getElementById("statusDot");
    if(dot&&badge){
      if(badge.classList.contains("bad")) dot.className="dot off";
      else dot.className="dot";
    }
  }catch(e){}
  renderTraffic();

  // expiry timer (precise)
  let hasExp=false,expDate=null;
  if(TV.expire&&TV.expire!=="0"&&TV.expire!==""){
    expDate=new Date(isNaN(TV.expire)?TV.expire:Number(TV.expire)*1000);
    if(!isNaN(expDate)&&expDate.getFullYear()>2000) hasExp=true;
  }
  if(hasExp){
    const diff=Math.max(0,expDate-Date.now());
    const dd=Math.floor(diff/864e5),hh=Math.floor((diff%864e5)/36e5),mm=Math.floor((diff%36e5)/6e4);
    const _sx=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v;};
    _sx("expD",String(dd));
    _sx("expH",String(hh).padStart(2,"0"));
    _sx("expM",String(mm).padStart(2,"0"));
    _sx("expTag",toJalali(expDate.getFullYear(),expDate.getMonth()+1,expDate.getDate()));
    _sx("pv5",toJalali(expDate.getFullYear(),expDate.getMonth()+1,expDate.getDate()));
  }else{
    const _sx=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v;};
    _sx("expD","∞");_sx("expH","∞");_sx("expM","∞");_sx("expTag",t("unl"));_sx("pv5",t("unl"));
  }

  const _setp=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v;};
  _setp("pv1",emails[0]||"—");
  _setp("pv2",subIdFromUrl());
  _setp("pv3",stTxt);
  _setp("pv6",formatLastOnline(TV.lastOnline));
  if(TV.announce){const ann=document.getElementById("ann");const at=document.getElementById("annTxt");if(ann&&at){at.textContent=TV.announce;ann.dataset.has="1";const home=document.getElementById("tab-home");ann.style.display=(home&&home.classList.contains("on"))?"flex":"none";}}else{const ann=document.getElementById("ann");if(ann){ann.dataset.has="0";ann.style.display="none";}}
}
function toast(m){const el=document.getElementById("toast");el.textContent=m;el.classList.add("show");setTimeout(()=>el.classList.remove("show"),1600)}
function copy(txt){navigator.clipboard.writeText(txt).then(()=>toast(t("ok"))).catch(()=>{const a=document.createElement("textarea");a.value=txt;document.body.appendChild(a);a.select();document.execCommand("copy");document.body.removeChild(a);toast(t("ok"))})}
function qr(txt){ window.__lastQr=txt;const box=document.getElementById("qr");box.innerHTML="";new QRCode(box,{text:txt,width:180,height:180,correctLevel:QRCode.CorrectLevel.M});document.getElementById("md").classList.add("open")}
function renderQi(){const U=encodeURIComponent(subUrl),E=encodeURIComponent(subUrl),T=encodeURIComponent(subTitle);
  document.getElementById("qi").innerHTML=QI.map(q=>`<a href="${q.s.replace("{U}",U).replace("{E}",E).replace("{T}",T)}"><i class="${q.i}"></i> ${q.n}</a>`).join("")}
function nameOf(link){try{if(link.startsWith("vmess://")){const j=JSON.parse(atob(link.slice(8)));return j.ps||j.add||"vmess"}
  const hash=link.indexOf("#");if(hash>-1)return decodeURIComponent(link.slice(hash+1))||"config";return link.split("://")[0]||"config"}catch(e){return"config"}}

function detectCC(name){
  const s=String(name||"");
  for(const em in FLAG_MAP){ if(s.indexOf(em)>=0) return FLAG_MAP[em]; }
  const u=s.toUpperCase();
  const codes=Object.keys(COUNTRY||{});
  for(const c of codes){ if(new RegExp("(?:^|[^A-Z])"+c+"(?:[^A-Z]|$)").test(u)) return c; }
  for(const c of codes){
    const fa=(COUNTRY[c].fa||""), en=(COUNTRY[c].en||"");
    if(fa&&s.indexOf(fa)>=0) return c;
    if(en&&u.indexOf(en.toUpperCase())>=0) return c;
  }
  return "";
}
function renderLocCards(){
  const row=document.getElementById("locRow");
  if(!row) return;
  const counts={};
  (links||[]).forEach(l=>{
    const cc=detectCC(nameOf(l));
    if(cc) counts[cc]=(counts[cc]||0)+1;
  });
  const top=Object.keys(counts).sort((a,b)=>counts[b]-counts[a]).slice(0,3);
  if(!top.length){ row.innerHTML=""; row.style.display="none"; return; }
  row.style.display="flex";
  row.innerHTML=top.map(cc=>{
    const label=countryLabel(cc);
    return `<div class="loc-card" data-cc="${cc}"><div class="loc-bg"></div><div class="loc-fade"></div><div class="loc-name">${esc(label)}</div></div>`;
  }).join("");
}

function renderList(){const box=document.getElementById("list");if(!box)return;
  if((!links||!links.length)&&TV&&TV.links){links=String(TV.links).split(/\r?\n/).filter(Boolean);}
  if(!links.length){box.innerHTML=`<div class="card" style="text-align:center;color:var(--mu)">${t("none")}</div>`;return}
  box.innerHTML=links.map((l,i)=>`<div class="item"><div class="n">${esc(nameOf(l))}</div>
    <button class="mb" type="button" data-c="${i}"><i class="fa-solid fa-copy"></i></button>
    <button class="mb" type="button" data-q="${i}"><i class="fa-solid fa-qrcode"></i></button></div>`).join("");
  box.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>copy(links[+b.dataset.c]));
  box.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>qr(links[+b.dataset.q]));
  try{renderLocCards();}catch(e){}
}
function renderApps(){
  const cur=plat();
  const order=["iOS","Android","Windows","macOS","Linux"];
  const sorted=[...APPS].sort((a,b)=>{
    if(a.p===cur) return -1;
    if(b.p===cur) return 1;
    return order.indexOf(a.p)-order.indexOf(b.p);
  });
  const box=document.getElementById("apps");
  if(!box) return;
  box.innerHTML=sorted.map(g=>{
    const isCur=g.p===cur;
    const hot=isCur?" hot":"";
    const collapsed=isCur?"":" collapsed";
    const body=g.a.map(a=>{
      const cls=String(a.n).toLowerCase().replace(/[^a-z0-9]/g,"").slice(0,10);
      const letter=String(a.n).slice(0,1).toUpperCase();
      return `<a class="al" href="${a.u}" target="_blank" rel="noopener"><span class="app-badge ${cls}">${letter}</span><span>${a.n}</span>${a.r?'<span class="t">REC</span>':""}<span class="d"><i class="fa-solid fa-arrow-up-right-from-square"></i></span></a>`;
    }).join("");
    return `<div class="grp${hot}${collapsed}" data-plat="${g.p}"><h4 type="button"><i class="${g.i}"></i> ${g.p}${isCur?' <span class="t">★</span>':""}<i class="fa-solid fa-chevron-down chev"></i></h4><div class="grp-body">${body}</div></div>`;
  }).join("");
  box.querySelectorAll(".grp > h4").forEach(h=>{
    h.onclick=()=>{ h.parentElement.classList.toggle("collapsed"); };
  });
}
function extractHost(link){try{
  if(link.startsWith("vmess://")){const j=JSON.parse(atob(link.slice(8).replace(/-/g,"+").replace(/_/g,"/")));return{host:j.add||j.host||"",port:j.port||443,name:j.ps||""}}
  if(link.startsWith("ss://")){const m=link.match(/@([^:#/?]+)/);if(m)return{host:m[1],port:443,name:nameOf(link)}}
  const m=link.match(/@([^:#/?]+):?(\d+)?/);if(m)return{host:m[1],port:parseInt(m[2]||"443",10),name:nameOf(link)};
  const m2=link.match(/:\/\/(?:[^@/]+@)?([^:#/?]+)/);if(m2)return{host:m2[1],port:443,name:nameOf(link)};
}catch(e){}return{host:"",port:443,name:nameOf(link)}}

function loadLinksFallback(){
  if(links && links.length) return;
  const url=n(TV.subUrl,subUrl)||(location.origin+location.pathname);
  if(!url) return;
  fetch(url,{credentials:"same-origin",headers:{"Accept":"text/plain,*/*"}}).then(r=>{
    const ct=(r.headers.get("content-type")||"").toLowerCase();
    if(ct.indexOf("text/html")>=0) return null;
    return r.text();
  }).then(txt=>{
    if(!txt||!String(txt).trim()) return;
    let raw=String(txt).trim();
    // base64 subscription?
    try{
      if(!/^vless:|^vmess:|^trojan:|^ss:|^hysteria/i.test(raw) && /^[A-Za-z0-9+/=\s]+$/.test(raw.replace(/\s/g,""))){
        raw=atob(raw.replace(/\s/g,""));
      }
    }catch(e){}
    const arr=raw.split(/\r?\n/).map(s=>s.trim()).filter(s=>/^(vless|vmess|trojan|ss|ssr|hysteria|hy2|tuic|wireguard):\/\//i.test(s));
    if(!arr.length) return;
    links=arr;
    TV.links=arr.join("\n");
    try{renderList();renderQi();}catch(e){}
  }).catch(()=>{});
}
