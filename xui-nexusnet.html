<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>{{ .subTitle }}</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --font:"Inter","Vazirmatn",system-ui,sans-serif;
  --cyan:#00e5ff; --cyan2:#00b4d8; --blue:#0077b6;
  --bg:#01060f; --card:rgba(6,18,36,.72); --card2:rgba(8,24,48,.85);
  --border:rgba(0,229,255,.14); --text:#e8f7ff; --muted:#7a9bb0;
  --ok:#2dd4bf; --warn:#fbbf24; --bad:#f87171;
  --radius:18px;
}
html[data-theme="light"]{
  --bg:#e8f4fc; --card:rgba(255,255,255,.82); --card2:#fff;
  --border:rgba(0,119,182,.18); --text:#0a1a28; --muted:#4a6a7a;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  font-family:var(--font);color:var(--text);min-height:100vh;
  background-color:var(--bg);
  background-image:
    linear-gradient(180deg,rgba(1,6,15,.55) 0%,rgba(1,6,15,.82) 55%,rgba(1,6,15,.95) 100%),
    url("https://raw.githubusercontent.com/SiNaKeEn/NexusNet-Sub/Themes/logo-nexusnet.png");
  background-size:cover, cover;
  background-position:center, center;
  background-attachment:fixed;
  display:flex;justify-content:center;
}
html[data-theme="light"] body{
  background-image:
    linear-gradient(180deg,rgba(232,244,252,.88) 0%,rgba(232,244,252,.95) 100%),
    url("https://raw.githubusercontent.com/SiNaKeEn/NexusNet-Sub/Themes/logo-nexusnet.png");
}
.shell{width:100%;max-width:440px;min-height:100vh;padding:1rem 1rem 5.5rem;position:relative}
@media(min-width:900px){
  .shell{max-width:960px;padding:1.5rem 1.5rem 2rem;margin:1.25rem auto;border-radius:24px;
    background:rgba(1,8,20,.55);border:1px solid var(--border);backdrop-filter:blur(20px);
    box-shadow:0 0 80px rgba(0,180,255,.1);min-height:auto}
  .desk-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:1.25rem;align-items:start}
}
/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;gap:.75rem}
.brand{display:flex;align-items:center;gap:.65rem}
.brand img{width:42px;height:42px;border-radius:12px;object-fit:cover;
  box-shadow:0 0 20px rgba(0,229,255,.45);border:1px solid var(--border)}
.brand h1{font-size:1.15rem;font-weight:800;letter-spacing:.03em;background:linear-gradient(90deg,var(--cyan),#fff);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent}
.brand .sub{font-size:.72rem;color:var(--muted);margin-top:2px}
.actions{display:flex;gap:.4rem;align-items:center}
.ibtn{width:38px;height:38px;border-radius:12px;border:1px solid var(--border);
  background:var(--card);color:var(--text);display:grid;place-items:center;cursor:pointer;font-size:.9rem}
.ibtn:active{transform:scale(.95)}
.lang-box{position:relative}
.lang-menu{display:none;position:absolute;top:44px;left:0;min-width:110px;background:var(--card2);
  border:1px solid var(--border);border-radius:12px;overflow:hidden;z-index:30}
.lang-box.open .lang-menu{display:block}
.lang-menu button{display:block;width:100%;padding:.55rem .8rem;border:0;background:transparent;
  color:var(--text);font-family:var(--font);font-size:.8rem;font-weight:600;cursor:pointer;text-align:left}
.lang-menu button:hover{background:rgba(0,229,255,.12)}
/* cards */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:1.1rem;margin-bottom:1rem;backdrop-filter:blur(16px)}
.hero{text-align:center;padding:1.4rem 1.1rem}
.hero .status{display:inline-flex;align-items:center;gap:.35rem;font-size:.75rem;font-weight:700;
  padding:.3rem .75rem;border-radius:999px;margin-bottom:.85rem}
.status.on{background:rgba(45,212,191,.15);color:var(--ok)}
.status.off{background:rgba(248,113,113,.15);color:var(--bad)}
.ring-wrap{width:130px;height:130px;margin:0 auto .9rem;position:relative}
.ring-wrap svg{transform:rotate(-90deg)}
.ring-wrap .pct{position:absolute;inset:0;display:grid;place-items:center;font-size:1.35rem;font-weight:800}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.5rem;margin-top:.5rem}
.stat{background:rgba(0,0,0,.2);border-radius:12px;padding:.65rem .4rem;text-align:center}
.stat b{display:block;font-size:.85rem;font-weight:700}
.stat span{font-size:.65rem;color:var(--muted)}
.btnrow{display:flex;gap:.5rem;margin-top:1rem;flex-wrap:wrap}
.btn{flex:1;min-width:120px;padding:.75rem 1rem;border-radius:14px;border:0;font-family:var(--font);
  font-weight:700;font-size:.85rem;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:.4rem}
.btn-main{background:linear-gradient(135deg,var(--cyan2),var(--blue));color:#fff;
  box-shadow:0 4px 20px rgba(0,180,255,.3)}
.btn-ghost{background:var(--card);border:1px solid var(--border);color:var(--text)}
.btn:active{transform:scale(.97)}
.sec-title{font-size:.9rem;font-weight:800;margin:1.1rem 0 .65rem;display:flex;align-items:center;gap:.4rem}
.sec-title i{color:var(--cyan)}
.qi{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.qi a{display:flex;align-items:center;justify-content:center;gap:.4rem;padding:.7rem;
  border-radius:12px;background:rgba(0,229,255,.08);border:1px solid var(--border);
  color:var(--text);text-decoration:none;font-size:.8rem;font-weight:600}
.qi a:hover{background:rgba(0,229,255,.16)}
.link-row{display:flex;align-items:center;gap:.5rem;padding:.7rem;background:rgba(0,0,0,.18);
  border-radius:12px;margin-bottom:.45rem}
.link-row .nm{flex:1;font-size:.8rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mbtn{width:34px;height:34px;border-radius:10px;border:1px solid var(--border);background:var(--card);
  color:var(--text);display:grid;place-items:center;cursor:pointer;font-size:.8rem}
.app-g{margin-bottom:.9rem}
.app-g h4{font-size:.8rem;color:var(--muted);margin-bottom:.4rem;display:flex;align-items:center;gap:.35rem}
.app-g.hot{border:1px solid rgba(0,229,255,.3);border-radius:14px;padding:.75rem;background:rgba(0,229,255,.05)}
.app-a{display:flex;align-items:center;gap:.5rem;padding:.6rem .7rem;border-radius:10px;
  background:rgba(0,0,0,.15);color:var(--text);text-decoration:none;font-size:.82rem;font-weight:600;margin-bottom:.35rem}
.app-a img{width:24px;height:24px;border-radius:6px;object-fit:contain}
.app-a .star{color:var(--cyan);font-size:.7rem}
/* bottom nav mobile */
.bnav{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);width:calc(100% - 24px);
  max-width:420px;display:flex;justify-content:space-around;padding:.55rem;
  background:var(--card2);border:1px solid var(--border);border-radius:18px;backdrop-filter:blur(20px);z-index:40}
.bnav button{background:0;border:0;color:var(--muted);font-family:var(--font);font-size:.65rem;
  display:flex;flex-direction:column;align-items:center;gap:.15rem;cursor:pointer;padding:.25rem .6rem;border-radius:12px}
.bnav button i{font-size:1.1rem}
.bnav button.on{color:var(--cyan);background:rgba(0,229,255,.1)}
@media(min-width:900px){
  .bnav{position:static;transform:none;max-width:none;width:100%;margin-bottom:1rem;border-radius:16px}
}
.tab{display:none}.tab.on{display:block}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-20px);opacity:0;
  background:var(--card2);border:1px solid var(--border);padding:.65rem 1.2rem;border-radius:999px;
  font-size:.85rem;font-weight:700;z-index:100;transition:.3s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#qrM{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:90;align-items:center;justify-content:center}
#qrM.open{display:flex}
.qrbox{background:var(--card2);border:1px solid var(--border);border-radius:20px;padding:1.5rem;text-align:center}
#qrcode{display:flex;justify-content:center;margin:1rem 0}
.footer{text-align:center;font-size:.7rem;color:var(--muted);margin-top:1.5rem;opacity:.7}
</style>
</head>
<body>
<div class="shell">
  <div class="top">
    <div class="brand">
      <img src="https://raw.githubusercontent.com/SiNaKeEn/NexusNet-Sub/Themes/logo-nexusnet.png" alt="NexusNet" onerror="this.style.display='none'"/>
      <div>
        <h1 id="title">NexusNet</h1>
        <div class="sub" id="userLine">—</div>
      </div>
    </div>
    <div class="actions">
      <div class="lang-box" id="langBox">
        <button class="ibtn" id="langBtn" type="button"><i class="fa-solid fa-language"></i></button>
        <div class="lang-menu">
          <button type="button" data-lang="fa">فارسی</button>
          <button type="button" data-lang="en">English</button>
        </div>
      </div>
      <button class="ibtn" id="themeBtn" type="button"><i class="fa-solid fa-moon"></i></button>
    </div>
  </div>

  <nav class="bnav" id="bnav">
    <button type="button" class="on" data-tab="home"><i class="fa-solid fa-house"></i><span id="nHome">Home</span></button>
    <button type="button" data-tab="configs"><i class="fa-solid fa-server"></i><span id="nCfg">Configs</span></button>
    <button type="button" data-tab="apps"><i class="fa-solid fa-mobile-screen"></i><span id="nApps">Apps</span></button>
  </nav>

  <div class="desk-grid">
  <div>
  <div id="tab-home" class="tab on">
    <div class="card hero">
      <div class="status" id="statusBadge"><i class="fa-solid fa-circle" style="font-size:.5rem"></i> <span id="statusTxt">—</span></div>
      <div class="ring-wrap">
        <svg width="130" height="130" viewBox="0 0 130 130">
          <circle cx="65" cy="65" r="56" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="10"/>
          <circle id="ring" cx="65" cy="65" r="56" fill="none" stroke="url(#g)" stroke-width="10"
            stroke-linecap="round" stroke-dasharray="351.86" stroke-dashoffset="351.86"/>
          <defs><linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#00e5ff"/><stop offset="100%" stop-color="#0077b6"/>
          </linearGradient></defs>
        </svg>
        <div class="pct" id="pctTxt">0%</div>
      </div>
      <div class="stats">
        <div class="stat"><b id="usedTxt">—</b><span id="lUsed">Used</span></div>
        <div class="stat"><b id="limitTxt">—</b><span id="lLimit">Limit</span></div>
        <div class="stat"><b id="expTxt">—</b><span id="lExp">Expire</span></div>
      </div>
      <div class="btnrow">
        <button class="btn btn-main" id="copySub"><i class="fa-solid fa-copy"></i> <span id="tCopy">Copy Sub</span></button>
        <button class="btn btn-ghost" id="qrSub"><i class="fa-solid fa-qrcode"></i> QR</button>
      </div>
    </div>
    <div class="sec-title"><i class="fa-solid fa-bolt"></i> <span id="tQi">Quick Connect</span></div>
    <div class="qi" id="qiGrid"></div>
  </div>

  <div id="tab-configs" class="tab">
    <div class="sec-title"><i class="fa-solid fa-link"></i> <span id="tCfg">Configs</span></div>
    <div class="btnrow" style="margin-bottom:.75rem">
      <button class="btn btn-ghost" id="copyAll"><i class="fa-solid fa-copy"></i> <span id="tCopyAll">Copy All</span></button>
    </div>
    <div id="linksList"></div>
  </div>
  </div>

  <div id="tab-apps" class="tab">
    <div class="sec-title"><i class="fa-solid fa-download"></i> <span id="tApps">Clients</span></div>
    <div id="appsList"></div>
  </div>
  </div>

  <div class="footer">NexusNet · Secure Access</div>
</div>

<div class="toast" id="toast"></div>
<div id="qrM"><div class="qrbox"><div id="qrcode"></div>
<button class="btn btn-main" type="button" onclick="document.getElementById('qrM').classList.remove('open')">OK</button>
</div></div>

<script>
const TV = {
  sId: "{{ .sId }}",
  enabled: "{{ .enabled }}",
  isOnline: "{{ .isOnline }}",
  downloadByte: "{{ .downloadByte }}",
  uploadByte: "{{ .uploadByte }}",
  totalByte: "{{ .totalByte }}",
  expire: "{{ .expire }}",
  lastOnline: "{{ .lastOnline }}",
  subUrl: "{{ .subUrl }}",
  subJsonUrl: "{{ .subJsonUrl }}",
  subClashUrl: "{{ .subClashUrl }}",
  subTitle: "{{ .subTitle }}",
  subSupportUrl: "{{ .subSupportUrl }}",
  announce: `{{ .announce }}`,
  links: `{{ range .links }}{{ . }}\n{{ end }}`,
  emails: `{{ range .emails }}{{ . }}\n{{ end }}`,
};

const APPS = [
  { platform:"Android", icon:"fa-brands fa-android", apps:[
    {name:"Happ", url:"https://play.google.com/store/apps/details?id=com.happproxy", rec:true},
    {name:"v2rayNG", url:"https://github.com/2dust/v2rayNG/releases"},
    {name:"V2Box", url:"https://play.google.com/store/apps/details?id=dev.hexasoftware.v2box"},
    {name:"Hiddify", url:"https://github.com/hiddify/hiddify-app/releases"},
  ]},
  { platform:"iOS", icon:"fa-brands fa-apple", apps:[
    {name:"Happ", url:"https://apps.apple.com/app/id6504287215", rec:true},
    {name:"Streisand", url:"https://apps.apple.com/app/id6450534064"},
    {name:"V2Box", url:"https://apps.apple.com/app/id6446814690"},
    {name:"Shadowrocket", url:"https://apps.apple.com/app/id932747118"},
  ]},
  { platform:"Windows", icon:"fa-brands fa-windows", apps:[
    {name:"Happ", url:"https://github.com/Happ-proxy/happ-desktop/releases", rec:true},
    {name:"Throne", url:"https://github.com/throneproj/Throne/releases", rec:true},
    {name:"Hiddify", url:"https://github.com/hiddify/hiddify-app/releases"},
    {name:"v2rayN", url:"https://github.com/2dust/v2rayN/releases"},
  ]},
  { platform:"macOS", icon:"fa-brands fa-apple", apps:[
    {name:"Happ", url:"https://apps.apple.com/app/id6504287215", rec:true},
    {name:"Hiddify", url:"https://github.com/hiddify/hiddify-app/releases"},
    {name:"V2Box", url:"https://apps.apple.com/app/id6446814690"},
  ]},
  { platform:"Linux", icon:"fa-brands fa-linux", apps:[
    {name:"Happ", url:"https://github.com/Happ-proxy/happ-desktop/releases", rec:true},
    {name:"Throne", url:"https://github.com/throneproj/Throne/releases", rec:true},
    {name:"Hiddify", url:"https://github.com/hiddify/hiddify-app/releases"},
  ]},
];

const QI = [
  {name:"Happ", icon:"fa-solid fa-bolt", scheme:"happ://add/{SUB_URL}"},
  {name:"Hiddify", icon:"fa-solid fa-shield-halved", scheme:"hiddify://import/{SUB_URL}"},
  {name:"v2rayNG", icon:"fa-brands fa-android", scheme:"v2rayng://install-config?url={SUB_URL_ENCODED}"},
  {name:"V2Box", icon:"fa-solid fa-box-open", scheme:"v2box://install-sub?url={SUB_URL_ENCODED}&title={SUB_TITLE}"},
];

const I18N = {
  fa:{
    home:"خانه", cfg:"کانفیگ", apps:"برنامه‌ها", used:"مصرف", limit:"سقف", exp:"انقضا",
    copy:"کپی اشتراک", qi:"اتصال سریع", configs:"کانفیگ‌ها", copyAll:"کپی همه", clients:"کلاینت‌ها",
    active:"فعال", inactive:"غیرفعال", online:"آنلاین", offline:"آفلاین", unlimited:"نامحدود",
    days:"روز", copied:"کپی شد!", noCfg:"کانفیگی نیست"
  },
  en:{
    home:"Home", cfg:"Configs", apps:"Apps", used:"Used", limit:"Limit", exp:"Expire",
    copy:"Copy Sub", qi:"Quick Connect", configs:"Configs", copyAll:"Copy All", clients:"Clients",
    active:"Active", inactive:"Inactive", online:"Online", offline:"Offline", unlimited:"Unlimited",
    days:"days", copied:"Copied!", noCfg:"No configs"
  }
};

let lang = localStorage.getItem("nx_lang") || "fa";
let dark = localStorage.getItem("nx_theme") !== "light";

function t(k){ return (I18N[lang]||I18N.en)[k]||k; }
function isPh(v){ return typeof v==="string" && v.includes("{{") && v.includes("}}"); }
function norm(v,fb){ let s=String(v??"").trim(); return (!s||isPh(s))?fb:s; }
function toNum(v){ let s=norm(v,""); if(!s)return null; let n=Number(s.replace(/[,\s]/g,"")); return isNaN(n)?null:n; }
function fmtBytes(b){
  b=Number(b)||0; if(b<=0)return "0 B";
  const u=["B","KB","MB","GB","TB"]; let i=0;
  while(b>=1024 && i<u.length-1){b/=1024;i++;}
  return b.toFixed(i>1?2:0)+" "+u[i];
}
function toast(m){ const el=document.getElementById("toast"); el.textContent=m; el.classList.add("show"); setTimeout(()=>el.classList.remove("show"),1600); }
function copy(txt){ navigator.clipboard.writeText(txt).then(()=>toast(t("copied"))).catch(()=>toast("Error")); }

function detectOS(){
  const ua=(navigator.userAgent||"").toLowerCase();
  const p=(navigator.platform||"").toLowerCase();
  if(/android/.test(ua)) return "Android";
  if(/iphone|ipad|ipod/.test(ua)) return "iOS";
  if(/win/.test(p)||/windows/.test(ua)) return "Windows";
  if(/mac/.test(p)&&!/iphone|ipad/.test(ua)) return "macOS";
  if(/linux/.test(p)||/linux/.test(ua)) return "Linux";
  return "Unknown";
}

const subUrl = norm(TV.subUrl, location.href.split("?")[0]);
const subTitle = norm(TV.subTitle, "NexusNet");
const links = norm(TV.links,"").split(/\r?\n/).filter(l=>l.trim());
const emails = norm(TV.emails,"").split(/[,\s]+/).filter(Boolean);

function applyLang(){
  document.documentElement.lang = lang;
  document.documentElement.dir = lang==="fa"?"rtl":"ltr";
  document.getElementById("nHome").textContent=t("home");
  document.getElementById("nCfg").textContent=t("cfg");
  document.getElementById("nApps").textContent=t("apps");
  document.getElementById("lUsed").textContent=t("used");
  document.getElementById("lLimit").textContent=t("limit");
  document.getElementById("lExp").textContent=t("exp");
  document.getElementById("tCopy").textContent=t("copy");
  document.getElementById("tQi").textContent=t("qi");
  document.getElementById("tCfg").textContent=t("configs");
  document.getElementById("tCopyAll").textContent=t("copyAll");
  document.getElementById("tApps").textContent=t("clients");
  localStorage.setItem("nx_lang", lang);
}

function applyTheme(){
  document.documentElement.setAttribute("data-theme", dark?"dark":"light");
  document.getElementById("themeBtn").innerHTML = dark?'<i class="fa-solid fa-sun"></i>':'<i class="fa-solid fa-moon"></i>';
  localStorage.setItem("nx_theme", dark?"dark":"light");
}

function initData(){
  document.getElementById("title").textContent = subTitle || "NexusNet";
  document.getElementById("userLine").textContent = emails[0] || ("ID: "+norm(TV.sId,"—"));

  const en = norm(TV.enabled,"true");
  const online = norm(TV.isOnline,"");
  const badge = document.getElementById("statusBadge");
  const st = document.getElementById("statusTxt");
  if(en==="false"||en==="0"){ badge.className="status off"; st.textContent=t("inactive"); }
  else { badge.className="status on"; st.textContent = (online==="true"||online==="1")?t("online"):t("active"); }

  const down=toNum(TV.downloadByte)||0, up=toNum(TV.uploadByte)||0, total=toNum(TV.totalByte)||0;
  const used=down+up;
  document.getElementById("usedTxt").textContent=fmtBytes(used);
  document.getElementById("limitTxt").textContent=total?fmtBytes(total):t("unlimited");
  let pct=0;
  if(total>0){ pct=Math.min(100, Math.round(used/total*100)); }
  document.getElementById("pctTxt").textContent=total?pct+"%":"∞";
  const circ=351.86;
  document.getElementById("ring").style.strokeDashoffset = total ? (circ - circ*pct/100) : circ;

  const exp=toNum(TV.expire);
  if(exp){
    const ms=exp<1e12?exp*1000:exp;
    const days=Math.ceil((ms-Date.now())/86400000);
    document.getElementById("expTxt").textContent = days>0 ? days+" "+t("days") : "0";
  } else document.getElementById("expTxt").textContent=t("unlimited");
}

function renderQI(){
  const enc=encodeURIComponent(subUrl);
  const title=encodeURIComponent(subTitle);
  document.getElementById("qiGrid").innerHTML = QI.map(a=>{
    const href=a.scheme.replace("{SUB_URL}",subUrl).replace("{SUB_URL_ENCODED}",enc).replace("{SUB_TITLE}",title);
    return `<a href="${href}"><i class="${a.icon}"></i> ${a.name}</a>`;
  }).join("");
}

function renderLinks(){
  const box=document.getElementById("linksList");
  if(!links.length){ box.innerHTML=`<div class="card" style="text-align:center;color:var(--muted)">${t("noCfg")}</div>`; return; }
  box.innerHTML=links.map((l,i)=>{
    const nm=(l.split("#")[1]||("Config "+(i+1))).substring(0,48);
    return `<div class="link-row"><span class="nm">${nm}</span>
      <button class="mbtn" type="button" data-c="${i}"><i class="fa-solid fa-copy"></i></button>
      <button class="mbtn" type="button" data-q="${i}"><i class="fa-solid fa-qrcode"></i></button></div>`;
  }).join("");
  box.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>copy(links[+b.dataset.c]));
  box.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>showQR(links[+b.dataset.q]));
}

function renderApps(){
  const os=detectOS();
  const sorted=[...APPS].sort((a,b)=>(a.platform===os?-1:0)-(b.platform===os?-1:0));
  document.getElementById("appsList").innerHTML=sorted.map(g=>{
    const hot=g.platform===os?" hot":"";
    return `<div class="app-g${hot}"><h4><i class="${g.icon}"></i> ${g.platform}${g.platform===os?" ●":""}</h4>
      ${g.apps.map(a=>`<a class="app-a" href="${a.url}" target="_blank" rel="noopener">${a.name}${a.rec?' <span class="star">★</span>':''}<span style="margin-inline-start:auto;opacity:.5"><i class="fa-solid fa-download"></i></span></a>`).join("")}
    </div>`;
  }).join("");
}

function showQR(txt){
  const box=document.getElementById("qrcode"); box.innerHTML="";
  new QRCode(box,{text:txt,width:180,height:180});
  document.getElementById("qrM").classList.add("open");
}

document.getElementById("copySub").onclick=()=>copy(subUrl);
document.getElementById("qrSub").onclick=()=>showQR(subUrl);
document.getElementById("copyAll").onclick=()=>copy(links.join("\n"));
document.getElementById("themeBtn").onclick=()=>{ dark=!dark; applyTheme(); };
document.getElementById("langBtn").onclick=e=>{ e.stopPropagation(); document.getElementById("langBox").classList.toggle("open"); };
document.querySelectorAll(".lang-menu button").forEach(b=>b.onclick=()=>{ lang=b.dataset.lang; applyLang(); document.getElementById("langBox").classList.remove("open"); initData(); });
document.addEventListener("click",()=>document.getElementById("langBox").classList.remove("open"));
document.querySelectorAll(".bnav button").forEach(btn=>{
  btn.onclick=()=>{
    document.querySelectorAll(".bnav button").forEach(x=>x.classList.remove("on"));
    document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));
    btn.classList.add("on");
    document.getElementById("tab-"+btn.dataset.tab).classList.add("on");
  };
});

applyTheme(); applyLang(); initData(); renderQI(); renderLinks(); renderApps();
</script>
</body>
</html>
